<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Animated Beam Component</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* DreamyHook Theme Variables */
        :root {
            /* Brand Colors */
            --color-primary: #FCBF49;        /* Marigold Yellow */
            --color-secondary: #0A1128;      /* Midnight Blue */
            --color-accent: #FFD23F;         /* Buttercup Yellow */
            --color-coral: #FF6B4A;          /* Coral */
            --color-sky: #0ea5e9;            /* Sky Blue */

            /* Neutral Colors */
            --color-neutral-100: #ffffff;
            --color-neutral-200: #fffef9;
            --color-neutral-300: #fffdf0;
            --color-neutral-400: #fef9e7;
            --color-neutral-500: #78716c;
            --color-neutral-600: #57534e;
            --color-neutral-700: #44403c;
            --color-neutral-800: #292524;
            --color-neutral-900: #1c1917;

            /* Semantic Colors */
            --color-light: var(--color-neutral-200);
            --color-dark: var(--color-secondary);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
            color: var(--color-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FCBF49 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.125rem;
            color: var(--color-neutral-600);
        }

        .demo-container {
            position: relative;
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 1.5rem;
            border: 2px solid rgba(252, 191, 73, 0.2);
            box-shadow: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            overflow: hidden;
            padding: 2.5rem;
        }

        .grid-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 32rem;
            max-height: 200px;
            justify-content: space-between;
            gap: 2.5rem;
        }

        .grid-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .circle {
            z-index: 10;
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid var(--color-primary);
            background: #ffffff;
            padding: 0.75rem;
            box-shadow: 0 4px 20px 0 rgba(252, 191, 73, 0.15);
            transition: all 0.3s ease;
        }

        .circle:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px 0 rgba(252, 191, 73, 0.5);
        }

        .circle.center {
            width: 4rem;
            height: 4rem;
            border-color: var(--color-accent);
            box-shadow: 0 0 20px rgba(255, 210, 63, 0.3);
        }

        .circle svg {
            width: 100%;
            height: 100%;
        }

        .animated-beam-svg {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .beam-path {
            fill: none;
            stroke: rgba(10, 17, 40, 0.2);
            stroke-width: 2;
            stroke-linecap: round;
        }

        .beam-gradient-path {
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            opacity: 1;
        }

        @keyframes beam-animate {
            0% {
                stroke-dashoffset: 1000;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .demo-container {
                height: 400px;
                padding: 1.5rem;
            }

            .circle {
                width: 2.5rem;
                height: 2.5rem;
            }

            .circle.center {
                width: 3.5rem;
                height: 3.5rem;
            }
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            color: var(--color-neutral-600);
            font-size: 0.875rem;
        }

        .footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

    <script>
        class AnimatedBeam {
            constructor(options) {
                this.containerRef = options.containerRef;
                this.fromRef = options.fromRef;
                this.toRef = options.toRef;
                this.curvature = options.curvature || 0;
                this.reverse = options.reverse || false;
                this.duration = options.duration || (Math.random() * 3 + 4);
                this.delay = options.delay || 0;
                this.pathColor = options.pathColor || 'rgba(10, 17, 40, 0.2)';
                this.pathWidth = options.pathWidth || 2;
                this.gradientStartColor = options.gradientStartColor || '#FCBF49';
                this.gradientStopColor = options.gradientStopColor || '#FFD23F';
                this.startXOffset = options.startXOffset || 0;
                this.startYOffset = options.startYOffset || 0;
                this.endXOffset = options.endXOffset || 0;
                this.endYOffset = options.endYOffset || 0;
                this.svgElement = options.svgElement;

                this.id = 'gradient-' + Math.random().toString(36).substr(2, 9);
                this.init();
            }

            init() {
                this.updatePath();
                this.setupResizeObserver();
                this.startAnimation();
            }

            updatePath() {
                if (!this.containerRef || !this.fromRef || !this.toRef) return;

                const containerRect = this.containerRef.getBoundingClientRect();
                const rectA = this.fromRef.getBoundingClientRect();
                const rectB = this.toRef.getBoundingClientRect();

                const startX = rectA.left - containerRect.left + rectA.width / 2 + this.startXOffset;
                const startY = rectA.top - containerRect.top + rectA.height / 2 + this.startYOffset;
                const endX = rectB.left - containerRect.left + rectB.width / 2 + this.endXOffset;
                const endY = rectB.top - containerRect.top + rectB.height / 2 + this.endYOffset;

                const controlY = startY - this.curvature;
                this.pathD = `M ${startX},${startY} Q ${(startX + endX) / 2},${controlY} ${endX},${endY}`;

                this.renderSVG();
            }

            renderSVG() {
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                // Base path
                const basePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                basePath.setAttribute('d', this.pathD);
                basePath.setAttribute('stroke', this.pathColor);
                basePath.setAttribute('stroke-width', this.pathWidth);
                basePath.setAttribute('fill', 'none');
                basePath.setAttribute('stroke-linecap', 'round');

                // Gradient path
                const gradientPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                gradientPath.setAttribute('d', this.pathD);
                gradientPath.setAttribute('stroke', `url(#${this.id})`);
                gradientPath.setAttribute('stroke-width', this.pathWidth);
                gradientPath.setAttribute('fill', 'none');
                gradientPath.setAttribute('stroke-linecap', 'round');
                gradientPath.classList.add('beam-gradient-path');

                // Create gradient
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                gradient.setAttribute('id', this.id);
                gradient.setAttribute('gradientUnits', 'userSpaceOnUse');

                const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop1.setAttribute('stop-color', this.gradientStartColor);
                stop1.setAttribute('stop-opacity', '0');
                stop1.setAttribute('offset', '0%');

                const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop2.setAttribute('stop-color', this.gradientStartColor);
                stop2.setAttribute('offset', '10%');

                const stop3 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop3.setAttribute('stop-color', this.gradientStopColor);
                stop3.setAttribute('offset', '32.5%');

                const stop4 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop4.setAttribute('stop-color', this.gradientStopColor);
                stop4.setAttribute('stop-opacity', '0');
                stop4.setAttribute('offset', '100%');

                gradient.appendChild(stop1);
                gradient.appendChild(stop2);
                gradient.appendChild(stop3);
                gradient.appendChild(stop4);
                defs.appendChild(gradient);

                group.appendChild(defs);
                group.appendChild(basePath);
                group.appendChild(gradientPath);

                this.svgElement.appendChild(group);
                this.gradientElement = gradient;
                this.gradientPathElement = gradientPath;
            }

            startAnimation() {
                if (!this.gradientElement) return;

                const x1Start = this.reverse ? '90%' : '10%';
                const x1End = this.reverse ? '-10%' : '110%';
                const x2Start = this.reverse ? '100%' : '0%';
                const x2End = this.reverse ? '0%' : '100%';

                let startTime = null;
                const animate = (timestamp) => {
                    if (!startTime) startTime = timestamp - (this.delay * 1000);
                    const elapsed = timestamp - startTime;
                    const progress = (elapsed % (this.duration * 1000)) / (this.duration * 1000);

                    // Easing function (easeOutExpo)
                    const eased = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);

                    const currentX1 = this.interpolate(parseFloat(x1Start), parseFloat(x1End), eased);
                    const currentX2 = this.interpolate(parseFloat(x2Start), parseFloat(x2End), eased);

                    this.gradientElement.setAttribute('x1', currentX1 + '%');
                    this.gradientElement.setAttribute('x2', currentX2 + '%');
                    this.gradientElement.setAttribute('y1', '0%');
                    this.gradientElement.setAttribute('y2', '0%');

                    requestAnimationFrame(animate);
                };

                requestAnimationFrame(animate);
            }

            interpolate(start, end, progress) {
                return start + (end - start) * progress;
            }

            setupResizeObserver() {
                const resizeObserver = new ResizeObserver(() => {
                    this.updatePath();
                });

                if (this.containerRef) {
                    resizeObserver.observe(this.containerRef);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('demoContainer');

            // Create animated beams
            new AnimatedBeam({

                toRef: circle4,
                curvature: -75,
                endYOffset: -10,
                svgElement: svgElement,

            new AnimatedBeam({

            });

            new AnimatedBeam({
                containerRef: container,

                toRef: circle4,

                endYOffset: -10,
                reverse: true,
                svgElement: svgElement,
                gradientStartColor: '#FF6B4A',
                gradientStopColor: '#FCBF49'
            });

            new AnimatedBeam({
                containerRef: container,
                fromRef: circle6,
                toRef: circle4,
                reverse: true,
                svgElement: svgElement,
                gradientStartColor: '#0ea5e9',
                gradientStopColor: '#FFD23F'
            });

            new AnimatedBeam({
                containerRef: container,
                fromRef: circle7,
                toRef: circle4,
                curvature: 75,
                endYOffset: 10,
                reverse: true,
                svgElement: svgElement,
                gradientStartColor: '#FFD23F',
                gradientStopColor: '#FCBF49',
                duration: 5
            });
        });
    </script>
