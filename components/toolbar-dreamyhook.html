<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Text Formatting Toolbar</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ========== DreamyHook Theme Variables ========== */
        :root {
            /* Brand Colors */
            --color-primary: #FCBF49;        /* Marigold Yellow */
            --color-secondary: #0A1128;      /* Midnight Blue */
            --color-accent: #FFD23F;         /* Buttercup Yellow */
            --color-coral: #FF6B4A;          /* Coral */
            --color-sky: #0ea5e9;            /* Sky Blue */

            /* Neutral Colors */
            --color-neutral-100: #ffffff;
            --color-neutral-200: #fffef9;
            --color-neutral-300: #fffdf0;
            --color-neutral-400: #fef9e7;
            --color-neutral-500: #78716c;
            --color-neutral-600: #57534e;
            --color-neutral-700: #44403c;
            --color-neutral-800: #292524;
            --color-neutral-900: #1c1917;

            /* Semantic Colors */
            --color-text-dark: var(--color-secondary);
            --color-bg-light: var(--color-neutral-200);

            /* Typography */
            --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
            --font-heading: 'Poppins', ui-sans-serif, system-ui, sans-serif;

            /* Shadows */
            --shadow-soft: 0 2px 15px 0 rgba(10, 17, 40, 0.05);
            --shadow-medium: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            --shadow-hard: 0 10px 40px 0 rgba(10, 17, 40, 0.15);
            --shadow-marigold: 0 4px 25px 0 rgba(252, 191, 73, 0.25);
            --shadow-glow-marigold: 0 0 30px 0 rgba(252, 191, 73, 0.25);

            /* Animation */
            --transition-default: 0.3s ease;
        }

        /* ========== Reset & Base Styles ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
            color: var(--color-text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ========== Selection Styling ========== */
        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }

        ::-moz-selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }

        /* ========== Container ========== */
        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        /* ========== Header ========== */
        .header {
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-family: var(--font-heading);
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FCBF49 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.125rem;
            color: var(--color-neutral-600);
            font-weight: 400;
        }

        /* ========== Toolbar Container ========== */
        .toolbar-demo {
            position: relative;
            width: 100%;
            min-height: 400px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 254, 249, 0.95) 100%);
            border-radius: 24px;
            padding: 60px 40px;
            box-shadow: var(--shadow-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
            backdrop-filter: blur(10px);
        }

        /* ========== Toolbar ========== */
        .toolbar {
            background: var(--color-secondary);
            border-radius: 12px;
            padding: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-hard);
            border: 1px solid rgba(252, 191, 73, 0.1);
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s backwards;
            flex-wrap: wrap;
            max-width: 100%;
        }

        /* ========== Toolbar Button ========== */
        .toolbar-button {
            position: relative;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-default);
            color: var(--color-neutral-100);
        }

        .toolbar-button:hover {
            background: rgba(252, 191, 73, 0.15);
            transform: translateY(-2px);
        }

        .toolbar-button:active {
            transform: translateY(0);
        }

        .toolbar-button.active {
            background: rgba(252, 191, 73, 0.2);
            color: var(--color-primary);
        }

        .toolbar-button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(252, 191, 73, 0.3);
        }

        .toolbar-button svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }

        /* ========== Divider ========== */
        .toolbar-divider {
            width: 1px;
            height: 32px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 4px;
        }

        /* ========== Tooltip ========== */
        .tooltip {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-neutral-800);
            color: var(--color-neutral-100);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            white-space: nowrap;
            box-shadow: var(--shadow-medium);
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            animation: tooltipFadeIn 0.2s ease-out forwards;
        }

        .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--color-neutral-800);
        }

        /* ========== Footer ========== */
        .footer {
            margin-top: 40px;
            text-align: center;
            animation: fadeIn 1s ease-out 0.6s backwards;
        }

        .footer p {
            color: var(--color-neutral-600);
            font-size: 0.875rem;
        }

        .footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--transition-default);
        }

        .footer a:hover {
            color: var(--color-accent);
            text-decoration: underline;
        }

        /* ========== Animations ========== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes tooltipFadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ========== Responsive Design ========== */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .toolbar-demo {
                padding: 40px 20px;
                min-height: 300px;
            }

            .toolbar {
                padding: 6px;
                gap: 4px;
            }

            .toolbar-button {
                width: 36px;
                height: 36px;
            }

            .toolbar-button svg {
                width: 16px;
                height: 16px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.75rem;
            }

            .header p {
                font-size: 1rem;
            }

            .toolbar {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>DreamyHook Toolbar</h1>
            <p>Beautiful text formatting toolbar with DreamyHook brand theme</p>
        </div>

        <!-- Toolbar Demo -->
        <div class="toolbar-demo">
            <div class="toolbar" id="toolbar">
                <!-- Bold -->
                <button class="toolbar-button" data-action="bold" data-tooltip="Bold" aria-label="Bold">
                    <svg viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
                </button>

                <!-- Italic -->
                <button class="toolbar-button" data-action="italic" data-tooltip="Italic" aria-label="Italic">
                    <svg viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
                </button>

                <!-- Underline -->
                <button class="toolbar-button" data-action="underline" data-tooltip="Underline" aria-label="Underline">
                    <svg viewBox="0 0 24 24"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
                </button>

                <!-- Strikethrough -->
                <button class="toolbar-button" data-action="strikethrough" data-tooltip="Strikethrough" aria-label="Strikethrough">
                    <svg viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
                </button>

                <!-- Link -->
                <button class="toolbar-button" data-action="link" data-tooltip="Link" aria-label="Link">
                    <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                </button>

                <!-- Heading -->
                <button class="toolbar-button" data-action="heading" data-tooltip="Heading" aria-label="Heading">
                    <svg viewBox="0 0 24 24"><path d="M6 12h12"/><path d="M6 20V4"/><path d="M18 20V4"/></svg>
                </button>

                <!-- Quote -->
                <button class="toolbar-button" data-action="quote" data-tooltip="Quote" aria-label="Quote">
                    <svg viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
                </button>

                <!-- Divider -->
                <div class="toolbar-divider"></div>

                <!-- Highlight -->
                <button class="toolbar-button" data-action="highlight" data-tooltip="Highlight" aria-label="Highlight">
                    <svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
                </button>

                <!-- Color -->
                <button class="toolbar-button" data-action="color" data-tooltip="Change Color" aria-label="Change Color">
                    <svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
                </button>

                <!-- Divider -->
                <div class="toolbar-divider"></div>

                <!-- Align Left -->
                <button class="toolbar-button" data-action="align-left" data-tooltip="Align Left" aria-label="Align Left">
                    <svg viewBox="0 0 24 24"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
                </button>

                <!-- Align Center -->
                <button class="toolbar-button" data-action="align-center" data-tooltip="Align Center" aria-label="Align Center">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg>
                </button>

                <!-- Align Right -->
                <button class="toolbar-button" data-action="align-right" data-tooltip="Align Right" aria-label="Align Right">
                    <svg viewBox="0 0 24 24"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Built with <a href="#" target="_blank">DreamyHook</a> design system</p>
        </div>
    </div>

    <script>
        // ========== Toolbar Functionality ==========

        // State management
        const state = {
            activeButtons: new Set(),
            currentAlign: 'align-left',
            currentTooltip: null
        };

        // Get all toolbar buttons
        const toolbarButtons = document.querySelectorAll('.toolbar-button');

        // Alignment buttons group
        const alignButtons = ['align-left', 'align-center', 'align-right'];

        // Toggle button active state
        function toggleButton(button, action) {
            // Handle alignment buttons (only one can be active)
            if (alignButtons.includes(action)) {
                // Remove active from all align buttons
                toolbarButtons.forEach(btn => {
                    if (alignButtons.includes(btn.dataset.action)) {
                        btn.classList.remove('active');
                        state.activeButtons.delete(btn.dataset.action);
                    }
                });
                // Set current alignment
                state.currentAlign = action;
                button.classList.add('active');
                state.activeButtons.add(action);
            } else {
                // Toggle other buttons
                if (state.activeButtons.has(action)) {
                    state.activeButtons.delete(action);
                    button.classList.remove('active');
                } else {
                    state.activeButtons.add(action);
                    button.classList.add('active');
                }
            }
        }

        // Show tooltip
        function showTooltip(button, text) {
            // Remove existing tooltip
            hideTooltip();

            // Create new tooltip
            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip';
            tooltip.textContent = text;
            button.appendChild(tooltip);
            state.currentTooltip = tooltip;
        }

        // Hide tooltip
        function hideTooltip() {
            if (state.currentTooltip) {
                state.currentTooltip.remove();
                state.currentTooltip = null;
            }
        }

        // Initialize event listeners
        toolbarButtons.forEach(button => {
            const action = button.dataset.action;
            const tooltip = button.dataset.tooltip;

            // Set default active state for align-left
            if (action === 'align-left') {
                button.classList.add('active');
                state.activeButtons.add(action);
            }

            // Click handler
            button.addEventListener('click', (e) => {
                e.preventDefault();
                toggleButton(button, action);
            });

            // Hover handlers
            button.addEventListener('mouseenter', () => {
                showTooltip(button, tooltip);
            });

            button.addEventListener('mouseleave', () => {
                hideTooltip();
            });

            // Keyboard accessibility
            button.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleButton(button, action);
                }
            });
        });

        // Log state changes (for demo purposes)
        window.addEventListener('click', () => {
            console.log('Active buttons:', Array.from(state.activeButtons));
            console.log('Current alignment:', state.currentAlign);
        });

        // Cleanup tooltips on scroll
        window.addEventListener('scroll', hideTooltip);
    </script>
</body>
</html>
