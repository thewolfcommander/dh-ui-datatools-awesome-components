<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook 3D Photo Carousel</title>

    <!-- Google Fonts - Inter & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ------------------------- DreamyHook Theme Variables ------------------------- */
        :root {
            /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
            --color-primary: #FCBF49;        /* Marigold Yellow - primary brand color */
            --color-secondary: #0A1128;      /* Midnight Blue - secondary brand color */
            --color-accent: #FFD23F;         /* Buttercup Yellow - bright accent */
            --color-coral: #FF6B4A;          /* Coral - warm accent for CTAs */
            --color-sky: #0ea5e9;            /* Sky Blue - fresh accent */

            /* Neutral Colors - Warm Gray Palette for Light Theme */
            --color-neutral-100: #ffffff;    /* Pure white */
            --color-neutral-200: #fffef9;    /* Warm white */
            --color-neutral-300: #fffdf0;    /* Cream white */
            --color-neutral-400: #fef9e7;    /* Light cream */
            --color-neutral-500: #78716c;    /* Medium warm gray */
            --color-neutral-600: #57534e;    /* Dark warm gray */
            --color-neutral-700: #44403c;    /* Very dark warm gray */
            --color-neutral-800: #292524;    /* Almost black warm gray */
            --color-neutral-900: #1c1917;    /* Near black warm */

            /* Functional Colors */
            --color-error: #ef4444;
            --color-success: #22c55e;
            --color-warning: #f59e0b;

            /* Theme-Specific Colors */
            --theme-background: #fffef9;

            /* Animation & Timing */
            --duration-default: 0.735s;
            --transition-ease: cubic-bezier(0.32, 0.72, 0, 1);
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
            color: var(--color-secondary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FCBF49 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--color-neutral-600);
            font-size: 1.1rem;
        }

        /* Carousel Container */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 254, 249, 0.95) 100%);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 10px 40px 0 rgba(10, 17, 40, 0.15);
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 500px;
            perspective: 1000px;
            overflow: hidden;
            border-radius: 1rem;
            background: var(--color-neutral-200);
        }

        .carousel {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }

        .carousel:active {
            cursor: grabbing;
        }

        .carousel-item {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 200px;
            height: 200px;
            margin-left: -100px;
            margin-top: -100px;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            transition: all 0.3s var(--transition-ease);
            cursor: pointer;
        }

        .carousel-item:hover {
            box-shadow: 0 0 30px rgba(252, 191, 73, 0.5);
            transform: scale(1.05);
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
            transition: filter 0.3s ease;
        }

        .carousel-item img.loading {
            filter: blur(4px);
        }

        /* Fullscreen Overlay */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 17, 40, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s var(--transition-ease);
            padding: 2rem;
        }

        .fullscreen-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .fullscreen-image-container {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            transform: scale(0);
            transition: transform 0.5s var(--transition-ease);
        }

        .fullscreen-overlay.active .fullscreen-image-container {
            transform: scale(1);
        }

        .fullscreen-image {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 1rem;
            box-shadow: 0 0 50px rgba(252, 191, 73, 0.6);
        }

        .close-button {
            position: absolute;
            top: -3rem;
            right: 0;
            background: var(--color-primary);
            border: none;
            color: var(--color-secondary);
            font-size: 1.5rem;
            font-weight: 700;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(252, 191, 73, 0.4);
        }

        .close-button:hover {
            background: var(--color-accent);
            transform: rotate(90deg);
            box-shadow: 0 0 30px rgba(255, 210, 63, 0.6);
        }

        /* Instructions */
        .instructions {
            text-align: center;
            margin-top: 2rem;
            color: var(--color-neutral-600);
            font-size: 0.95rem;
        }

        .instructions strong {
            color: var(--color-primary);
            font-weight: 600;
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .carousel-wrapper {
                padding: 1.5rem;
            }

            .carousel-container {
                height: 400px;
            }

            .carousel-item {
                width: 150px;
                height: 150px;
                margin-left: -75px;
                margin-top: -75px;
            }
        }

        @media screen and (max-width: 480px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .carousel-wrapper {
                padding: 1rem;
            }

            .carousel-container {
                height: 350px;
            }

            .carousel-item {
                width: 120px;
                height: 120px;
                margin-left: -60px;
                margin-top: -60px;
            }
        }

        /* Loading Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Poppins', sans-serif;
            color: var(--color-primary);
            font-size: 1.2rem;
            font-weight: 600;
            animation: float 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div class="container">
        <div class="header">
            <h1>DreamyHook 3D Photo Carousel</h1>
            <p>Drag to rotate • Click to view fullscreen</p>
        </div>

        <!-- Carousel Wrapper -->
        <div class="carousel-wrapper">
            <div class="carousel-container" id="carouselContainer">
                <div class="carousel" id="carousel">
                    <!-- Carousel items will be dynamically added here -->
                </div>
                <div class="loading-indicator" id="loadingIndicator">Loading images...</div>
            </div>

            <div class="instructions">
                <strong>Tip:</strong> Drag left or right to rotate the carousel. Click any image to view it in fullscreen.
            </div>
        </div>
    </div>

    <!-- Fullscreen Overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <div class="fullscreen-image-container">
            <button class="close-button" id="closeButton" aria-label="Close fullscreen">×</button>
            <img class="fullscreen-image" id="fullscreenImage" src="" alt="Fullscreen view">
        </div>
    </div>

    <script>
        // Image keywords for Unsplash (DreamyHook theme-appropriate images)
        const keywords = [
            'sunset',
            'architecture',
            'city',
            'nature',
            'mountain',
            'ocean',
            'forest',
            'skyline',
            'landscape',
            'urban',
            'travel',
            'night',
            'sky',
            'building'
        ];

        // Generate image URLs from Unsplash
        const imageUrls = keywords.map(keyword =>
            `https://source.unsplash.com/300x300/?${keyword}`
        );

        // Configuration
        const config = {
            cylinderWidth: window.innerWidth <= 640 ? 1100 : 1800,
            faceCount: imageUrls.length,
            get faceWidth() {
                return this.cylinderWidth / this.faceCount;
            },
            get radius() {
                return this.cylinderWidth / (2 * Math.PI);
            }
        };

        // State
        let rotation = 0;
        let isDragging = false;
        let startX = 0;
        let currentRotation = 0;
        let velocity = 0;
        let animationFrame = null;
        let isCarouselActive = true;

        // DOM Elements
        const carousel = document.getElementById('carousel');
        const carouselContainer = document.getElementById('carouselContainer');
        const fullscreenOverlay = document.getElementById('fullscreenOverlay');
        const fullscreenImage = document.getElementById('fullscreenImage');
        const closeButton = document.getElementById('closeButton');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // Initialize carousel
        function initCarousel() {
            imageUrls.forEach((url, index) => {
                const item = document.createElement('div');
                item.className = 'carousel-item';

                const img = document.createElement('img');
                img.src = url;
                img.alt = `Image ${index + 1}`;
                img.className = 'loading';

                // Remove loading class when image loads
                img.onload = () => {
                    img.classList.remove('loading');
                    if (index === imageUrls.length - 1) {
                        loadingIndicator.style.display = 'none';
                    }
                };

                // Calculate 3D position
                const angle = (index * 360) / config.faceCount;
                item.style.transform = `rotateY(${angle}deg) translateZ(${config.radius}px)`;

                // Click handler for fullscreen
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showFullscreen(url);
                });

                item.appendChild(img);
                carousel.appendChild(item);
            });

            updateCarousel();
        }

        // Update carousel rotation
        function updateCarousel() {
            carousel.style.transform = `rotateY(${rotation}deg)`;
        }

        // Mouse/Touch event handlers
        function handleStart(e) {
            if (!isCarouselActive) return;

            isDragging = true;
            startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            currentRotation = rotation;
            velocity = 0;

            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
            }
        }

        function handleMove(e) {
            if (!isDragging || !isCarouselActive) return;

            e.preventDefault();
            const currentX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            const deltaX = currentX - startX;

            velocity = deltaX * 0.05;
            rotation = currentRotation + velocity;
            updateCarousel();
        }

        function handleEnd(e) {
            if (!isDragging || !isCarouselActive) return;

            isDragging = false;

            // Apply momentum
            const applyMomentum = () => {
                if (Math.abs(velocity) > 0.1) {
                    rotation += velocity;
                    velocity *= 0.95; // Friction
                    updateCarousel();
                    animationFrame = requestAnimationFrame(applyMomentum);
                }
            };

            applyMomentum();
        }

        // Fullscreen handlers
        function showFullscreen(imageUrl) {
            isCarouselActive = false;
            fullscreenImage.src = imageUrl;
            fullscreenOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function hideFullscreen() {
            isCarouselActive = true;
            fullscreenOverlay.classList.remove('active');
            document.body.style.overflow = '';

            // Small delay before allowing carousel interaction again
            setTimeout(() => {
                isCarouselActive = true;
            }, 500);
        }

        // Event listeners
        carousel.addEventListener('mousedown', handleStart);
        carousel.addEventListener('mousemove', handleMove);
        carousel.addEventListener('mouseup', handleEnd);
        carousel.addEventListener('mouseleave', handleEnd);

        carousel.addEventListener('touchstart', handleStart, { passive: true });
        carousel.addEventListener('touchmove', handleMove, { passive: false });
        carousel.addEventListener('touchend', handleEnd);

        closeButton.addEventListener('click', hideFullscreen);
        fullscreenOverlay.addEventListener('click', (e) => {
            if (e.target === fullscreenOverlay) {
                hideFullscreen();
            }
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && fullscreenOverlay.classList.contains('active')) {
                hideFullscreen();
            }

            if (isCarouselActive) {
                if (e.key === 'ArrowLeft') {
                    rotation += 5;
                    updateCarousel();
                } else if (e.key === 'ArrowRight') {
                    rotation -= 5;
                    updateCarousel();
                }
            }
        });

        // Responsive handling
        window.addEventListener('resize', () => {
            const newWidth = window.innerWidth <= 640 ? 1100 : 1800;
            if (newWidth !== config.cylinderWidth) {
                config.cylinderWidth = newWidth;

                // Recalculate positions
                const items = carousel.querySelectorAll('.carousel-item');
                items.forEach((item, index) => {
                    const angle = (index * 360) / config.faceCount;
                    item.style.transform = `rotateY(${angle}deg) translateZ(${config.radius}px)`;
                });
            }
        });

        // Initialize on load
        window.addEventListener('load', initCarousel);
    </script>
</body>
</html>
