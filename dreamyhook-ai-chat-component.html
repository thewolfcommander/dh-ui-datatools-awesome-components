<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook AI Chat - What can I help you ship?</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ========================= DreamyHook Theme Variables ========================= */
        :root {
            /* Brand Colors */
            --color-primary: #FCBF49;        /* Marigold Yellow */
            --color-secondary: #0A1128;      /* Midnight Blue */
            --color-accent: #FFD23F;         /* Buttercup Yellow */
            --color-coral: #FF6B4A;          /* Coral */
            --color-sky: #0ea5e9;            /* Sky Blue */

            /* Neutral Colors - Warm Gray Palette */
            --color-neutral-100: #ffffff;    /* Pure white */
            --color-neutral-200: #fffef9;    /* Warm white */
            --color-neutral-300: #fffdf0;    /* Cream white */
            --color-neutral-400: #fef9e7;    /* Light cream */
            --color-neutral-500: #78716c;    /* Medium warm gray */
            --color-neutral-600: #57534e;    /* Dark warm gray */
            --color-neutral-700: #44403c;    /* Very dark warm gray */
            --color-neutral-800: #292524;    /* Almost black warm gray */
            --color-neutral-900: #1c1917;    /* Near black warm */

            /* Semantic Colors */
            --color-error: #ef4444;
            --color-success: #22c55e;
            --color-warning: #f59e0b;

            /* Border Colors */
            --border-light: #e7e5e4;
            --border-medium: #d6d3d1;
            --border-dark: #a8a29e;

            /* Shadows */
            --shadow-soft: 0 2px 15px 0 rgba(10, 17, 40, 0.05);
            --shadow-medium: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            --shadow-colored: 0 4px 25px 0 rgba(252, 191, 73, 0.25);
            --shadow-glow-marigold: 0 0 30px 0 rgba(252, 191, 73, 0.3);
            --shadow-glow-buttercup: 0 0 30px 0 rgba(255, 210, 63, 0.3);
            --shadow-warm: 0 4px 20px 0 rgba(252, 191, 73, 0.15);

            /* Typography */
            --font-heading: 'Poppins', ui-sans-serif, system-ui, sans-serif;
            --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;

            /* Transitions */
            --transition-default: 0.735s cubic-bezier(0.65, 0.05, 0, 1);
            --transition-fast: 0.3s ease;
            --transition-medium: 0.5s ease;
        }

        /* ========================= Reset & Base ========================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--color-neutral-200) 0%, var(--color-neutral-400) 100%);
            color: var(--color-secondary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }

        /* ========================= Main Container ========================= */
        .chat-container {
            width: 100%;
            max-width: 896px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* ========================= Heading ========================= */
        .chat-heading {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 700;
            color: var(--color-secondary);
            text-align: center;
            line-height: 1.2;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================= Chat Input Wrapper ========================= */
        .chat-input-wrapper {
            width: 100%;
            background: var(--color-neutral-100);
            border: 2px solid var(--border-light);
            border-radius: 16px;
            padding: 12px;
            box-shadow: var(--shadow-soft);
            transition: all var(--transition-fast);
            animation: fadeInScale 0.6s ease-out 0.2s backwards;
        }

        .chat-input-wrapper:focus-within {
            border-color: var(--color-primary);
            box-shadow: var(--shadow-glow-marigold);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ========================= Textarea ========================= */
        #chatInput {
            width: 100%;
            min-height: 60px;
            max-height: 200px;
            padding: 12px;
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--font-body);
            font-size: 0.875rem;
            color: var(--color-secondary);
            resize: none;
            overflow-y: auto;
            line-height: 1.5;
        }

        #chatInput::placeholder {
            color: var(--color-neutral-500);
        }

        #chatInput::-webkit-scrollbar {
            width: 6px;
        }

        #chatInput::-webkit-scrollbar-track {
            background: var(--color-neutral-300);
            border-radius: 3px;
        }

        #chatInput::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border-radius: 3px;
        }

        #chatInput::-webkit-scrollbar-thumb:hover {
            background: var(--color-accent);
        }

        /* ========================= Chat Controls ========================= */
        .chat-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
            border-top: 1px solid var(--border-light);
            margin-top: 8px;
        }

        .right-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ========================= Buttons ========================= */
        button {
            font-family: var(--font-body);
            cursor: pointer;
            border: none;
            outline: none;
            transition: all var(--transition-fast);
        }

        button:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        /* Attach Button */
        .attach-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: transparent;
            color: var(--color-secondary);
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .attach-btn:hover {
            background: var(--color-neutral-300);
        }

        .attach-btn .label {
            display: none;
            color: var(--color-neutral-500);
        }

        .attach-btn:hover .label {
            display: inline;
        }

        /* Project Button */
        .project-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: transparent;
            color: var(--color-neutral-500);
            border: 1.5px dashed var(--border-dark);
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .project-btn:hover {
            background: var(--color-neutral-300);
            border-color: var(--color-primary);
            color: var(--color-secondary);
        }

        /* Send Button */
        .send-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--color-neutral-300);
            color: var(--color-neutral-500);
            border: 1.5px solid var(--border-light);
            border-radius: 8px;
            transition: all var(--transition-fast);
        }

        .send-btn:hover {
            background: var(--color-neutral-400);
        }

        .send-btn.active {
            background: var(--color-primary);
            color: var(--color-secondary);
            border-color: var(--color-primary);
            box-shadow: var(--shadow-warm);
        }

        .send-btn.active:hover {
            background: var(--color-accent);
            box-shadow: var(--shadow-glow-buttercup);
            transform: scale(1.05);
        }

        /* ========================= Action Buttons ========================= */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            animation: fadeIn 0.8s ease-out 0.4s backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--color-neutral-100);
            color: var(--color-secondary);
            border: 1.5px solid var(--border-light);
            border-radius: 24px;
            font-size: 0.75rem;
            font-weight: 500;
            box-shadow: var(--shadow-soft);
            transition: all var(--transition-fast);
        }

        .action-btn:hover {
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 100%);
            color: var(--color-secondary);
            border-color: var(--color-primary);
            box-shadow: var(--shadow-glow-marigold);
            transform: translateY(-2px);
        }

        .action-btn svg {
            color: var(--color-primary);
            transition: all var(--transition-fast);
        }

        .action-btn:hover svg {
            color: var(--color-secondary);
            transform: scale(1.1);
        }

        /* ========================= Responsive Design ========================= */
        @media screen and (max-width: 768px) {
            body {
                padding: 1rem 0.5rem;
            }

            .chat-container {
                gap: 1.5rem;
            }

            .chat-heading {
                font-size: 1.75rem;
            }

            .action-buttons {
                gap: 8px;
            }

            .action-btn {
                padding: 8px 12px;
                font-size: 0.7rem;
            }

            .attach-btn .label {
                display: none !important;
            }
        }

        @media screen and (max-width: 480px) {
            .action-buttons {
                flex-direction: column;
                width: 100%;
            }

            .action-btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* ========================= Icon Styles ========================= */
        .icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .send-btn .icon {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Main Heading -->
        <h1 class="chat-heading">What can I help you ship?</h1>

        <!-- Chat Input Area -->
        <div class="chat-input-wrapper">
            <textarea
                id="chatInput"
                placeholder="Ask DreamyHook AI a question..."
                aria-label="Chat message input"
                rows="1"
            ></textarea>

            <div class="chat-controls">
                <!-- Attach Button -->
                <button type="button" class="attach-btn" aria-label="Attach file">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                    <span class="label">Attach</span>
                </button>

                <div class="right-controls">
                    <!-- Project Button -->
                    <button type="button" class="project-btn" aria-label="Add project">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14"/><path d="M12 5v14"/>
                        </svg>
                        <span>Project</span>
                    </button>

                    <!-- Send Button -->
                    <button type="button" class="send-btn" id="sendBtn" aria-label="Send message">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <!-- Clone Screenshot -->
            <button type="button" class="action-btn" aria-label="Clone a screenshot">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                </svg>
                <span>Clone a Screenshot</span>
            </button>

            <!-- Import from Figma -->
            <button type="button" class="action-btn" aria-label="Import from Figma">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 5.5A3.5 3.5 0 0 1 8.5 2H12v7H8.5A3.5 3.5 0 0 1 5 5.5z"/><path d="M12 2h3.5a3.5 3.5 0 1 1 0 7H12V2z"/><path d="M12 12.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 1 1-7 0z"/><path d="M5 19.5A3.5 3.5 0 0 1 8.5 16H12v3.5a3.5 3.5 0 1 1-7 0z"/><path d="M5 12.5A3.5 3.5 0 0 1 8.5 9H12v7H8.5A3.5 3.5 0 0 1 5 12.5z"/>
                </svg>
                <span>Import from Figma</span>
            </button>

            <!-- Upload Project -->
            <button type="button" class="action-btn" aria-label="Upload a project">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>
                </svg>
                <span>Upload a Project</span>
            </button>

            <!-- Landing Page -->
            <button type="button" class="action-btn" aria-label="Create landing page">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>
                </svg>
                <span>Landing Page</span>
            </button>

            <!-- Sign Up Form -->
            <button type="button" class="action-btn" aria-label="Create sign up form">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>
                </svg>
                <span>Sign Up Form</span>
            </button>
        </div>
    </div>

    <script>
        // ========================= Auto-Resize Textarea =========================
        const textarea = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const MIN_HEIGHT = 60;
        const MAX_HEIGHT = 200;

        function adjustHeight() {
            // Reset to minimum to get correct scrollHeight
            textarea.style.height = MIN_HEIGHT + 'px';

            // Calculate new height within constraints
            const newHeight = Math.min(
                Math.max(textarea.scrollHeight, MIN_HEIGHT),
                MAX_HEIGHT
            );

            textarea.style.height = newHeight + 'px';
        }

        // ========================= Update Send Button State =========================
        function updateSendButton() {
            if (textarea.value.trim()) {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        }

        // ========================= Handle Message Submission =========================
        function submitMessage() {
            const message = textarea.value.trim();

            if (message) {
                console.log('Message submitted:', message);
                // TODO: Add your message handling logic here
                // Example: sendToAPI(message);

                // Clear textarea and reset
                textarea.value = '';
                textarea.style.height = MIN_HEIGHT + 'px';
                updateSendButton();

                // Optional: Show confirmation
                showNotification('Message sent!');
            }
        }

        // ========================= Notification System =========================
        function showNotification(message) {
            // Create notification element
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, var(--color-accent), var(--color-primary));
                color: var(--color-secondary);
                padding: 12px 24px;
                border-radius: 12px;
                box-shadow: var(--shadow-glow-marigold);
                font-weight: 600;
                font-size: 0.875rem;
                z-index: 1000;
                animation: slideInRight 0.3s ease-out;
            `;

            // Add keyframe animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideInRight {
                    from {
                        transform: translateX(100%);
                        opacity: 0;
                    }
                    to {
                        transform: translateX(0);
                        opacity: 1;
                    }
                }
            `;
            document.head.appendChild(style);

            document.body.appendChild(notification);

            // Remove after 3 seconds
            setTimeout(() => {
                notification.style.animation = 'slideInRight 0.3s ease-out reverse';
                setTimeout(() => {
                    document.body.removeChild(notification);
                    document.head.removeChild(style);
                }, 300);
            }, 3000);
        }

        // ========================= Event Listeners =========================

        // Textarea input event
        textarea.addEventListener('input', () => {
            adjustHeight();
            updateSendButton();
        });

        // Keyboard shortcuts
        textarea.addEventListener('keydown', (e) => {
            // Submit on Enter (but allow Shift+Enter for new line)
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitMessage();
            }

            // Clear on Escape
            if (e.key === 'Escape') {
                textarea.value = '';
                adjustHeight();
                updateSendButton();
                textarea.blur();
            }
        });

        // Send button click
        sendBtn.addEventListener('click', submitMessage);

        // Action button clicks
        document.querySelectorAll('.action-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.getAttribute('aria-label');
                console.log('Action clicked:', action);
                showNotification(`${action} feature coming soon!`);
                // TODO: Add your action handling logic here
            });
        });

        // Window resize handler
        window.addEventListener('resize', adjustHeight);

        // Initialize on load
        window.addEventListener('load', () => {
            adjustHeight();
            updateSendButton();
            textarea.focus();
        });

        // ========================= Accessibility Enhancements =========================

        // Focus management
        document.addEventListener('keydown', (e) => {
            // Focus textarea on '/' key (similar to Slack, Discord)
            if (e.key === '/' && document.activeElement !== textarea) {
                e.preventDefault();
                textarea.focus();
            }
        });

        // Announce to screen readers when send button becomes active
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    const isActive = sendBtn.classList.contains('active');
                    sendBtn.setAttribute('aria-disabled', !isActive);
                }
            });
        });

        observer.observe(sendBtn, { attributes: true });
    </script>
</body>
</html>
