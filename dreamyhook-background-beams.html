<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamyHook - Background Beams Component</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* DreamyHook Theme Variables */
    :root {
      /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
      --color-primary: #FCBF49;        /* Marigold Yellow - primary brand color */
      --color-secondary: #0A1128;      /* Midnight Blue - secondary brand color */
      --color-accent: #FFD23F;         /* Buttercup Yellow - bright accent */
      --color-coral: #FF6B4A;          /* Coral - warm accent for CTAs */
      --color-sky: #0ea5e9;            /* Sky Blue - fresh accent */

      /* Neutral Colors - Warm Gray Palette for Light Theme */
      --color-neutral-100: #ffffff;    /* Pure white */
      --color-neutral-200: #fffef9;    /* Warm white */
      --color-neutral-300: #fffdf0;    /* Cream white */
      --color-neutral-400: #fef9e7;    /* Light cream */
      --color-neutral-500: #78716c;    /* Medium warm gray */
      --color-neutral-600: #57534e;    /* Dark warm gray */
      --color-neutral-700: #44403c;    /* Very dark warm gray */
      --color-neutral-800: #292524;    /* Almost black warm gray */
      --color-neutral-900: #1c1917;    /* Near black warm */

      /* Theme-Specific Colors */
      --theme-background: #fffef9;     /* Warm white background */

      /* Semantic colors */
      --color-success: #22c55e;
      --color-warning: #f59e0b;
      --color-error: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--theme-background);
      color: var(--color-secondary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .container {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: linear-gradient(135deg, var(--color-neutral-200) 0%, var(--color-neutral-400) 100%);
      padding: 2rem;
      overflow: hidden;
    }

    .content {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      z-index: 10;
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(2rem, 5vw, 4.5rem);
      font-weight: 700;
      text-align: center;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--color-secondary) 0%, var(--color-neutral-600) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 10;
    }

    .subtitle {
      color: var(--color-neutral-600);
      max-width: 32rem;
      margin: 0 auto 2rem;
      font-size: 0.875rem;
      line-height: 1.6;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .input-container {
      position: relative;
      z-index: 10;
      margin-top: 2rem;
    }

    input[type="email"] {
      width: 100%;
      height: 3rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      border: 2px solid var(--color-neutral-300);
      border-radius: 0.5rem;
      background: var(--color-neutral-100);
      color: var(--color-secondary);
      transition: all 0.3s ease;
      outline: none;
    }

    input[type="email"]:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(252, 191, 73, 0.1);
    }

    input[type="email"]::placeholder {
      color: var(--color-neutral-500);
    }

    /* Background Beams Container */
    .background-beams {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .background-beams svg {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Gradient Animation */
    @keyframes gradientShift {
      0% {
        stop-color: var(--color-primary);
      }
      33% {
        stop-color: var(--color-accent);
      }
      66% {
        stop-color: var(--color-coral);
      }
      100% {
        stop-color: var(--color-primary);
      }
    }

    /* Responsive Design */
    @media screen and (max-width: 768px) {
      .content {
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 0.813rem;
      }
    }

    @media screen and (max-width: 479px) {
      .container {
        padding: 1rem;
      }

      h1 {
        font-size: 1.75rem;
      }
    }

    /* Selection - Marigold yellow background */
    ::selection {
      background-color: var(--color-primary);
      color: var(--color-neutral-100);
      text-shadow: none;
    }

    ::-moz-selection {
      background-color: var(--color-primary);
      color: var(--color-neutral-100);
      text-shadow: none;
    }

    /* Golden glow effect for input */
    input[type="email"]:focus {
      box-shadow: 0 0 20px rgba(252, 191, 73, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Join the waitlist</h1>
      <p class="subtitle">
        Welcome to DreamyHook, the best platform for building awesome components.
        We provide reliable, scalable, and customizable solutions for your projects.
        Whether you're building landing pages, dashboards, or full applications,
        DreamyHook has got you covered.
      </p>
      <div class="input-container">
        <input
          type="email"
          placeholder="your@email.com"
          id="emailInput"
          aria-label="Email address"
        />
      </div>
    </div>

    <!-- Background Beams SVG -->
    <div class="background-beams">
      <svg
        class="beams-svg"
        width="100%"
        height="100%"
        viewBox="0 0 696 316"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        preserveAspectRatio="xMidYMid slice"
      >
        <!-- Base path with radial gradient -->
        <path
          d="M-380 -189C-380 -189 -312 216 152 343C616 470 684 875 684 875M-373 -197C-373 -197 -305 208 159 335C623 462 691 867 691 867M-366 -205C-366 -205 -298 200 166 327C630 454 698 859 698 859M-359 -213C-359 -213 -291 192 173 319C637 446 705 851 705 851M-352 -221C-352 -221 -284 184 180 311C644 438 712 843 712 843M-345 -229C-345 -229 -277 176 187 303C651 430 719 835 719 835M-338 -237C-338 -237 -270 168 194 295C658 422 726 827 726 827M-331 -245C-331 -245 -263 160 201 287C665 414 733 819 733 819M-324 -253C-324 -253 -256 152 208 279C672 406 740 811 740 811M-317 -261C-317 -261 -249 144 215 271C679 398 747 803 747 803M-310 -269C-310 -269 -242 136 222 263C686 390 754 795 754 795M-303 -277C-303 -277 -235 128 229 255C693 382 761 787 761 787M-296 -285C-296 -285 -228 120 236 247C700 374 768 779 768 779M-289 -293C-289 -293 -221 112 243 239C707 366 775 771 775 771M-282 -301C-282 -301 -214 104 250 231C714 358 782 763 782 763M-275 -309C-275 -309 -207 96 257 223C721 350 789 755 789 755M-268 -317C-268 -317 -200 88 264 215C728 342 796 747 796 747M-261 -325C-261 -325 -193 80 271 207C735 334 803 739 803 739M-254 -333C-254 -333 -186 72 278 199C742 326 810 731 810 731M-247 -341C-247 -341 -179 64 285 191C749 318 817 723 817 723M-240 -349C-240 -349 -172 56 292 183C756 310 824 715 824 715M-233 -357C-233 -357 -165 48 299 175C763 302 831 707 831 707M-226 -365C-226 -365 -158 40 306 167C770 294 838 699 838 699M-219 -373C-219 -373 -151 32 313 159C777 286 845 691 845 691M-212 -381C-212 -381 -144 24 320 151C784 278 852 683 852 683M-205 -389C-205 -389 -137 16 327 143C791 270 859 675 859 675M-198 -397C-198 -397 -130 8 334 135C798 262 866 667 866 667M-191 -405C-191 -405 -123 0 341 127C805 254 873 659 873 659M-184 -413C-184 -413 -116 -8 348 119C812 246 880 651 880 651M-177 -421C-177 -421 -109 -16 355 111C819 238 887 643 887 643M-170 -429C-170 -429 -102 -24 362 103C826 230 894 635 894 635M-163 -437C-163 -437 -95 -32 369 95C833 222 901 627 901 627M-156 -445C-156 -445 -88 -40 376 87C840 214 908 619 908 619M-149 -453C-149 -453 -81 -48 383 79C847 206 915 611 915 611M-142 -461C-142 -461 -74 -56 390 71C854 198 922 603 922 603M-135 -469C-135 -469 -67 -64 397 63C861 190 929 595 929 595M-128 -477C-128 -477 -60 -72 404 55C868 182 936 587 936 587M-121 -485C-121 -485 -53 -80 411 47C875 174 943 579 943 579M-114 -493C-114 -493 -46 -88 418 39C882 166 950 571 950 571M-107 -501C-107 -501 -39 -96 425 31C889 158 957 563 957 563M-100 -509C-100 -509 -32 -104 432 23C896 150 964 555 964 555M-93 -517C-93 -517 -25 -112 439 15C903 142 971 547 971 547M-86 -525C-86 -525 -18 -120 446 7C910 134 978 539 978 539M-79 -533C-79 -533 -11 -128 453 -1C917 126 985 531 985 531M-72 -541C-72 -541 -4 -136 460 -9C924 118 992 523 992 523M-65 -549C-65 -549 3 -144 467 -17C931 110 999 515 999 515M-58 -557C-58 -557 10 -152 474 -25C938 102 1006 507 1006 507M-51 -565C-51 -565 17 -160 481 -33C945 94 1013 499 1013 499M-44 -573C-44 -573 24 -168 488 -41C952 86 1020 491 1020 491M-37 -581C-37 -581 31 -176 495 -49C959 78 1027 483 1027 483"
          stroke="url(#paint0_radial)"
          stroke-opacity="0.05"
          stroke-width="0.5"
        />

        <!-- Animated gradient beams -->
        <g id="animated-beams"></g>

        <defs>
          <!-- Radial gradient -->
          <radialGradient
            id="paint0_radial"
            cx="0"
            cy="0"
            r="1"
            gradientUnits="userSpaceOnUse"
            gradientTransform="translate(352 34) rotate(90) scale(555 1560.62)"
          >
            <stop offset="0.0666667" stop-color="var(--color-neutral-300)" />
            <stop offset="0.243243" stop-color="var(--color-neutral-300)" />
            <stop offset="0.43594" stop-color="white" stop-opacity="0" />
          </radialGradient>

          <!-- Linear gradients for animated beams -->
          <linearGradient id="beamGradient1">
            <stop offset="0%" stop-color="var(--color-accent)" stop-opacity="0" />
            <stop offset="25%" stop-color="var(--color-accent)" />
            <stop offset="50%" stop-color="var(--color-primary)" />
            <stop offset="100%" stop-color="var(--color-coral)" stop-opacity="0" />
          </linearGradient>

          <linearGradient id="beamGradient2">
            <stop offset="0%" stop-color="var(--color-primary)" stop-opacity="0" />
            <stop offset="25%" stop-color="var(--color-primary)" />
            <stop offset="50%" stop-color="var(--color-coral)" />
            <stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0" />
          </linearGradient>

          <linearGradient id="beamGradient3">
            <stop offset="0%" stop-color="var(--color-coral)" stop-opacity="0" />
            <stop offset="25%" stop-color="var(--color-coral)" />
            <stop offset="50%" stop-color="var(--color-accent)" />
            <stop offset="100%" stop-color="var(--color-primary)" stop-opacity="0" />
          </linearGradient>
        </defs>
      </svg>
    </div>
  </div>

  <script>
    // DreamyHook Background Beams Animation
    // Vanilla JavaScript implementation with brand colors

    const paths = [
      "M-380 -189C-380 -189 -312 216 152 343C616 470 684 875 684 875",
      "M-366 -205C-366 -205 -298 200 166 327C630 454 698 859 698 859",
      "M-352 -221C-352 -221 -284 184 180 311C644 438 712 843 712 843",
      "M-338 -237C-338 -237 -270 168 194 295C658 422 726 827 726 827",
      "M-324 -253C-324 -253 -256 152 208 279C672 406 740 811 740 811",
      "M-310 -269C-310 -269 -242 136 222 263C686 390 754 795 754 795",
      "M-296 -285C-296 -285 -228 120 236 247C700 374 768 779 768 779",
      "M-282 -301C-282 -301 -214 104 250 231C714 358 782 763 782 763",
      "M-268 -317C-268 -317 -200 88 264 215C728 342 796 747 796 747",
      "M-254 -333C-254 -333 -186 72 278 199C742 326 810 731 810 731",
      "M-240 -349C-240 -349 -172 56 292 183C756 310 824 715 824 715",
      "M-226 -365C-226 -365 -158 40 306 167C770 294 838 699 838 699",
      "M-212 -381C-212 -381 -144 24 320 151C784 278 852 683 852 683",
      "M-198 -397C-198 -397 -130 8 334 135C798 262 866 667 866 667",
      "M-184 -413C-184 -413 -116 -8 348 119C812 246 880 651 880 651",
      "M-170 -429C-170 -429 -102 -24 362 103C826 230 894 635 894 635",
      "M-156 -445C-156 -445 -88 -40 376 87C840 214 908 619 908 619",
      "M-142 -461C-142 -461 -74 -56 390 71C854 198 922 603 922 603",
      "M-128 -477C-128 -477 -60 -72 404 55C868 182 936 587 936 587",
      "M-114 -493C-114 -493 -46 -88 418 39C882 166 950 571 950 571",
      "M-100 -509C-100 -509 -32 -104 432 23C896 150 964 555 964 555",
      "M-86 -525C-86 -525 -18 -120 446 7C910 134 978 539 978 539",
      "M-72 -541C-72 -541 -4 -136 460 -9C924 118 992 523 992 523",
      "M-58 -557C-58 -557 10 -152 474 -25C938 102 1006 507 1006 507",
      "M-44 -573C-44 -573 24 -168 488 -41C952 86 1020 491 1020 491",
    ];

    const animatedBeamsContainer = document.getElementById('animated-beams');
    const beamElements = [];

    // Create animated beam paths
    paths.forEach((path, index) => {
      const pathElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      pathElement.setAttribute('d', path);

      // Rotate between the three gradients
      const gradientIndex = (index % 3) + 1;
      pathElement.setAttribute('stroke', `url(#beamGradient${gradientIndex})`);
      pathElement.setAttribute('stroke-opacity', '0.4');
      pathElement.setAttribute('stroke-width', '0.5');
      pathElement.setAttribute('fill', 'none');

      animatedBeamsContainer.appendChild(pathElement);
      beamElements.push({
        element: pathElement,
        offset: Math.random() * 100,
        duration: 15 + Math.random() * 10,
        direction: Math.random() > 0.5 ? 1 : -1
      });
    });

    // Simple opacity animation
    function animateBeams() {
      const time = Date.now() / 1000;

      beamElements.forEach((beam, index) => {
        const cycle = (time + beam.offset) / beam.duration;
        const opacity = 0.2 + Math.sin(cycle * Math.PI * 2 * beam.direction) * 0.3;
        beam.element.setAttribute('stroke-opacity', opacity.toFixed(2));
      });

      requestAnimationFrame(animateBeams);
    }

    // Start animation
    animateBeams();

    // Email input validation (optional enhancement)
    const emailInput = document.getElementById('emailInput');
    emailInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const email = e.target.value;
        if (email && email.includes('@')) {
          console.log('Email submitted:', email);
          // Add your submission logic here
          alert('Thank you for joining our waitlist!');
          e.target.value = '';
        }
      }
    });
  </script>
</body>
</html>
