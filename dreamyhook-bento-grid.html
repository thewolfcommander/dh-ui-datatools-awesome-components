<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Bento Grid Component</title>

    <!-- Google Fonts - Inter & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ========================= DreamyHook Theme Variables ========================= */
        :root {
            /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
            --color-primary: #FCBF49;        /* Marigold Yellow - primary brand color */
            --color-secondary: #0A1128;      /* Midnight Blue - secondary brand color */
            --color-accent: #FFD23F;         /* Buttercup Yellow - bright accent */
            --color-coral: #FF6B4A;          /* Coral - warm accent for CTAs */
            --color-sky: #0ea5e9;            /* Sky Blue - fresh accent */

            /* Neutral Colors - Warm Gray Palette for Light Theme */
            --color-neutral-100: #ffffff;    /* Pure white */
            --color-neutral-200: #fffef9;    /* Warm white */
            --color-neutral-300: #fffdf0;    /* Cream white */
            --color-neutral-400: #fef9e7;    /* Light cream */
            --color-neutral-500: #78716c;    /* Medium warm gray */
            --color-neutral-600: #57534e;    /* Dark warm gray */
            --color-neutral-700: #44403c;    /* Very dark warm gray */
            --color-neutral-800: #292524;    /* Almost black warm gray */
            --color-neutral-900: #1c1917;    /* Near black warm */

            /* Semantic Color Assignments */
            --color-light: var(--color-neutral-200);
            --color-dark: var(--color-secondary);
            --color-white: var(--color-neutral-100);
            --color-black: var(--color-neutral-900);

            /* Functional Colors */
            --color-error: #ef4444;
            --color-success: #22c55e;
            --color-warning: #f59e0b;

            /* Animation & Timing */
            --cubic-default: cubic-bezier(0.65, 0.05, 0, 1);
            --duration-default: 0.735s;

            /* Shadows */
            --shadow-soft: 0 2px 15px 0 rgba(10, 17, 40, 0.05);
            --shadow-medium: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            --shadow-colored: 0 4px 25px 0 rgba(252, 191, 73, 0.25);
            --shadow-warm: 0 4px 20px 0 rgba(252, 191, 73, 0.15);
        }

        /* ========================= Reset & Base Styles ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
            color: var(--color-dark);
            min-height: 100vh;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
        }

        /* Selection - Marigold yellow background with white text */
        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
            text-shadow: none;
        }

        ::-moz-selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
            text-shadow: none;
        }

        /* ========================= Page Header ========================= */
        .page-header {
            max-width: 1400px;
            margin: 0 auto 60px;
            text-align: center;
        }

        .page-title {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FCBF49 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            animation: fadeIn 0.8s ease-out;
        }

        .page-subtitle {
            font-size: 1.125rem;
            color: var(--color-neutral-600);
            max-width: 600px;
            margin: 0 auto;
            animation: fadeIn 1s ease-out;
        }

        /* ========================= Bento Grid Container ========================= */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Responsive grid for larger screens */
        @media (min-width: 768px) {
            .bento-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .bento-item.col-span-2 {
                grid-column: span 2;
            }
        }

        /* ========================= Bento Grid Items ========================= */
        .bento-item {
            position: relative;
            padding: 24px;
            border-radius: 16px;
            background: var(--color-white);
            border: 1px solid rgba(10, 17, 40, 0.08);
            overflow: hidden;
            transition: all 0.3s var(--cubic-default);
            cursor: pointer;
            animation: scaleIn 0.5s ease-out backwards;
        }

        .bento-item:nth-child(1) { animation-delay: 0.1s; }
        .bento-item:nth-child(2) { animation-delay: 0.2s; }
        .bento-item:nth-child(3) { animation-delay: 0.3s; }
        .bento-item:nth-child(4) { animation-delay: 0.4s; }
        .bento-item:nth-child(5) { animation-delay: 0.5s; }
        .bento-item:nth-child(6) { animation-delay: 0.6s; }

        .bento-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-warm);
            border-color: rgba(252, 191, 73, 0.3);
        }

        .bento-item.persistent-hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-warm);
        }

        /* Dot pattern background */
        .bento-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at center, rgba(10, 17, 40, 0.02) 1px, transparent 1px);
            background-size: 4px 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .bento-item:hover::before,
        .bento-item.persistent-hover::before {
            opacity: 1;
        }

        /* Gradient border effect */
        .bento-item::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, transparent, rgba(252, 191, 73, 0.3), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: -1;
        }

        .bento-item:hover::after,
        .bento-item.persistent-hover::after {
            opacity: 1;
        }

        /* ========================= Bento Item Content ========================= */
        .bento-content {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 1;
        }

        .bento-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bento-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 17, 40, 0.05);
            transition: all 0.3s ease;
        }

        .bento-item:hover .bento-icon {
            background: linear-gradient(135deg, var(--color-accent), var(--color-primary));
            box-shadow: 0 0 20px rgba(252, 191, 73, 0.3);
        }

        .bento-icon svg {
            width: 18px;
            height: 18px;
        }

        .bento-status {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(10, 17, 40, 0.05);
            color: var(--color-neutral-600);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .bento-item:hover .bento-status {
            background: rgba(10, 17, 40, 0.1);
            color: var(--color-dark);
        }

        .bento-status.live {
            background: rgba(34, 197, 94, 0.1);
            color: var(--color-success);
        }

        .bento-status.beta {
            background: rgba(14, 165, 233, 0.1);
            color: var(--color-sky);
        }

        .bento-status.updated {
            background: rgba(252, 191, 73, 0.1);
            color: var(--color-primary);
        }

        .bento-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bento-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-dark);
            letter-spacing: -0.01em;
            line-height: 1.4;
        }

        .bento-meta {
            font-size: 0.75rem;
            color: var(--color-neutral-500);
            font-weight: 400;
            margin-left: 8px;
        }

        .bento-description {
            font-size: 0.875rem;
            color: var(--color-neutral-600);
            line-height: 1.6;
            font-weight: 425;
        }

        .bento-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        .bento-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bento-tag {
            font-size: 0.75rem;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(10, 17, 40, 0.05);
            color: var(--color-neutral-500);
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .bento-tag:hover {
            background: rgba(10, 17, 40, 0.1);
            color: var(--color-dark);
        }

        .bento-cta {
            font-size: 0.75rem;
            color: var(--color-neutral-500);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bento-item:hover .bento-cta {
            opacity: 1;
            color: var(--color-primary);
        }

        /* ========================= Animations ========================= */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* ========================= Responsive Design ========================= */
        @media (max-width: 767px) {
            .page-title {
                font-size: 2rem;
            }

            .page-subtitle {
                font-size: 1rem;
            }

            .bento-grid {
                grid-template-columns: 1fr;
                padding: 10px;
            }

            .bento-item.col-span-2 {
                grid-column: span 1;
            }
        }

        /* ========================= SVG Icons ========================= */
        .icon-trending-up { stroke: #3b82f6; }
        .icon-check-circle { stroke: #10b981; }
        .icon-video { stroke: #a855f7; }
        .icon-globe { stroke: #0ea5e9; }
        .icon-clock { stroke: #f59e0b; }
        .icon-star { stroke: #fbbf24; }
    </style>
</head>
<body>
    <!-- Page Header -->
    <div class="page-header">
        <h1 class="page-title">DreamyHook Bento Grid</h1>
        <p class="page-subtitle">A beautiful, responsive grid layout component with smooth animations and DreamyHook brand styling</p>
    </div>

    <!-- Bento Grid Container -->
    <div class="bento-grid" id="bentoGrid">
        <!-- Items will be dynamically inserted here -->
    </div>

    <script>
        // SVG Icons as strings
        const icons = {
            trendingUp: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-trending-up"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>`,

            checkCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-check-circle"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`,

            video: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-video"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`,

            globe: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-globe"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`,

            clock: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-clock"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`,

            star: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-star"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`
        };

        // Sample Bento Grid Items Data
        const bentoItems = [
            {
                title: "Analytics Dashboard",
                meta: "v2.4.1",
                description: "Real-time metrics with AI-powered insights and predictive analytics",
                icon: "trendingUp",
                status: "Live",
                statusClass: "live",
                tags: ["Statistics", "Reports", "AI"],
                colSpan: 2,
                hasPersistentHover: true,
                cta: "Explore →"
            },
            {
                title: "Task Manager",
                meta: "84 completed",
                description: "Automated workflow management with priority scheduling",
                icon: "checkCircle",
                status: "Updated",
                statusClass: "updated",
                tags: ["Productivity", "Automation"],
                colSpan: 1,
                hasPersistentHover: false,
                cta: "View Tasks →"
            },
            {
                title: "Media Library",
                meta: "12GB used",
                description: "Cloud storage with intelligent content processing",
                icon: "video",
                status: "Active",
                statusClass: "",
                tags: ["Storage", "CDN"],
                colSpan: 2,
                hasPersistentHover: false,
                cta: "Browse Files →"
            },
            {
                title: "Global Network",
                meta: "6 regions",
                description: "Multi-region deployment with edge computing",
                icon: "globe",
                status: "Beta",
                statusClass: "beta",
                tags: ["Infrastructure", "Edge"],
                colSpan: 1,
                hasPersistentHover: false,
                cta: "View Network →"
            }
        ];

        // Function to create a bento grid item
        function createBentoItem(item) {
            const div = document.createElement('div');
            div.className = `bento-item${item.colSpan === 2 ? ' col-span-2' : ''}${item.hasPersistentHover ? ' persistent-hover' : ''}`;

            const tagsHTML = item.tags.map(tag => `<span class="bento-tag">#${tag}</span>`).join('');

            div.innerHTML = `
                <div class="bento-content">
                    <div class="bento-header">
                        <div class="bento-icon">
                            ${icons[item.icon]}
                        </div>
                        <span class="bento-status ${item.statusClass}">${item.status}</span>
                    </div>

                    <div class="bento-body">
                        <h3 class="bento-title">
                            ${item.title}
                            <span class="bento-meta">${item.meta}</span>
                        </h3>
                        <p class="bento-description">${item.description}</p>
                    </div>

                    <div class="bento-footer">
                        <div class="bento-tags">
                            ${tagsHTML}
                        </div>
                        <span class="bento-cta">${item.cta}</span>
                    </div>
                </div>
            `;

            return div;
        }

        // Initialize the bento grid
        function initBentoGrid() {
            const grid = document.getElementById('bentoGrid');
            bentoItems.forEach(item => {
                grid.appendChild(createBentoItem(item));
            });
        }

        // Run on page load
        document.addEventListener('DOMContentLoaded', initBentoGrid);

        // Optional: Add click handlers for interaction
        document.addEventListener('click', function(e) {
            const bentoItem = e.target.closest('.bento-item');
            if (bentoItem) {
                console.log('Bento item clicked:', bentoItem.querySelector('.bento-title').textContent.trim());
                // Add your click handler logic here
            }
        });
    </script>
</body>
</html>
