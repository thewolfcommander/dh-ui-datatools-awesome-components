<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Image Carousel Component</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Embla Carousel CSS -->
    <link rel="stylesheet" href="https://unpkg.com/embla-carousel@8.0.0/embla-carousel.css">

    <style>
        /* ========================= DreamyHook Theme Variables ========================= */
        :root {
            /* Brand Colors */
            --color-primary: #FCBF49;        /* Marigold Yellow */
            --color-secondary: #0A1128;      /* Midnight Blue */
            --color-accent: #FFD23F;         /* Buttercup Yellow */
            --color-coral: #FF6B4A;          /* Coral */
            --color-sky: #0ea5e9;            /* Sky Blue */

            /* Neutral Colors */
            --color-neutral-100: #ffffff;
            --color-neutral-200: #fffef9;
            --color-neutral-300: #fffdf0;
            --color-neutral-400: #fef9e7;
            --color-neutral-500: #78716c;
            --color-neutral-600: #57534e;
            --color-neutral-700: #44403c;
            --color-neutral-800: #292524;
            --color-neutral-900: #1c1917;

            /* Theme-Specific */
            --theme-background: #fffef9;

            /* Shadows */
            --shadow-soft: 0 2px 15px 0 rgba(10, 17, 40, 0.05);
            --shadow-medium: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            --shadow-warm: 0 4px 20px 0 rgba(252, 191, 73, 0.15);
            --glow-marigold: 0 0 20px rgba(252, 191, 73, 0.3);
            --glow-marigold-hover: 0 0 30px rgba(252, 191, 73, 0.5);
        }

        /* ========================= Reset & Base Styles ========================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
            color: var(--color-secondary);
            line-height: 1.6;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-secondary);
            text-align: center;
            margin-bottom: 1rem;
        }

        .subtitle {
            text-align: center;
            color: var(--color-neutral-600);
            font-size: 1.125rem;
            margin-bottom: 3rem;
        }

        /* ========================= Carousel Styles ========================= */
        .embla {
            overflow: hidden;
            border-radius: 1.5rem;
            box-shadow: var(--shadow-warm);
            background: white;
            padding: 1rem;
        }

        .embla__container {
            display: flex;
            touch-action: pan-y pinch-zoom;
            margin-left: -1rem;
        }

        .embla__slide {
            flex: 0 0 70%;
            min-width: 0;
            padding-left: 1rem;
        }

        .slide-content {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            height: 400px;
            border: 2px solid var(--color-neutral-300);
            background: white;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .slide-content:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-medium);
        }

        .slide-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ========================= Controls Container ========================= */
        .controls-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            flex-wrap: wrap;
        }

        /* ========================= Dot Navigation ========================= */
        .embla__dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
        }

        .embla__dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--color-neutral-400);
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
        }

        .embla__dot:hover {
            background: var(--color-neutral-300);
            border-color: var(--color-primary);
        }

        .embla__dot--selected {
            background: var(--color-primary);
            border-color: var(--color-primary);
            box-shadow: var(--glow-marigold);
        }

        /* ========================= Progress Bar ========================= */
        .progress-container {
            position: relative;
            width: 160px;
            height: 8px;
            border-radius: 1rem;
            border: 2px solid var(--color-neutral-300);
            background: var(--color-neutral-200);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .progress-container.active {
            opacity: 1;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 100%);
            transition: left 0s linear;
        }

        .progress-bar.animating {
            animation: progress linear forwards;
        }

        @keyframes progress {
            from { left: -100%; }
            to { left: 0%; }
        }

        /* ========================= Play/Pause Button ========================= */
        .play-pause-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--color-primary);
            background: var(--color-neutral-100);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: var(--color-secondary);
            flex-shrink: 0;
        }

        .play-pause-btn:hover {
            background: var(--color-primary);
            color: white;
            box-shadow: var(--glow-marigold-hover);
            transform: scale(1.05);
        }

        .play-pause-btn:active {
            transform: scale(0.95);
        }

        .play-pause-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* ========================= CTA Button ========================= */
        .cta-container {
            display: flex;
            justify-content: center;
            margin-top: 3rem;
        }

        .cta-button {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 1rem 2.5rem;
            border-radius: 2rem;
            border: none;
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 100%);
            color: var(--color-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-medium);
            text-decoration: none;
            display: inline-block;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-marigold-hover);
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        /* ========================= Responsive Design ========================= */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .embla__slide {
                flex: 0 0 85%;
            }

            .slide-content {
                height: 300px;
            }

            .controls-container {
                justify-content: center;
            }

            .progress-container {
                width: 120px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.75rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .embla__slide {
                flex: 0 0 90%;
            }

            .slide-content {
                height: 250px;
            }

            .cta-button {
                padding: 0.875rem 2rem;
                font-size: 0.9375rem;
            }
        }

        /* ========================= Loading State ========================= */
        .slide-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(252, 191, 73, 0.1) 50%,
                transparent 100%);
            animation: shimmer 2s infinite;
            z-index: 1;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .slide-content img {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DreamyHook Portfolio Carousel</h1>
        <p class="subtitle">Explore our featured works and creative projects</p>

        <div class="embla">
            <div class="embla__container">
                <div class="embla__slide">
                    <div class="slide-content">
                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&h=600&fit=crop"
                             alt="AI Icons Collection"
                             loading="lazy">
                    </div>
                </div>
                <div class="embla__slide">
                    <div class="slide-content">
                        <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=800&h=600&fit=crop"
                             alt="Social Media Posts"
                             loading="lazy">
                    </div>
                </div>
                <div class="embla__slide">
                    <div class="slide-content">
                        <img src="https://images.unsplash.com/photo-1558655146-364adaf1fcc9?w=800&h=600&fit=crop"
                             alt="Design Project - Dalim"
                             loading="lazy">
                    </div>
                </div>
                <div class="embla__slide">
                    <div class="slide-content">
                        <img src="https://images.unsplash.com/photo-1547658719-da2b51169166?w=800&h=600&fit=crop"
                             alt="Website Designs"
                             loading="lazy">
                    </div>
                </div>
                <div class="embla__slide">
                    <div class="slide-content">
                        <img src="https://images.unsplash.com/photo-1626785774573-4b799315345d?w=800&h=600&fit=crop"
                             alt="AI Logo Designs"
                             loading="lazy">
                    </div>
                </div>
            </div>
        </div>

        <div class="controls-container">
            <div class="embla__dots"></div>

            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>

            <button class="play-pause-btn" type="button" aria-label="Toggle autoplay">
                <svg class="pause-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <rect x="6" y="4" width="4" height="16" rx="1"/>
                    <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <svg class="play-icon" style="display: none;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
        </div>

        <div class="cta-container">
            <a href="https://dreamyhook.com/works" class="cta-button">See All Works</a>
        </div>
    </div>

    <!-- Embla Carousel JavaScript -->
    <script src="https://unpkg.com/embla-carousel@8.0.0/embla-carousel.umd.js"></script>
    <script src="https://unpkg.com/embla-carousel-autoplay@8.0.0/embla-carousel-autoplay.umd.js"></script>

    <script>
        // ========================= Carousel Initialization =========================
        const emblaNode = document.querySelector('.embla');
        const viewportNode = emblaNode.querySelector('.embla__container');
        const dotsNode = document.querySelector('.embla__dots');
        const playPauseBtn = document.querySelector('.play-pause-btn');
        const pauseIcon = playPauseBtn.querySelector('.pause-icon');
        const playIcon = playPauseBtn.querySelector('.play-icon');
        const progressContainer = document.querySelector('.progress-container');
        const progressBar = document.querySelector('.progress-bar');

        // Carousel options
        const options = {
            loop: true,
            align: 'start',
            skipSnaps: false
        };

        // Autoplay plugin
        const autoplayOptions = {
            delay: 3000,
            stopOnInteraction: false,
            playOnInit: true
        };

        // Initialize Embla Carousel
        const emblaApi = EmblaCarousel(viewportNode, options, [
            EmblaCarouselAutoplay(autoplayOptions)
        ]);

        // Get autoplay plugin instance
        const autoplay = emblaApi.plugins().autoplay;

        // ========================= Dot Navigation =========================
        const addDotBtnsAndClickHandlers = () => {
            dotsNode.innerHTML = emblaApi
                .scrollSnapList()
                .map(() => '<button class="embla__dot" type="button"></button>')
                .join('');

            const dotButtons = Array.from(dotsNode.querySelectorAll('.embla__dot'));

            dotButtons.forEach((dotNode, index) => {
                dotNode.addEventListener('click', () => {
                    emblaApi.scrollTo(index);
                    if (autoplay) {
                        autoplay.reset();
                    }
                }, false);
            });

            return dotButtons;
        };

        const toggleDotBtnsActive = (dotButtons) => {
            const previous = emblaApi.previousScrollSnap();
            const selected = emblaApi.selectedScrollSnap();

            dotButtons[previous].classList.remove('embla__dot--selected');
            dotButtons[selected].classList.add('embla__dot--selected');
        };

        // ========================= Progress Bar =========================
        let progressAnimationId = null;

        const startProgressBar = () => {
            if (!autoplay) return;

            const timeUntilNext = autoplay.timeUntilNext();
            if (!timeUntilNext) return;

            progressContainer.classList.add('active');
            progressBar.classList.remove('animating');

            // Force reflow
            void progressBar.offsetWidth;

            progressBar.style.animationDuration = `${timeUntilNext}ms`;
            progressBar.classList.add('animating');
        };

        const stopProgressBar = () => {
            progressContainer.classList.remove('active');
            progressBar.classList.remove('animating');
        };

        const resetProgressBar = () => {
            progressBar.classList.remove('animating');
            void progressBar.offsetWidth;
        };

        // ========================= Play/Pause Toggle =========================
        const togglePlayPause = () => {
            if (!autoplay) return;

            if (autoplay.isPlaying()) {
                autoplay.stop();
                pauseIcon.style.display = 'none';
                playIcon.style.display = 'block';
                stopProgressBar();
            } else {
                autoplay.play();
                pauseIcon.style.display = 'block';
                playIcon.style.display = 'none';
                startProgressBar();
            }
        };

        playPauseBtn.addEventListener('click', togglePlayPause, false);

        // ========================= Event Listeners =========================
        const dotButtons = addDotBtnsAndClickHandlers();

        emblaApi.on('select', () => {
            toggleDotBtnsActive(dotButtons);
        });

        emblaApi.on('reInit', () => {
            const newDotButtons = addDotBtnsAndClickHandlers();
            toggleDotBtnsActive(newDotButtons);
        });

        // Autoplay events
        if (autoplay) {
            emblaApi.on('autoplay:play', () => {
                pauseIcon.style.display = 'block';
                playIcon.style.display = 'none';
                startProgressBar();
            });

            emblaApi.on('autoplay:stop', () => {
                pauseIcon.style.display = 'none';
                playIcon.style.display = 'block';
                stopProgressBar();
            });

            emblaApi.on('autoplay:timerset', startProgressBar);
        }

        // Initialize dots on load
        toggleDotBtnsActive(dotButtons);

        // Start progress bar if autoplay is playing
        if (autoplay && autoplay.isPlaying()) {
            startProgressBar();
        }

        // ========================= Touch/Drag Support =========================
        // Embla handles this automatically, but we can add visual feedback
        let isDragging = false;

        emblaNode.addEventListener('mousedown', () => {
            isDragging = true;
            emblaNode.style.cursor = 'grabbing';
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                emblaNode.style.cursor = 'grab';
            }
        });

        emblaNode.style.cursor = 'grab';

        // ========================= Cleanup on Page Unload =========================
        window.addEventListener('beforeunload', () => {
            emblaApi.destroy();
        });

        // ========================= Console Info =========================
        console.log('%c🎨 DreamyHook Carousel Loaded', 'color: #FCBF49; font-size: 16px; font-weight: bold;');
        console.log('%cBrand Colors: Marigold Yellow (#FCBF49) • Midnight Blue (#0A1128) • Buttercup Yellow (#FFD23F)', 'color: #0A1128;');
    </script>
</body>
</html>
