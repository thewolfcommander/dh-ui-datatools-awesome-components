<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Hero Section</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ========================= DreamyHook Theme Variables ========================= */
        :root {
            /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
            --color-primary: #FCBF49;
            --color-secondary: #0A1128;
            --color-accent: #FFD23F;
            --color-coral: #FF6B4A;
            --color-sky: #0ea5e9;

            /* Neutral Colors */
            --color-neutral-100: #ffffff;
            --color-neutral-200: #fffef9;
            --color-neutral-300: #fffdf0;
            --color-neutral-400: #fef9e7;
            --color-neutral-500: #78716c;
            --color-neutral-600: #57534e;
            --color-neutral-700: #44403c;
            --color-neutral-800: #292524;
            --color-neutral-900: #1c1917;

            /* Typography */
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
            --font-heading: "Poppins", ui-sans-serif, system-ui, sans-serif;

            /* Spacing */
            --container-max-width: 1440px;
            --section-padding-y: 8rem;
            --section-padding-x: 2rem;

            /* Shadows */
            --shadow-soft: 0 2px 15px 0 rgba(10, 17, 40, 0.05);
            --shadow-medium: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            --shadow-hard: 0 10px 40px 0 rgba(10, 17, 40, 0.15);
            --shadow-yellow-glow: 0 0 30px 0 rgba(255, 210, 63, 0.3);
            --shadow-marigold-glow: 0 0 30px 0 rgba(252, 191, 73, 0.25);

            /* Border Radius */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
            --radius-full: 9999px;
        }

        /* ========================= Reset & Base Styles ========================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-neutral-200);
            color: var(--color-secondary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }

        /* ========================= Hero Section ========================= */
        .hero-section {
            background: linear-gradient(135deg, #ffffff 0%, #fffef9 100%);
            padding: var(--section-padding-y) var(--section-padding-x);
            padding-bottom: 0;
            overflow: hidden;
        }

        .hero-container {
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding-top: 4rem;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
            text-align: center;
        }

        /* ========================= Badge ========================= */
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border: 1px solid var(--color-neutral-300);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 500;
            background-color: var(--color-neutral-100);
            box-shadow: var(--shadow-soft);
            animation: appear 0.5s ease-out forwards;
            opacity: 0;
        }

        .hero-badge .badge-text {
            color: var(--color-neutral-500);
        }

        .hero-badge .badge-link {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: var(--color-secondary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .hero-badge .badge-link:hover {
            color: var(--color-primary);
        }

        .hero-badge .arrow-icon {
            width: 12px;
            height: 12px;
        }

        /* ========================= Title ========================= */
        .hero-title {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 5vw, 5rem);
            font-weight: 700;
            line-height: 1.1;
            background: linear-gradient(135deg, var(--color-secondary) 0%, var(--color-neutral-600) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: appear 0.5s ease-out 0.1s forwards;
            opacity: 0;
            max-width: 900px;
        }

        /* ========================= Description ========================= */
        .hero-description {
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 500;
            color: var(--color-neutral-500);
            max-width: 550px;
            animation: appear 0.5s ease-out 0.2s forwards;
            opacity: 0;
        }

        /* ========================= Actions ========================= */
        .hero-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            animation: appear 0.5s ease-out 0.3s forwards;
            opacity: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius-lg);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: var(--font-sans);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 100%);
            color: var(--color-secondary);
            box-shadow: var(--shadow-medium);
        }

        .btn-primary:hover {
            box-shadow: var(--shadow-yellow-glow);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--color-secondary);
            color: var(--color-neutral-100);
            box-shadow: var(--shadow-medium);
            position: relative;
            overflow: hidden;
        }

        .btn-secondary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 210, 63, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-secondary:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-secondary:hover {
            box-shadow: 0 0 30px 0 rgba(10, 17, 40, 0.3);
            transform: translateY(-2px);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
        }

        /* ========================= Image Section ========================= */
        .hero-image-wrapper {
            position: relative;
            padding-top: 3rem;
            width: 100%;
            animation: appear 0.5s ease-out 0.7s forwards;
            opacity: 0;
        }

        .mockup-frame {
            background: rgba(252, 191, 73, 0.05);
            padding: 0.5rem;
            border-radius: var(--radius-2xl);
            position: relative;
            z-index: 10;
        }

        .mockup {
            position: relative;
            z-index: 10;
            overflow: hidden;
            box-shadow: var(--shadow-hard);
            border: 1px solid rgba(10, 17, 40, 0.05);
            border-top: 1px solid rgba(10, 17, 40, 0.15);
            border-radius: var(--radius-md);
        }

        .mockup img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: var(--radius-md);
        }

        /* ========================= Glow Effect ========================= */
        .glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            pointer-events: none;
            animation: appear-zoom 0.5s ease-out 1s forwards;
            opacity: 0;
        }

        .glow-layer-1 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(2.5);
            height: 256px;
            width: 60%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(252, 191, 73, 0.5) 10%, rgba(252, 191, 73, 0) 60%);
        }

        .glow-layer-2 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(2);
            height: 128px;
            width: 40%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(252, 191, 73, 0.3) 10%, rgba(252, 191, 73, 0) 60%);
        }

        /* ========================= Animations ========================= */
        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes appear-zoom {
            from {
                opacity: 0;
                transform: translateX(-50%) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        /* ========================= Responsive Design ========================= */
        @media (max-width: 768px) {
            :root {
                --section-padding-y: 4rem;
                --section-padding-x: 1rem;
            }

            .hero-actions {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .mockup-frame {
                padding: 0.375rem;
            }

            .glow-layer-1 {
                height: 128px;
            }
        }

        @media (max-width: 480px) {
            .hero-badge {
                font-size: 0.75rem;
                padding: 0.375rem 0.75rem;
            }

            .hero-description {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-container">
            <div class="hero-content">
                <!-- Badge -->
                <div class="hero-badge">
                    <span class="badge-text">Introducing DreamyHook Components</span>
                    <a href="#docs" class="badge-link">
                        Learn more
                        <svg class="arrow-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </a>
                </div>

                <!-- Title -->
                <h1 class="hero-title">
                    Build faster with beautiful components
                </h1>

                <!-- Description -->
                <p class="hero-description">
                    Premium UI components built with DreamyHook's golden aesthetic. Save time and ship your next project faster with our ready-to-use components.
                </p>

                <!-- Action Buttons -->
                <div class="hero-actions">
                    <a href="#get-started" class="btn btn-primary">
                        Get Started
                    </a>
                    <a href="https://github.com/dreamyhook" class="btn btn-secondary">
                        <svg class="btn-icon" viewBox="0 0 438.549 438.549" fill="currentColor" xmlns="http://www.w3.org/2000/svg">

                        </svg>
                        GitHub
                    </a>
                </div>

                <!-- Image with Glow -->
                <div class="hero-image-wrapper">
                    <div class="mockup-frame">
                        <div class="mockup">
                            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1248&h=765&fit=crop&auto=format" alt="DreamyHook UI Components Preview" />
                        </div>
                    </div>
                    <div class="glow">
                        <div class="glow-layer-1"></div>
                        <div class="glow-layer-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Add ripple effect to buttons
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;

                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.classList.add('ripple');

                this.appendChild(ripple);

                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Observe elements for animation
        document.querySelectorAll('.hero-badge, .hero-title, .hero-description, .hero-actions, .hero-image-wrapper').forEach(el => {
            observer.observe(el);
        });

        // Add keyboard accessibility
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });
        });

        // Console message for developers
        console.log('%c🎨 DreamyHook Hero Section', 'font-size: 20px; font-weight: bold; color: #FCBF49;');
        console.log('%cBuilt with ❤️ using DreamyHook brand theme', 'font-size: 14px; color: #0A1128;');
    </script>
</body>
</html>
