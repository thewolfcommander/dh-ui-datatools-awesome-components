<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Elevate Your Digital Vision</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ------------------------- DreamyHook Theme Variables ------------------------- */

        :root {
            /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
            --color-primary: #FCBF49;        /* Marigold Yellow - primary brand color */
            --color-secondary: #0A1128;      /* Midnight Blue - secondary brand color */
            --color-accent: #FFD23F;         /* Buttercup Yellow - bright accent */
            --color-coral: #FF6B4A;          /* Coral - warm accent for CTAs */
            --color-sky: #0ea5e9;            /* Sky Blue - fresh accent */

            /* Neutral Colors - Warm Gray Palette for Light Theme */
            --color-neutral-100: #ffffff;    /* Pure white */
            --color-neutral-200: #fffef9;    /* Warm white */
            --color-neutral-300: #fffdf0;    /* Cream white */
            --color-neutral-400: #fef9e7;    /* Light cream */
            --color-neutral-500: #78716c;    /* Medium warm gray */
            --color-neutral-600: #57534e;    /* Dark warm gray */
            --color-neutral-700: #44403c;    /* Very dark warm gray */
            --color-neutral-800: #292524;    /* Almost black warm gray */
            --color-neutral-900: #1c1917;    /* Near black warm */

            /* Theme-Specific Colors */
            --theme-primary: #FCBF49;        /* Marigold Yellow */
            --theme-secondary: #0A1128;      /* Midnight Blue */
            --theme-accent: #FFD23F;         /* Buttercup Yellow */
            --theme-background: #fffef9;     /* Warm white background */
        }

        /* ------------------------- Reset -------------------------------------------------- */

        *,
        *:after,
        *:before {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            background-color: var(--theme-background);
            color: var(--color-secondary);
            overflow-x: hidden;
        }

        /* ------------------------- Hero Container -------------------------  */

        .hero-container {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
        }

        /* Gradient Overlay */
        .gradient-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at top left, rgba(252, 191, 73, 0.08), transparent 50%),
                        radial-gradient(ellipse at bottom right, rgba(255, 107, 74, 0.08), transparent 50%),
                        radial-gradient(ellipse at center, rgba(255, 210, 63, 0.05), transparent 60%);
            filter: blur(60px);
            pointer-events: none;
        }

        /* ------------------------- Geometric Shapes -------------------------  */

        .shapes-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .elegant-shape {
            position: absolute;
            opacity: 0;
            will-change: transform, opacity;
        }

        .elegant-shape .shape-inner {
            position: relative;
            border-radius: 9999px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), transparent);
            backdrop-filter: blur(2px);
            border: 2px solid rgba(252, 191, 73, 0.2);
            box-shadow: 0 8px 32px 0 rgba(252, 191, 73, 0.15),
                        inset 0 0 20px 0 rgba(255, 210, 63, 0.1);
        }

        .elegant-shape .shape-inner::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: radial-gradient(circle at 50% 50%, rgba(255, 210, 63, 0.3), transparent 70%);
        }

        /* Individual shape styles with brand colors */
        .shape-1 {
            left: -10%;
            top: 15%;
            animation: fadeInDown 2.4s cubic-bezier(0.23, 0.86, 0.39, 0.96) 0.3s forwards,
                       floatShape 12s ease-in-out infinite 2.7s;
        }

        .shape-1 .shape-inner {
            width: 600px;
            height: 140px;
            transform: rotate(12deg);
            background: linear-gradient(135deg, rgba(252, 191, 73, 0.25), transparent);
            border-color: rgba(252, 191, 73, 0.3);
        }

        .shape-2 {
            right: -5%;
            top: 70%;
            animation: fadeInDown 2.4s cubic-bezier(0.23, 0.86, 0.39, 0.96) 0.5s forwards,
                       floatShape 12s ease-in-out infinite 2.9s;
        }

        .shape-2 .shape-inner {
            width: 500px;
            height: 120px;
            transform: rotate(-15deg);
            background: linear-gradient(135deg, rgba(255, 107, 74, 0.25), transparent);
            border-color: rgba(255, 107, 74, 0.3);
            box-shadow: 0 8px 32px 0 rgba(255, 107, 74, 0.15),
                        inset 0 0 20px 0 rgba(255, 107, 74, 0.1);
        }

        .shape-3 {
            left: 5%;
            bottom: 5%;
            animation: fadeInDown 2.4s cubic-bezier(0.23, 0.86, 0.39, 0.96) 0.4s forwards,
                       floatShape 12s ease-in-out infinite 2.8s;
        }

        .shape-3 .shape-inner {
            width: 300px;
            height: 80px;
            transform: rotate(-8deg);
            background: linear-gradient(135deg, rgba(255, 210, 63, 0.3), transparent);
            border-color: rgba(255, 210, 63, 0.35);
            box-shadow: 0 8px 32px 0 rgba(255, 210, 63, 0.2),
                        inset 0 0 20px 0 rgba(255, 210, 63, 0.15);
        }

        .shape-4 {
            right: 15%;
            top: 10%;
            animation: fadeInDown 2.4s cubic-bezier(0.23, 0.86, 0.39, 0.96) 0.6s forwards,
                       floatShape 12s ease-in-out infinite 3s;
        }

        .shape-4 .shape-inner {
            width: 200px;
            height: 60px;
            transform: rotate(20deg);
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), transparent);
            border-color: rgba(14, 165, 233, 0.25);
            box-shadow: 0 8px 32px 0 rgba(14, 165, 233, 0.12),
                        inset 0 0 20px 0 rgba(14, 165, 233, 0.1);
        }

        .shape-5 {
            left: 20%;
            top: 5%;
            animation: fadeInDown 2.4s cubic-bezier(0.23, 0.86, 0.39, 0.96) 0.7s forwards,
                       floatShape 12s ease-in-out infinite 3.1s;
        }

        .shape-5 .shape-inner {
            width: 150px;
            height: 40px;
            transform: rotate(-25deg);
            background: linear-gradient(135deg, rgba(252, 191, 73, 0.2), transparent);
            border-color: rgba(252, 191, 73, 0.25);
        }

        /* ------------------------- Content Container -------------------------  */

        .content-wrapper {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .content-center {
            max-width: 48rem;
            margin: 0 auto;
            text-align: center;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background-color: rgba(252, 191, 73, 0.08);
            border: 2px solid rgba(252, 191, 73, 0.2);
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.25, 0.4, 0.25, 1) 0.5s forwards;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--color-coral);
            box-shadow: 0 0 8px rgba(255, 107, 74, 0.5);
        }

        .badge-text {
            font-size: 0.875rem;
            color: var(--color-secondary);
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        /* Heading */
        .hero-heading {
            font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.25, 0.4, 0.25, 1) 0.7s forwards;
        }

        .title-line-1 {
            display: block;
            background: linear-gradient(180deg, var(--color-secondary) 0%, rgba(10, 17, 40, 0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .title-line-2 {
            display: block;
            background: linear-gradient(135deg,
                        var(--color-primary) 0%,
                        var(--color-accent) 35%,
                        var(--color-coral) 70%,
                        var(--color-sky) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 8s ease-in-out infinite;
            background-size: 200% 200%;
        }

        /* Description */
        .hero-description {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--color-neutral-600);
            margin-bottom: 2rem;
            line-height: 1.6;
            font-weight: 300;
            letter-spacing: 0.01em;
            max-width: 36rem;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.25, 0.4, 0.25, 1) 0.9s forwards;
        }

        /* Vignette Effect */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(255, 254, 249, 0.6) 100%);
            pointer-events: none;
        }

        /* ------------------------- Animations -------------------------  */

        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-150px) rotate(calc(var(--rotate) - 15deg));
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotate(var(--rotate));
            }
        }

        @keyframes floatShape {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(15px);
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* ------------------------- Responsive -------------------------  */

        /* Tablet */
        @media screen and (max-width: 991px) {
            .shape-1 .shape-inner {
                width: 450px;
                height: 110px;
            }

            .shape-2 .shape-inner {
                width: 400px;
                height: 100px;
            }

            .shape-3 .shape-inner {
                width: 250px;
                height: 70px;
            }
        }

        /* Mobile Landscape */
        @media screen and (max-width: 767px) {
            .content-wrapper {
                padding: 0 1rem;
            }

            .badge {
                margin-bottom: 2rem;
            }

            .hero-heading {
                margin-bottom: 1.5rem;
            }

            .shape-1 {
                left: -20%;
                top: 10%;
            }

            .shape-1 .shape-inner {
                width: 350px;
                height: 90px;
            }

            .shape-2 {
                right: -15%;
                top: 75%;
            }

            .shape-2 .shape-inner {
                width: 300px;
                height: 80px;
            }

            .shape-3 .shape-inner {
                width: 200px;
                height: 60px;
            }

            .shape-4 .shape-inner {
                width: 150px;
                height: 50px;
            }

            .shape-5 .shape-inner {
                width: 120px;
                height: 35px;
            }
        }

        /* Mobile Portrait */
        @media screen and (max-width: 479px) {
            .badge {
                padding: 0.375rem 0.75rem;
            }

            .badge-text {
                font-size: 0.75rem;
            }

            .hero-description {
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <!-- Gradient Overlay -->
        <div class="gradient-overlay"></div>

        <!-- Geometric Shapes -->
        <div class="shapes-container">
            <!-- Shape 1 - Marigold Yellow -->
            <div class="elegant-shape shape-1">
                <div class="shape-inner"></div>
            </div>

            <!-- Shape 2 - Coral -->
            <div class="elegant-shape shape-2">
                <div class="shape-inner"></div>
            </div>

            <!-- Shape 3 - Buttercup Yellow -->
            <div class="elegant-shape shape-3">
                <div class="shape-inner"></div>
            </div>

            <!-- Shape 4 - Sky Blue -->
            <div class="elegant-shape shape-4">
                <div class="shape-inner"></div>
            </div>

            <!-- Shape 5 - Marigold Yellow -->
            <div class="elegant-shape shape-5">
                <div class="shape-inner"></div>
            </div>
        </div>

        <!-- Content -->
        <div class="content-wrapper">
            <div class="content-center">
                <!-- Badge -->
                <div class="badge">
                    <span class="badge-dot"></span>
                    <span class="badge-text">DreamyHook Design</span>
                </div>

                <!-- Heading -->
                <h1 class="hero-heading">
                    <span class="title-line-1">Elevate Your Digital Vision</span>
                    <span class="title-line-2">Crafting Exceptional Websites</span>
                </h1>

                <!-- Description -->
                <p class="hero-description">
                    Crafting exceptional digital experiences through innovative design and cutting-edge technology with warm, golden aesthetics.
                </p>
            </div>
        </div>

        <!-- Vignette -->
        <div class="vignette"></div>
    </div>

    <script>
        /**
         * DreamyHook Hero Component
         * Vanilla JavaScript for interactive enhancements
         */

        // Smooth scroll behavior
        document.documentElement.style.scrollBehavior = 'smooth';

        // Add subtle parallax effect to shapes on mouse move
        const shapesContainer = document.querySelector('.shapes-container');
        const shapes = document.querySelectorAll('.elegant-shape');

        let mouseX = 0;
        let mouseY = 0;
        let currentX = 0;
        let currentY = 0;

        // Throttle function to limit how often a function can fire
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }

        // Handle mouse move for parallax effect
        const handleMouseMove = throttle((e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        }, 100);

        // Animate parallax effect
        function animateParallax() {
            // Smooth interpolation
            currentX += (mouseX - currentX) * 0.05;
            currentY += (mouseY - currentY) * 0.05;

            shapes.forEach((shape, index) => {
                const depth = (index + 1) * 5; // Different depths for each shape
                const moveX = currentX * depth;
                const moveY = currentY * depth;

                shape.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });

            requestAnimationFrame(animateParallax);
        }

        // Initialize parallax on larger screens only
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', handleMouseMove);
            animateParallax();
        }

        // Add glow effect on scroll
        const badge = document.querySelector('.badge');
        let lastScrollY = window.scrollY;

        window.addEventListener('scroll', throttle(() => {
            const scrollY = window.scrollY;
            const scrollDirection = scrollY > lastScrollY ? 'down' : 'up';

            if (scrollDirection === 'down' && scrollY > 50) {
                badge.style.boxShadow = '0 0 20px rgba(252, 191, 73, 0.4)';
            } else {
                badge.style.boxShadow = 'none';
            }

            lastScrollY = scrollY;
        }, 100));

        // Enhance accessibility - Add focus styles
        const focusableElements = document.querySelectorAll('a, button, [tabindex]:not([tabindex="-1"])');

        focusableElements.forEach(element => {
            element.addEventListener('focus', function() {
                this.style.outline = '3px solid var(--color-accent)';
                this.style.outlineOffset = '4px';
            });

            element.addEventListener('blur', function() {
                this.style.outline = 'none';
            });
        });

        // Performance optimization - Reduce animations on low-end devices
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        if (prefersReducedMotion.matches) {
            shapes.forEach(shape => {
                shape.style.animation = 'none';
            });
        }

        // Console welcome message
        console.log('%c✨ DreamyHook Hero Component',
            'color: #FCBF49; font-size: 20px; font-weight: bold; font-family: Poppins, sans-serif;');
        console.log('%cBuilt with ❤️ using vanilla JavaScript',
            'color: #0A1128; font-size: 14px; font-family: Inter, sans-serif;');
    </script>
</body>
</html>
