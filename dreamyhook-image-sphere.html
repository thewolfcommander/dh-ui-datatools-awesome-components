<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - 3D Image Sphere Gallery</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           DREAMYHOOK BRAND THEME VARIABLES
           ========================================== */
        :root {
            /* Brand Colors - DreamyHook Palette */
            --color-primary: #FCBF49;        /* Marigold Yellow */
            --color-secondary: #0A1128;      /* Midnight Blue */
            --color-accent: #FFD23F;         /* Buttercup Yellow */
            --color-coral: #FF6B4A;          /* Coral */
            --color-sky: #0ea5e9;            /* Sky Blue */

            /* Neutral Colors - Warm Gray Palette */
            --color-neutral-100: #ffffff;
            --color-neutral-200: #fffef9;
            --color-neutral-300: #fffdf0;
            --color-neutral-400: #fef9e7;
            --color-neutral-500: #78716c;
            --color-neutral-600: #57534e;
            --color-neutral-700: #44403c;
            --color-neutral-800: #292524;
            --color-neutral-900: #1c1917;

            /* Semantic Colors */
            --color-success: #22c55e;
            --color-warning: #f59e0b;
            --color-error: #ef4444;

            /* Typography */
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
            --font-heading: "Poppins", ui-sans-serif, system-ui, sans-serif;

            /* Shadows */
            --shadow-soft: 0 2px 15px 0 rgba(10, 17, 40, 0.05);
            --shadow-medium: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            --shadow-hard: 0 10px 40px 0 rgba(10, 17, 40, 0.15);
            --shadow-marigold: 0 4px 25px 0 rgba(252, 191, 73, 0.25);
            --shadow-glow: 0 0 30px 0 rgba(255, 210, 63, 0.3);
        }

        /* ==========================================
           RESET & BASE STYLES
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, var(--color-neutral-200) 0%, var(--color-neutral-400) 100%);
            color: var(--color-secondary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }

        /* ==========================================
           HEADER SECTION
           ========================================== */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 50%, var(--color-coral) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.125rem;
            color: var(--color-neutral-600);
            max-width: 600px;
            margin: 0 auto;
        }

        /* ==========================================
           SPHERE CONTAINER
           ========================================== */
        .sphere-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        #sphereContainer {
            position: relative;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 254, 249, 0.95) 100%);
            border-radius: 2rem;
            box-shadow: var(--shadow-medium), var(--shadow-marigold);
            user-select: none;
            cursor: grab;
            overflow: hidden;
            border: 1px solid rgba(252, 191, 73, 0.2);
            transition: box-shadow 0.3s ease;
        }

        #sphereContainer:active {
            cursor: grabbing;
        }

        #sphereContainer:hover {
            box-shadow: var(--shadow-hard), 0 0 40px 0 rgba(252, 191, 73, 0.35);
        }

        .sphere-image {
            position: absolute;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: var(--shadow-soft);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            background: var(--color-neutral-100);
        }

        .sphere-image:hover {
            transform: scale(1.15) !important;
            box-shadow: var(--shadow-marigold), var(--shadow-glow);
            border-color: var(--color-accent);
            z-index: 10000 !important;
        }

        .sphere-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-neutral-300);
            border-radius: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        .loading-text {
            color: var(--color-neutral-500);
            font-family: var(--font-heading);
            font-size: 1.125rem;
        }

        /* ==========================================
           MODAL OVERLAY
           ========================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 17, 40, 0.4);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50000;
            padding: 1rem;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--color-neutral-100);
            border-radius: 1.5rem;
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            box-shadow: var(--shadow-hard), 0 0 60px 0 rgba(252, 191, 73, 0.3);
            animation: scaleIn 0.3s ease-out;
            border: 2px solid rgba(252, 191, 73, 0.3);
        }

        .modal-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: var(--color-neutral-200);
        }

        .modal-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            background: linear-gradient(135deg, var(--color-secondary) 0%, rgba(10, 17, 40, 0.9) 100%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: var(--color-neutral-100);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close:hover {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            transform: scale(1.1) rotate(90deg);
            box-shadow: var(--shadow-glow);
        }

        .modal-info {
            padding: 1.5rem;
            background: linear-gradient(to bottom, var(--color-neutral-100), var(--color-neutral-200));
        }

        .modal-info h3 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-secondary);
            margin-bottom: 0.5rem;
        }

        .modal-info p {
            color: var(--color-neutral-600);
            line-height: 1.6;
        }

        /* ==========================================
           CONTROLS SECTION
           ========================================== */
        .controls {
            margin-top: 2rem;
            padding: 1.5rem;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 254, 249, 0.95) 100%);
            border-radius: 1rem;
            box-shadow: var(--shadow-soft);
            animation: fadeInUp 0.8s ease-out 0.4s both;
            border: 1px solid rgba(252, 191, 73, 0.2);
        }

        .controls h3 {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-secondary);
            margin-bottom: 1rem;
            text-align: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .control-group label {
            font-size: 0.875rem;
            color: var(--color-neutral-600);
            font-weight: 500;
        }

        .toggle-button {
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            color: var(--color-secondary);
            border: none;
            border-radius: 0.5rem;
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
        }

        .toggle-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium), var(--shadow-glow);
        }

        .toggle-button:active {
            transform: translateY(0);
        }

        .toggle-button.inactive {
            background: linear-gradient(135deg, var(--color-neutral-400) 0%, var(--color-neutral-300) 100%);
            color: var(--color-neutral-600);
        }

        /* ==========================================
           ANIMATIONS
           ========================================== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        /* ==========================================
           RESPONSIVE DESIGN
           ========================================== */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 1rem;
            }

            .controls {
                padding: 1rem;
            }

            .control-group {
                flex-direction: column;
                gap: 0.5rem;
                align-items: flex-start;
            }
        }

        /* ==========================================
           FOOTER
           ========================================== */
        .footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--color-neutral-600);
            font-size: 0.875rem;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--color-accent);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>DreamyHook Image Sphere</h1>
        <p>Interactive 3D gallery with smooth drag controls and momentum physics</p>
    </div>

    <!-- Main Sphere Container -->
    <div class="sphere-wrapper">
        <div id="sphereContainer" class="loading">
            <div class="loading-text">Loading...</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <h3>Controls</h3>
        <div class="control-group">
            <label>Auto Rotation</label>
            <button id="toggleAutoRotate" class="toggle-button">Enabled</button>
        </div>
        <div class="control-group">
            <label>Drag to rotate • Hover to zoom • Click to view</label>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>Built with ❤️ by <a href="#" target="_blank">DreamyHook</a></p>
    </div>

    <!-- Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-image-container">
                <img id="modalImage" src="" alt="">
                <div class="modal-close" id="modalClose">✕</div>
            </div>
            <div class="modal-info" id="modalInfo"></div>
        </div>
    </div>

    <script>
        /**
         * DreamyHook 3D Image Sphere
         * Vanilla JavaScript implementation with brand theme
         */

        // ==========================================
        // CONFIGURATION
        // ==========================================
        const CONFIG = {
            containerSize: 600,
            sphereRadius: 200,
            dragSensitivity: 0.8,
            momentumDecay: 0.96,
            maxRotationSpeed: 6,
            baseImageScale: 0.15,
            hoverScale: 1.3,
            perspective: 1000,
            autoRotate: true,
            autoRotateSpeed: 0.2
        };

        // Sample images using Unsplash
        const IMAGES = [
            {
                id: 'img-1',
                src: 'https://images.unsplash.com/photo-1758178309498-036c3d7d73b3?w=400',
                alt: 'Mountain Landscape',
                title: 'Mountain Landscape',
                description: 'A beautiful landscape captured at golden hour.'
            },
            {
                id: 'img-2',
                src: 'https://images.unsplash.com/photo-1757647016230-d6b42abc6cc9?w=400',
                alt: 'Portrait Photography',
                title: 'Portrait Photography',
                description: 'Stunning portrait photography with natural lighting.'
            },
            {
                id: 'img-3',
                src: 'https://images.unsplash.com/photo-1757906447358-f2b2cb23d5d8?w=400',
                alt: 'Urban Architecture',
                title: 'Urban Architecture',
                description: 'Modern architectural design with clean lines.'
            },
            {
                id: 'img-4',
                src: 'https://images.unsplash.com/photo-1742201877377-03d18a323c18?w=400',
                alt: 'Nature Scene',
                title: 'Nature Scene',
                description: 'Peaceful nature with vibrant colors.'
            },
            {
                id: 'img-5',
                src: 'https://images.unsplash.com/photo-1757081791153-3f48cd8c67ac?w=400',
                alt: 'Abstract Art',
                title: 'Abstract Art',
                description: 'Creative composition with bold colors.'
            },
            {
                id: 'img-6',
                src: 'https://images.unsplash.com/photo-1757626961383-be254afee9a0?w=400',
                alt: 'Sunset View',
                title: 'Sunset View',
                description: 'Golden hour sunset with warm tones.'
            },
            {
                id: 'img-7',
                src: 'https://images.unsplash.com/photo-1756748371390-099e4e6683ae?w=400',
                alt: 'Street Photography',
                title: 'Street Photography',
                description: 'Urban life captured in candid moments.'
            },
            {
                id: 'img-8',
                src: 'https://images.unsplash.com/photo-1755884405235-5c0213aa3374?w=400',
                alt: 'Coastal Scene',
                title: 'Coastal Scene',
                description: 'Serene coastal landscape with blue waters.'
            },
            {
                id: 'img-9',
                src: 'https://images.unsplash.com/photo-1757495404191-e94ed7e70046?w=400',
                alt: 'Wildlife',
                title: 'Wildlife',
                description: 'Beautiful wildlife in natural habitat.'
            },
            {
                id: 'img-10',
                src: 'https://images.unsplash.com/photo-1756197256528-f9e6fcb82b04?w=400',
                alt: 'City Lights',
                title: 'City Lights',
                description: 'Urban nightscape with illuminated buildings.'
            },
            {
                id: 'img-11',
                src: 'https://images.unsplash.com/photo-1534083220759-4c3c00112ea0?w=400',
                alt: 'Forest Path',
                title: 'Forest Path',
                description: 'Tranquil forest path with dappled light.'
            },
            {
                id: 'img-12',
                src: 'https://images.unsplash.com/photo-1755278338891-e8d8481ff087?w=400',
                alt: 'Winter Wonder',
                title: 'Winter Wonder',
                description: 'Snowy landscape with pristine beauty.'
            }
        ];

        // Duplicate images to fill sphere better
        const allImages = [];
        for (let i = 0; i < 60; i++) {
            const baseIndex = i % IMAGES.length;
            allImages.push({
                ...IMAGES[baseIndex],
                id: `img-${i + 1}`
            });
        }

        // ==========================================
        // STATE
        // ==========================================
        const state = {
            rotation: { x: 15, y: 15, z: 0 },
            velocity: { x: 0, y: 0 },
            isDragging: false,
            lastMousePos: { x: 0, y: 0 },
            imagePositions: [],
            autoRotate: CONFIG.autoRotate,
            animationFrame: null
        };

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const elements = {
            container: document.getElementById('sphereContainer'),
            modal: document.getElementById('modalOverlay'),
            modalImage: document.getElementById('modalImage'),
            modalInfo: document.getElementById('modalInfo'),
            modalClose: document.getElementById('modalClose'),
            toggleAutoRotate: document.getElementById('toggleAutoRotate')
        };

        // ==========================================
        // MATH UTILITIES
        // ==========================================
        const MathUtils = {
            degreesToRadians: (deg) => deg * (Math.PI / 180),
            normalizeAngle: (angle) => {
                while (angle > 180) angle -= 360;
                while (angle < -180) angle += 360;
                return angle;
            }
        };

        // ==========================================
        // SPHERE POSITIONING
        // ==========================================
        function generateSpherePositions() {
            const positions = [];
            const imageCount = allImages.length;
            const goldenRatio = (1 + Math.sqrt(5)) / 2;
            const angleIncrement = 2 * Math.PI / goldenRatio;

            for (let i = 0; i < imageCount; i++) {
                const t = i / imageCount;
                const inclination = Math.acos(1 - 2 * t);
                const azimuth = angleIncrement * i;

                let phi = inclination * (180 / Math.PI);
                let theta = (azimuth * (180 / Math.PI)) % 360;

                // Pole coverage
                const poleBonus = Math.pow(Math.abs(phi - 90) / 90, 0.6) * 35;
                if (phi < 90) {
                    phi = Math.max(5, phi - poleBonus);
                } else {
                    phi = Math.min(175, phi + poleBonus);
                }

                phi = 15 + (phi / 180) * 150;

                // Randomization
                const randomOffset = (Math.random() - 0.5) * 20;
                theta = (theta + randomOffset) % 360;
                phi = Math.max(0, Math.min(180, phi + (Math.random() - 0.5) * 10));

                positions.push({
                    theta: theta,
                    phi: phi,
                    radius: CONFIG.sphereRadius
                });
            }

            return positions;
        }

        function calculateWorldPositions() {
            return state.imagePositions.map((pos, index) => {
                const thetaRad = MathUtils.degreesToRadians(pos.theta);
                const phiRad = MathUtils.degreesToRadians(pos.phi);
                const rotXRad = MathUtils.degreesToRadians(state.rotation.x);
                const rotYRad = MathUtils.degreesToRadians(state.rotation.y);

                // Initial position
                let x = pos.radius * Math.sin(phiRad) * Math.cos(thetaRad);
                let y = pos.radius * Math.cos(phiRad);
                let z = pos.radius * Math.sin(phiRad) * Math.sin(thetaRad);

                // Y-axis rotation
                const x1 = x * Math.cos(rotYRad) + z * Math.sin(rotYRad);
                const z1 = -x * Math.sin(rotYRad) + z * Math.cos(rotYRad);
                x = x1;
                z = z1;

                // X-axis rotation
                const y2 = y * Math.cos(rotXRad) - z * Math.sin(rotXRad);
                const z2 = y * Math.sin(rotXRad) + z * Math.cos(rotXRad);
                y = y2;
                z = z2;

                // Visibility and fading
                const fadeZoneStart = -10;
                const fadeZoneEnd = -30;
                const isVisible = z > fadeZoneEnd;
                let fadeOpacity = 1;
                if (z <= fadeZoneStart) {
                    fadeOpacity = Math.max(0, (z - fadeZoneEnd) / (fadeZoneStart - fadeZoneEnd));
                }

                // Scaling
                const isPoleImage = pos.phi < 30 || pos.phi > 150;
                const distanceFromCenter = Math.sqrt(x * x + y * y);
                const maxDistance = CONFIG.sphereRadius;
                const distanceRatio = Math.min(distanceFromCenter / maxDistance, 1);
                const distancePenalty = isPoleImage ? 0.4 : 0.7;
                const centerScale = Math.max(0.3, 1 - distanceRatio * distancePenalty);
                const depthScale = (z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius);
                const scale = centerScale * Math.max(0.5, 0.8 + depthScale * 0.3);

                return {
                    x, y, z,
                    scale: Math.max(0.25, scale),
                    zIndex: Math.round(1000 + z),
                    isVisible,
                    fadeOpacity,
                    originalIndex: index
                };
            });
        }

        // ==========================================
        // RENDERING
        // ==========================================
        function renderSphere() {
            const worldPositions = calculateWorldPositions();
            const container = elements.container;

            // Clear existing images
            container.innerHTML = '';
            container.classList.remove('loading');

            worldPositions.forEach((position, index) => {
                if (!position.isVisible) return;

                const imageData = allImages[index];
                const imageSize = CONFIG.containerSize * CONFIG.baseImageScale * position.scale;

                const imageEl = document.createElement('div');
                imageEl.className = 'sphere-image';
                imageEl.style.width = `${imageSize}px`;
                imageEl.style.height = `${imageSize}px`;
                imageEl.style.left = `${CONFIG.containerSize/2 + position.x}px`;
                imageEl.style.top = `${CONFIG.containerSize/2 + position.y}px`;
                imageEl.style.opacity = position.fadeOpacity;
                imageEl.style.transform = 'translate(-50%, -50%)';
                imageEl.style.zIndex = position.zIndex;

                const img = document.createElement('img');
                img.src = imageData.src;
                img.alt = imageData.alt;
                img.loading = index < 3 ? 'eager' : 'lazy';

                imageEl.appendChild(img);

                // Click handler for modal
                imageEl.addEventListener('click', () => openModal(imageData));

                container.appendChild(imageEl);
            });
        }

        // ==========================================
        // PHYSICS & ANIMATION
        // ==========================================
        function updateMomentum() {
            if (state.isDragging) return;

            // Apply decay
            state.velocity.x *= CONFIG.momentumDecay;
            state.velocity.y *= CONFIG.momentumDecay;

            // Stop if too slow
            if (!state.autoRotate && Math.abs(state.velocity.x) < 0.01 && Math.abs(state.velocity.y) < 0.01) {
                state.velocity.x = 0;
                state.velocity.y = 0;
            }

            // Update rotation
            let newY = state.rotation.y;
            if (state.autoRotate) {
                newY += CONFIG.autoRotateSpeed;
            }
            newY += Math.max(-CONFIG.maxRotationSpeed, Math.min(CONFIG.maxRotationSpeed, state.velocity.y));

            state.rotation.x = MathUtils.normalizeAngle(
                state.rotation.x + Math.max(-CONFIG.maxRotationSpeed, Math.min(CONFIG.maxRotationSpeed, state.velocity.x))
            );
            state.rotation.y = MathUtils.normalizeAngle(newY);

            renderSphere();
        }

        function animate() {
            updateMomentum();
            state.animationFrame = requestAnimationFrame(animate);
        }

        // ==========================================
        // EVENT HANDLERS
        // ==========================================
        function handleMouseDown(e) {
            e.preventDefault();
            state.isDragging = true;
            state.velocity = { x: 0, y: 0 };
            state.lastMousePos = { x: e.clientX, y: e.clientY };
        }

        function handleMouseMove(e) {
            if (!state.isDragging) return;

            const deltaX = e.clientX - state.lastMousePos.x;
            const deltaY = e.clientY - state.lastMousePos.y;

            const rotationDelta = {
                x: -deltaY * CONFIG.dragSensitivity,
                y: deltaX * CONFIG.dragSensitivity
            };

            state.rotation.x = MathUtils.normalizeAngle(
                state.rotation.x + Math.max(-CONFIG.maxRotationSpeed, Math.min(CONFIG.maxRotationSpeed, rotationDelta.x))
            );
            state.rotation.y = MathUtils.normalizeAngle(
                state.rotation.y + Math.max(-CONFIG.maxRotationSpeed, Math.min(CONFIG.maxRotationSpeed, rotationDelta.y))
            );

            state.velocity = {
                x: Math.max(-CONFIG.maxRotationSpeed, Math.min(CONFIG.maxRotationSpeed, rotationDelta.x)),
                y: Math.max(-CONFIG.maxRotationSpeed, Math.min(CONFIG.maxRotationSpeed, rotationDelta.y))
            };

            state.lastMousePos = { x: e.clientX, y: e.clientY };
            renderSphere();
        }

        function handleMouseUp() {
            state.isDragging = false;
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            state.isDragging = true;
            state.velocity = { x: 0, y: 0 };
            state.lastMousePos = { x: touch.clientX, y: touch.clientY };
        }

        function handleTouchMove(e) {
            if (!state.isDragging) return;
            e.preventDefault();

            const touch = e.touches[0];
            const deltaX = touch.clientX - state.lastMousePos.x;
            const deltaY = touch.clientY - state.lastMousePos.y;

            const rotationDelta = {
                x: -deltaY * CONFIG.dragSensitivity,
                y: deltaX * CONFIG.dragSensitivity
            };

            state.rotation.x = MathUtils.normalizeAngle(
                state.rotation.x + Math.max(-CONFIG.maxRotationSpeed, Math.min(CONFIG.maxRotationSpeed, rotationDelta.x))
            );
            state.rotation.y = MathUtils.normalizeAngle(
                state.rotation.y + Math.max(-CONFIG.maxRotationSpeed, Math.min(CONFIG.maxRotationSpeed, rotationDelta.y))
            );

            state.velocity = {
                x: Math.max(-CONFIG.maxRotationSpeed, Math.min(CONFIG.maxRotationSpeed, rotationDelta.x)),
                y: Math.max(-CONFIG.maxRotationSpeed, Math.min(CONFIG.maxRotationSpeed, rotationDelta.y))
            };

            state.lastMousePos = { x: touch.clientX, y: touch.clientY };
            renderSphere();
        }

        function handleTouchEnd() {
            state.isDragging = false;
        }

        // ==========================================
        // MODAL FUNCTIONS
        // ==========================================
        function openModal(imageData) {
            elements.modalImage.src = imageData.src;
            elements.modalImage.alt = imageData.alt;

            if (imageData.title || imageData.description) {
                elements.modalInfo.innerHTML = `
                    ${imageData.title ? `<h3>${imageData.title}</h3>` : ''}
                    ${imageData.description ? `<p>${imageData.description}</p>` : ''}
                `;
                elements.modalInfo.style.display = 'block';
            } else {
                elements.modalInfo.style.display = 'none';
            }

            elements.modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            elements.modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ==========================================
        // CONTROLS
        // ==========================================
        function toggleAutoRotate() {
            state.autoRotate = !state.autoRotate;
            elements.toggleAutoRotate.textContent = state.autoRotate ? 'Enabled' : 'Disabled';
            elements.toggleAutoRotate.classList.toggle('inactive', !state.autoRotate);
        }

        // ==========================================
        // RESPONSIVE SIZING
        // ==========================================
        function updateContainerSize() {
            const maxSize = Math.min(window.innerWidth - 40, 600);
            CONFIG.containerSize = maxSize;
            CONFIG.sphereRadius = maxSize * 0.333;

            elements.container.style.width = `${CONFIG.containerSize}px`;
            elements.container.style.height = `${CONFIG.containerSize}px`;
            elements.container.style.perspective = `${CONFIG.perspective}px`;

            renderSphere();
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function init() {
            // Generate positions
            state.imagePositions = generateSpherePositions();

            // Set container size
            updateContainerSize();

            // Render sphere
            renderSphere();

            // Start animation
            animate();

            // Event listeners
            elements.container.addEventListener('mousedown', handleMouseDown);
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);

            elements.container.addEventListener('touchstart', handleTouchStart, { passive: false });
            document.addEventListener('touchmove', handleTouchMove, { passive: false });
            document.addEventListener('touchend', handleTouchEnd);

            elements.modalClose.addEventListener('click', closeModal);
            elements.modal.addEventListener('click', (e) => {
                if (e.target === elements.modal) closeModal();
            });

            elements.toggleAutoRotate.addEventListener('click', toggleAutoRotate);

            window.addEventListener('resize', updateContainerSize);
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
