<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Inverted Cursor Demo</title>

    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap">

    <style>
        /* ------------------------- DreamyHook Theme Variables ------------------------- */
        :root {
            /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
            --color-primary: #FCBF49;        /* Marigold Yellow - primary brand color */
            --color-secondary: #0A1128;      /* Midnight Blue - secondary brand color */
            --color-accent: #FFD23F;         /* Buttercup Yellow - bright accent */
            --color-coral: #FF6B4A;          /* Coral - warm accent for CTAs */
            --color-sky: #0ea5e9;            /* Sky Blue - fresh accent */

            /* Neutral Colors - Warm Gray Palette for Light Theme */
            --color-neutral-100: #ffffff;    /* Pure white */
            --color-neutral-200: #fffef9;    /* Warm white */
            --color-neutral-300: #fffdf0;    /* Cream white */
            --color-neutral-400: #fef9e7;    /* Light cream */
            --color-neutral-500: #78716c;    /* Medium warm gray */
            --color-neutral-600: #57534e;    /* Dark warm gray */
            --color-neutral-700: #44403c;    /* Very dark warm gray */
            --color-neutral-800: #292524;    /* Almost black warm gray */
            --color-neutral-900: #1c1917;    /* Near black warm */

            /* Semantic Color Assignments */
            --color-light: var(--color-neutral-200);
            --color-dark: var(--color-secondary);
            --color-white: var(--color-neutral-100);
            --color-black: var(--color-neutral-900);

            /* Functional Colors */
            --color-error: #ef4444;
            --color-success: #22c55e;
            --color-warning: #f59e0b;

            /* Theme-Specific Colors */
            --theme-primary: #FCBF49;
            --theme-secondary: #0A1128;
            --theme-accent: #FFD23F;
            --theme-background: #fffef9;
        }

        /* ------------------------- Reset & Base Styles ------------------------- */
        *,
        *:after,
        *:before {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        html,
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
            color: var(--color-secondary);
            cursor: none; /* Hide default cursor */
            overflow: hidden;
        }

        /* Selection - Marigold yellow background with white text */
        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
            text-shadow: none;
        }

        ::-moz-selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
            text-shadow: none;
        }

        /* ------------------------- Custom Cursor Styles ------------------------- */
        #custom-cursor {
            position: fixed;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--color-white);
            mix-blend-mode: difference;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
            will-change: transform;
        }

        #custom-cursor.visible {
            opacity: 1;
        }

        /* ------------------------- Main Content Styles ------------------------- */
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .main-content {
            text-align: center;
            user-select: none;
            padding: 2rem;
            z-index: 1;
        }

        h1 {
            font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FCBF49 0%, #FFD23F 50%, #FF6B4A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: slideUp 0.8s ease-out forwards;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--color-secondary);
            margin-bottom: 2rem;
            opacity: 0.8;
            animation: slideUp 1s ease-out forwards;
            animation-delay: 0.2s;
            opacity: 0;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 2rem 3rem;
            box-shadow: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            margin-top: 2rem;
            animation: scaleIn 0.8s ease-out forwards;
            animation-delay: 0.4s;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            box-shadow: 0 0 30px rgba(252, 191, 73, 0.4);
            transform: translateY(-5px);
        }

        .feature-list {
            list-style: none;
            margin-top: 1.5rem;
        }

        .feature-list li {
            font-size: 1rem;
            color: var(--color-neutral-700);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feature-list li::before {
            content: "●";
            color: var(--color-primary);
            font-weight: bold;
            margin-right: 0.5rem;
        }

        /* Decorative background elements */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            pointer-events: none;
        }

        .bg-circle-1 {
            width: 300px;
            height: 300px;
            background: var(--color-primary);
            top: 10%;
            left: 15%;
            animation: float 6s ease-in-out infinite;
        }

        .bg-circle-2 {
            width: 200px;
            height: 200px;
            background: var(--color-accent);
            bottom: 15%;
            right: 20%;
            animation: float 8s ease-in-out infinite;
            animation-delay: 1s;
        }

        .bg-circle-3 {
            width: 150px;
            height: 150px;
            background: var(--color-coral);
            top: 60%;
            left: 10%;
            animation: float 7s ease-in-out infinite;
            animation-delay: 0.5s;
        }

        /* ------------------------- Animations ------------------------- */
        @keyframes slideUp {
            0% {
                transform: translateY(30px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0.95);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* ------------------------- Responsive Styles ------------------------- */
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .feature-card {
                padding: 1.5rem 2rem;
            }

            #custom-cursor {
                width: 40px;
                height: 40px;
            }

            .bg-circle-1,
            .bg-circle-2,
            .bg-circle-3 {
                display: none; /* Hide decorative elements on mobile */
            }
        }

        @media screen and (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .feature-card {
                padding: 1rem 1.5rem;
                margin-top: 1rem;
            }

            .feature-list li {
                font-size: 0.9rem;
            }
        }

        /* For devices without hover capability, show default cursor */
        @media (hover: none) {
            body {
                cursor: auto;
            }

            #custom-cursor {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Custom Circular Inverted Cursor -->
    <div id="custom-cursor"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Decorative Background Elements -->
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>

        <!-- Main Content -->
        <main class="main-content">
            <h1>Move your mouse</h1>
            <p class="subtitle">Experience the DreamyHook inverted cursor effect</p>

            <div class="feature-card">
                <h2 style="font-family: 'Poppins', sans-serif; font-size: 1.5rem; color: var(--color-secondary); margin-bottom: 0.5rem;">
                    Features
                </h2>
                <ul class="feature-list">
                    <li>Smooth cursor animation with laggy follow effect</li>
                    <li>Inverted color mix-blend mode</li>
                    <li>DreamyHook brand colors</li>
                    <li>Fully responsive design</li>
                    <li>Pure vanilla JavaScript</li>
                </ul>
            </div>
        </main>
    </div>

    <!-- JavaScript for Custom Cursor -->
    <script>
        (function() {
            'use strict';

            // Configuration
            const CURSOR_SIZE = 60;
            const FOLLOW_SPEED = 0.2; // Lower = more lag, higher = more responsive

            // Get cursor element
            const cursor = document.getElementById('custom-cursor');

            // Cursor state
            let mouseX = -CURSOR_SIZE;
            let mouseY = -CURSOR_SIZE;
            let currentX = -CURSOR_SIZE;
            let currentY = -CURSOR_SIZE;
            let isVisible = false;
            let animationFrameId = null;

            // Update cursor position on mouse move
            function handleMouseMove(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;

                if (!isVisible) {
                    isVisible = true;
                    cursor.classList.add('visible');
                }
            }

            // Show cursor when mouse enters the window
            function handleMouseEnter() {
                isVisible = true;
                cursor.classList.add('visible');
            }

            // Hide cursor when mouse leaves the window
            function handleMouseLeave() {
                isVisible = false;
                cursor.classList.remove('visible');
            }

            // Animation loop for smooth cursor follow
            function animate() {
                // Calculate target position (center the cursor on mouse position)
                const targetX = mouseX - CURSOR_SIZE / 2;
                const targetY = mouseY - CURSOR_SIZE / 2;

                // Calculate delta with easing
                const deltaX = (targetX - currentX) * FOLLOW_SPEED;
                const deltaY = (targetY - currentY) * FOLLOW_SPEED;

                // Update current position
                currentX += deltaX;
                currentY += deltaY;

                // Apply transform
                cursor.style.transform = `translate(${currentX}px, ${currentY}px)`;

                // Continue animation loop
                animationFrameId = requestAnimationFrame(animate);
            }

            // Initialize cursor behavior
            function init() {
                // Add event listeners
                document.addEventListener('mousemove', handleMouseMove);
                document.documentElement.addEventListener('mouseenter', handleMouseEnter);
                document.documentElement.addEventListener('mouseleave', handleMouseLeave);

                // Start animation loop
                animationFrameId = requestAnimationFrame(animate);

                // Set initial cursor position off-screen
                cursor.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }

            // Cleanup function
            function cleanup() {
                document.removeEventListener('mousemove', handleMouseMove);
                document.documentElement.removeEventListener('mouseenter', handleMouseEnter);
                document.documentElement.removeEventListener('mouseleave', handleMouseLeave);

                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                }

                // Restore default cursor
                document.body.style.cursor = 'auto';
            }

            // Initialize when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // Cleanup on page unload
            window.addEventListener('beforeunload', cleanup);

            // Handle visibility changes
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    isVisible = false;
                    cursor.classList.remove('visible');
                }
            });

            // Responsive cursor size adjustment
            function updateCursorSize() {
                const width = window.innerWidth;
                let newSize = CURSOR_SIZE;

                if (width <= 768) {
                    newSize = 40;
                } else {
                    newSize = 60;
                }

                cursor.style.width = newSize + 'px';
                cursor.style.height = newSize + 'px';
            }

            // Update cursor size on resize
            window.addEventListener('resize', updateCursorSize);
            updateCursorSize();

        })();
    </script>
</body>
</html>
