<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamyHook - Particle Text Effect</title>

  <!-- Import DreamyHook Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ===================== DreamyHook Theme Variables ===================== */
    :root {
      /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
      --color-primary: #FCBF49;        /* Marigold Yellow - primary brand color */
      --color-secondary: #0A1128;      /* Midnight Blue - secondary brand color */
      --color-accent: #FFD23F;         /* Buttercup Yellow - bright accent */
      --color-coral: #FF6B4A;          /* Coral - warm accent for CTAs */
      --color-sky: #0ea5e9;            /* Sky Blue - fresh accent */

      /* Neutral Colors - Warm Gray Palette for Light Theme */
      --color-neutral-100: #ffffff;    /* Pure white */
      --color-neutral-200: #fffef9;    /* Warm white */
      --color-neutral-300: #fffdf0;    /* Cream white */
      --color-neutral-400: #fef9e7;    /* Light cream */
      --color-neutral-500: #78716c;    /* Medium warm gray */
      --color-neutral-600: #57534e;    /* Dark warm gray */
      --color-neutral-700: #44403c;    /* Very dark warm gray */
      --color-neutral-800: #292524;    /* Almost black warm gray */
      --color-neutral-900: #1c1917;    /* Near black warm */

      /* Semantic Color Assignments */
      --color-light: var(--color-neutral-200);
      --color-dark: var(--color-secondary);

      /* Theme-Specific Colors */
      --theme-background: #fffef9;     /* Warm white background */
      --theme-text: var(--color-secondary);

      /* Animation & Timing */
      --cubic-default: cubic-bezier(0.65, 0.05, 0, 1);
      --duration-default: 0.735s;
    }

    /* ===================== Reset & Base Styles ===================== */
    *,
    *:after,
    *:before {
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      -webkit-font-smoothing: antialiased;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
      color: var(--color-dark);
    }

    /* Selection - Marigold yellow background with white text */
    ::selection {
      background-color: var(--color-primary);
      color: var(--color-neutral-100);
      text-shadow: none;
    }

    ::-moz-selection {
      background-color: var(--color-primary);
      color: var(--color-neutral-100);
      text-shadow: none;
    }

    /* ===================== Layout Styles ===================== */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
    }

    .canvas-wrapper {
      position: relative;
      border-radius: 1.5rem;
      background: var(--color-secondary);
      box-shadow: 0 10px 40px 0 rgba(10, 17, 40, 0.15),
                  0 0 30px 0 rgba(252, 191, 73, 0.25);
      overflow: hidden;
      max-width: 100%;
      transition: box-shadow 0.3s ease;
    }

    .canvas-wrapper:hover {
      box-shadow: 0 15px 50px 0 rgba(10, 17, 40, 0.2),
                  0 0 40px 0 rgba(252, 191, 73, 0.35);
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 1.5rem;
    }

    .info-panel {
      margin-top: 2rem;
      text-align: center;
      max-width: 600px;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 1rem;
      box-shadow: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
      backdrop-filter: blur(10px);
    }

    .info-panel h1 {
      font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #FCBF49 0%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .info-panel p {
      color: var(--color-neutral-700);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }

    .info-panel p.instructions {
      color: var(--color-neutral-600);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(252, 191, 73, 0.2);
    }

    .brand-badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, #FFD23F 0%, #FCBF49 100%);
      color: var(--color-secondary);
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.875rem;
      margin-top: 1rem;
      box-shadow: 0 4px 20px 0 rgba(252, 191, 73, 0.15);
      transition: all 0.3s ease;
    }

    .brand-badge:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px 0 rgba(252, 191, 73, 0.25);
    }

    /* ===================== Responsive Design ===================== */
    @media screen and (max-width: 767px) {
      .container {
        padding: 1rem;
      }

      .info-panel h1 {
        font-size: 1.5rem;
      }

      .info-panel p {
        font-size: 0.875rem;
      }

      .info-panel p.instructions {
        font-size: 0.75rem;
      }
    }

    @media screen and (max-width: 479px) {
      .container {
        padding: 0.5rem;
      }

      .info-panel {
        padding: 1rem;
      }

      .info-panel h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="canvas-wrapper">
      <canvas id="particleCanvas"></canvas>
    </div>

    <div class="info-panel">
      <h1>DreamyHook Particle Text Effect</h1>
      <p>Watch as particles dynamically form text with stunning visual effects</p>
      <p class="instructions">
        <strong>Interactive Controls:</strong><br>
        Right-click and hold while moving your mouse to destroy particles<br>
        Words automatically change every 4 seconds
      </p>
      <span class="brand-badge">Powered by DreamyHook</span>
    </div>
  </div>

  <script>
    // ===================== Particle Class =====================
    class Particle {
      constructor() {
        this.pos = { x: 0, y: 0 };
        this.vel = { x: 0, y: 0 };
        this.acc = { x: 0, y: 0 };
        this.target = { x: 0, y: 0 };

        this.closeEnoughTarget = 100;
        this.maxSpeed = 1.0;
        this.maxForce = 0.1;
        this.particleSize = 10;
        this.isKilled = false;

        this.startColor = { r: 0, g: 0, b: 0 };
        this.targetColor = { r: 0, g: 0, b: 0 };
        this.colorWeight = 0;
        this.colorBlendRate = 0.01;
      }

      move() {
        // Check if particle is close enough to its target to slow down
        let proximityMult = 1;
        const distance = Math.sqrt(
          Math.pow(this.pos.x - this.target.x, 2) +
          Math.pow(this.pos.y - this.target.y, 2)
        );

        if (distance < this.closeEnoughTarget) {
          proximityMult = distance / this.closeEnoughTarget;
        }

        // Add force towards target
        const towardsTarget = {
          x: this.target.x - this.pos.x,
          y: this.target.y - this.pos.y,
        };

        const magnitude = Math.sqrt(
          towardsTarget.x * towardsTarget.x +
          towardsTarget.y * towardsTarget.y
        );

        if (magnitude > 0) {
          towardsTarget.x = (towardsTarget.x / magnitude) * this.maxSpeed * proximityMult;
          towardsTarget.y = (towardsTarget.y / magnitude) * this.maxSpeed * proximityMult;
        }

        const steer = {
          x: towardsTarget.x - this.vel.x,
          y: towardsTarget.y - this.vel.y,
        };

        const steerMagnitude = Math.sqrt(steer.x * steer.x + steer.y * steer.y);
        if (steerMagnitude > 0) {
          steer.x = (steer.x / steerMagnitude) * this.maxForce;
          steer.y = (steer.y / steerMagnitude) * this.maxForce;
        }

        this.acc.x += steer.x;
        this.acc.y += steer.y;

        // Move particle
        this.vel.x += this.acc.x;
        this.vel.y += this.acc.y;
        this.pos.x += this.vel.x;
        this.pos.y += this.vel.y;
        this.acc.x = 0;
        this.acc.y = 0;
      }

      draw(ctx, drawAsPoints) {
        // Blend towards target color
        if (this.colorWeight < 1.0) {
          this.colorWeight = Math.min(this.colorWeight + this.colorBlendRate, 1.0);
        }

        // Calculate current color
        const currentColor = {
          r: Math.round(this.startColor.r + (this.targetColor.r - this.startColor.r) * this.colorWeight),
          g: Math.round(this.startColor.g + (this.targetColor.g - this.startColor.g) * this.colorWeight),
          b: Math.round(this.startColor.b + (this.targetColor.b - this.startColor.b) * this.colorWeight),
        };

        if (drawAsPoints) {
          ctx.fillStyle = `rgb(${currentColor.r}, ${currentColor.g}, ${currentColor.b})`;
          ctx.fillRect(this.pos.x, this.pos.y, 2, 2);
        } else {
          ctx.fillStyle = `rgb(${currentColor.r}, ${currentColor.g}, ${currentColor.b})`;
          ctx.beginPath();
          ctx.arc(this.pos.x, this.pos.y, this.particleSize / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      kill(width, height) {
        if (!this.isKilled) {
          // Set target outside the scene
          const randomPos = this.generateRandomPos(width / 2, height / 2, (width + height) / 2);
          this.target.x = randomPos.x;
          this.target.y = randomPos.y;

          // Begin blending color to black
          this.startColor = {
            r: this.startColor.r + (this.targetColor.r - this.startColor.r) * this.colorWeight,
            g: this.startColor.g + (this.targetColor.g - this.startColor.g) * this.colorWeight,
            b: this.startColor.b + (this.targetColor.b - this.startColor.b) * this.colorWeight,
          };
          this.targetColor = { r: 0, g: 0, b: 0 };
          this.colorWeight = 0;

          this.isKilled = true;
        }
      }

      generateRandomPos(x, y, mag) {
        const randomX = Math.random() * 1000;
        const randomY = Math.random() * 500;

        const direction = {
          x: randomX - x,
          y: randomY - y,
        };

        const magnitude = Math.sqrt(direction.x * direction.x + direction.y * direction.y);
        if (magnitude > 0) {
          direction.x = (direction.x / magnitude) * mag;
          direction.y = (direction.y / magnitude) * mag;
        }

        return {
          x: x + direction.x,
          y: y + direction.y,
        };
      }
    }

    // ===================== DreamyHook Particle Text Effect =====================
    class ParticleTextEffect {
      constructor(canvasId, words) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.words = words || ['DREAMYHOOK', 'PARTICLE', 'TEXT EFFECT', 'CREATIVE', 'DIGITAL'];
        this.particles = [];
        this.frameCount = 0;
        this.wordIndex = 0;
        this.mouse = { x: 0, y: 0, isPressed: false, isRightClick: false };

        this.pixelSteps = 6;
        this.drawAsPoints = true;

        // DreamyHook brand colors for particles
        this.brandColors = [
          { r: 252, g: 191, b: 73 },   // Marigold Yellow
          { r: 255, g: 210, b: 63 },   // Buttercup Yellow
          { r: 255, g: 107, b: 74 },   // Coral
          { r: 14, g: 165, b: 233 },   // Sky Blue
          { r: 245, g: 158, b: 11 },   // Darker Golden
        ];

        this.init();
      }

      init() {
        this.canvas.width = 1000;
        this.canvas.height = 500;

        // Event listeners
        this.canvas.addEventListener('mousedown', this.handleMouseDown.bind(this));
        this.canvas.addEventListener('mouseup', this.handleMouseUp.bind(this));
        this.canvas.addEventListener('mousemove', this.handleMouseMove.bind(this));
        this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Initialize with first word
        this.nextWord(this.words[0]);

        // Start animation
        this.animate();
      }

      generateRandomPos(x, y, mag) {
        const randomX = Math.random() * 1000;
        const randomY = Math.random() * 500;

        const direction = {
          x: randomX - x,
          y: randomY - y,
        };

        const magnitude = Math.sqrt(direction.x * direction.x + direction.y * direction.y);
        if (magnitude > 0) {
          direction.x = (direction.x / magnitude) * mag;
          direction.y = (direction.y / magnitude) * mag;
        }

        return {
          x: x + direction.x,
          y: y + direction.y,
        };
      }

      nextWord(word) {
        // Create off-screen canvas for text rendering
        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = this.canvas.width;
        offscreenCanvas.height = this.canvas.height;
        const offscreenCtx = offscreenCanvas.getContext('2d');

        // Draw text
        offscreenCtx.fillStyle = 'white';
        offscreenCtx.font = 'bold 100px Poppins, Arial, sans-serif';
        offscreenCtx.textAlign = 'center';
        offscreenCtx.textBaseline = 'middle';
        offscreenCtx.fillText(word, this.canvas.width / 2, this.canvas.height / 2);

        const imageData = offscreenCtx.getImageData(0, 0, this.canvas.width, this.canvas.height);
        const pixels = imageData.data;

        // Generate new color from DreamyHook brand colors
        const newColor = this.brandColors[Math.floor(Math.random() * this.brandColors.length)];

        let particleIndex = 0;

        // Collect coordinates
        const coordsIndexes = [];
        for (let i = 0; i < pixels.length; i += this.pixelSteps * 4) {
          coordsIndexes.push(i);
        }

        // Shuffle coordinates for fluid motion
        for (let i = coordsIndexes.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [coordsIndexes[i], coordsIndexes[j]] = [coordsIndexes[j], coordsIndexes[i]];
        }

        for (const coordIndex of coordsIndexes) {
          const pixelIndex = coordIndex;
          const alpha = pixels[pixelIndex + 3];

          if (alpha > 0) {
            const x = (pixelIndex / 4) % this.canvas.width;
            const y = Math.floor(pixelIndex / 4 / this.canvas.width);

            let particle;

            if (particleIndex < this.particles.length) {
              particle = this.particles[particleIndex];
              particle.isKilled = false;
              particleIndex++;
            } else {
              particle = new Particle();

              const randomPos = this.generateRandomPos(
                this.canvas.width / 2,
                this.canvas.height / 2,
                (this.canvas.width + this.canvas.height) / 2
              );
              particle.pos.x = randomPos.x;
              particle.pos.y = randomPos.y;

              particle.maxSpeed = Math.random() * 6 + 4;
              particle.maxForce = particle.maxSpeed * 0.05;
              particle.particleSize = Math.random() * 6 + 6;
              particle.colorBlendRate = Math.random() * 0.0275 + 0.0025;

              this.particles.push(particle);
            }

            // Set color transition
            particle.startColor = {
              r: particle.startColor.r + (particle.targetColor.r - particle.startColor.r) * particle.colorWeight,
              g: particle.startColor.g + (particle.targetColor.g - particle.startColor.g) * particle.colorWeight,
              b: particle.startColor.b + (particle.targetColor.b - particle.startColor.b) * particle.colorWeight,
            };
            particle.targetColor = { ...newColor };
            particle.colorWeight = 0;

            particle.target.x = x;
            particle.target.y = y;
          }
        }

        // Kill remaining particles
        for (let i = particleIndex; i < this.particles.length; i++) {
          this.particles[i].kill(this.canvas.width, this.canvas.height);
        }
      }

      animate() {
        // Background with motion blur
        this.ctx.fillStyle = 'rgba(10, 17, 40, 0.1)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Update and draw particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const particle = this.particles[i];
          particle.move();
          particle.draw(this.ctx, this.drawAsPoints);

          // Remove dead particles that are out of bounds
          if (particle.isKilled) {
            if (
              particle.pos.x < 0 ||
              particle.pos.x > this.canvas.width ||
              particle.pos.y < 0 ||
              particle.pos.y > this.canvas.height
            ) {
              this.particles.splice(i, 1);
            }
          }
        }

        // Handle mouse interaction
        if (this.mouse.isPressed && this.mouse.isRightClick) {
          this.particles.forEach((particle) => {
            const distance = Math.sqrt(
              Math.pow(particle.pos.x - this.mouse.x, 2) +
              Math.pow(particle.pos.y - this.mouse.y, 2)
            );
            if (distance < 50) {
              particle.kill(this.canvas.width, this.canvas.height);
            }
          });
        }

        // Auto-advance words
        this.frameCount++;
        if (this.frameCount % 240 === 0) {
          this.wordIndex = (this.wordIndex + 1) % this.words.length;
          this.nextWord(this.words[this.wordIndex]);
        }

        requestAnimationFrame(this.animate.bind(this));
      }

      handleMouseDown(e) {
        this.mouse.isPressed = true;
        this.mouse.isRightClick = e.button === 2;
        const rect = this.canvas.getBoundingClientRect();
        this.mouse.x = e.clientX - rect.left;
        this.mouse.y = e.clientY - rect.top;
      }

      handleMouseUp() {
        this.mouse.isPressed = false;
        this.mouse.isRightClick = false;
      }

      handleMouseMove(e) {
        const rect = this.canvas.getBoundingClientRect();
        this.mouse.x = e.clientX - rect.left;
        this.mouse.y = e.clientY - rect.top;
      }
    }

    // ===================== Initialize Application =====================
    document.addEventListener('DOMContentLoaded', () => {
      new ParticleTextEffect('particleCanvas', [
        'DREAMYHOOK',
        'CREATIVE',
        'DIGITAL',
        'PARTICLE',
        'EFFECT',
        'AWESOME'
      ]);
    });
  </script>
</body>
</html>
