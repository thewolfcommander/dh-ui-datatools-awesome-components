<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Animated Sidebar</title>

    <!-- Import fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* DreamyHook Theme Variables */
        :root {
            /* Brand Colors */
            --color-primary: #FCBF49;        /* Marigold Yellow */
            --color-secondary: #0A1128;      /* Midnight Blue */
            --color-accent: #FFD23F;         /* Buttercup Yellow */
            --color-coral: #FF6B4A;          /* Coral */
            --color-sky: #0ea5e9;            /* Sky Blue */

            /* Neutral Colors - Warm Gray Palette */
            --color-neutral-100: #ffffff;
            --color-neutral-200: #fffef9;
            --color-neutral-300: #fffdf0;
            --color-neutral-400: #fef9e7;
            --color-neutral-500: #78716c;
            --color-neutral-600: #57534e;
            --color-neutral-700: #44403c;
            --color-neutral-800: #292524;
            --color-neutral-900: #1c1917;

            /* Semantic Colors */
            --color-success: #22c55e;
            --color-warning: #f59e0b;
            --color-error: #ef4444;

            /* Shadows */
            --shadow-soft: 0 2px 15px 0 rgba(10, 17, 40, 0.05);
            --shadow-medium: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            --shadow-hard: 0 10px 40px 0 rgba(10, 17, 40, 0.15);
            --shadow-warm: 0 4px 20px 0 rgba(252, 191, 73, 0.15);

            /* Transitions */
            --transition-default: 0.3s ease-in-out;
        }

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
            color: var(--color-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 1400px;
            height: 60vh;
            min-height: 500px;
            background: var(--color-neutral-100);
            border-radius: 16px;
            box-shadow: var(--shadow-medium);
            overflow: hidden;
            display: flex;
            border: 1px solid rgba(252, 191, 73, 0.2);
        }

        /* Sidebar Styles */
        .sidebar {
            background: linear-gradient(180deg, var(--color-neutral-200) 0%, var(--color-neutral-300) 100%);
            width: 300px;
            height: 100%;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: width var(--transition-default);
            border-right: 1px solid rgba(252, 191, 73, 0.15);
            position: relative;
            z-index: 10;
        }

        .sidebar:hover {
            box-shadow: 2px 0 15px rgba(252, 191, 73, 0.1);
        }

        .sidebar.collapsed {
            width: 70px;
        }

        /* Logo */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 28px;
            height: 24px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            border-radius: 8px 8px 2px 2px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(252, 191, 73, 0.3);
        }

        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: var(--color-secondary);
            font-size: 16px;
            white-space: nowrap;
            opacity: 1;
            transition: opacity var(--transition-default);
        }

        .sidebar.collapsed .logo-text {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        /* Navigation */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--color-neutral-700);
            text-decoration: none;
            border-radius: 12px;
            transition: all var(--transition-default);
            position: relative;
            overflow: hidden;
        }

        .nav-link:hover {
            background: linear-gradient(135deg, rgba(252, 191, 73, 0.15) 0%, rgba(255, 210, 63, 0.1) 100%);
            color: var(--color-secondary);
            transform: translateX(4px);
            box-shadow: var(--shadow-soft);
        }

        .nav-link.active {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            color: var(--color-neutral-100);
            box-shadow: var(--shadow-warm);
        }

        .nav-link svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .nav-link span {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            opacity: 1;
            transition: opacity var(--transition-default);
        }

        .sidebar.collapsed .nav-link span {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        /* User Profile */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(252, 191, 73, 0.08) 0%, rgba(255, 210, 63, 0.05) 100%);
            border: 1px solid rgba(252, 191, 73, 0.2);
            transition: all var(--transition-default);
        }

        .user-profile:hover {
            box-shadow: var(--shadow-soft);
            border-color: var(--color-primary);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-coral) 0%, var(--color-primary) 100%);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(255, 107, 74, 0.3);
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-secondary);
            white-space: nowrap;
            opacity: 1;
            transition: opacity var(--transition-default);
        }

        .sidebar.collapsed .user-name {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        /* Dashboard Content */
        .dashboard {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: linear-gradient(135deg, rgba(255, 254, 249, 0.5) 0%, rgba(254, 249, 231, 0.3) 100%);
        }

        .dashboard-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 16px;
        }

        .dashboard-grid.top {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .dashboard-grid.bottom {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            flex: 1;
        }

        .dashboard-card {
            background: var(--color-neutral-100);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(252, 191, 73, 0.1);
            transition: all var(--transition-default);
        }

        .dashboard-card:hover {
            box-shadow: var(--shadow-warm);
            border-color: var(--color-primary);
            transform: translateY(-2px);
        }

        .card-small {
            height: 120px;
            background: linear-gradient(135deg, var(--color-neutral-100) 0%, var(--color-neutral-200) 100%);
            animation: pulse 2s ease-in-out infinite;
        }

        .card-large {
            min-height: 300px;
            background: linear-gradient(135deg, var(--color-neutral-100) 0%, var(--color-neutral-200) 100%);
            animation: pulse 2s ease-in-out infinite;
            animation-delay: 0.2s;
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: var(--shadow-warm);
            transition: all var(--transition-default);
        }

        .mobile-menu-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(252, 191, 73, 0.3);
        }

        .mobile-menu-toggle svg {
            width: 24px;
            height: 24px;
            stroke: white;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 0.8;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(-100%);
                opacity: 0;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 280px;
                transform: translateX(-100%);
                transition: transform var(--transition-default);
                z-index: 999;
                box-shadow: var(--shadow-hard);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
                animation: slideIn 0.3s ease-out forwards;
            }

            .sidebar.collapsed {
                width: 280px;
            }

            .sidebar.collapsed .logo-text,
            .sidebar.collapsed .nav-link span,
            .sidebar.collapsed .user-name {
                opacity: 1;
                width: auto;
            }

            .mobile-menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .dashboard {
                padding: 80px 20px 20px;
            }

            .overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(10, 17, 40, 0.5);
                z-index: 998;
            }

            .overlay.active {
                display: block;
            }
        }

        @media (max-width: 480px) {
            .dashboard-grid.top {
                grid-template-columns: 1fr;
            }

            .dashboard-grid.bottom {
                grid-template-columns: 1fr;
            }
        }

        /* Desktop hover effect */
        @media (min-width: 769px) {
            .sidebar {
                cursor: pointer;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
    </button>

    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div>
                <!-- Logo -->
                <div class="logo-container">
                    <div class="logo-icon"></div>
                    <span class="logo-text">DreamyHook</span>
                </div>

                <!-- Navigation Links -->
                <nav class="nav-links">
                    <a href="#" class="nav-link active">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
                        </svg>
                        <span>Dashboard</span>
                    </a>

                    <a href="#" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                        <span>Profile</span>
                    </a>

                    <a href="#" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span>Settings</span>
                    </a>

                    <a href="#" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                        </svg>
                        <span>Logout</span>
                    </a>
                </nav>
            </div>

            <!-- User Profile -->
            <div class="user-profile">
                <div class="user-avatar">DH</div>
                <span class="user-name">DreamyHook User</span>
            </div>
        </aside>

        <!-- Dashboard Content -->
        <main class="dashboard">
            <div class="dashboard-grid top">
                <div class="dashboard-card card-small"></div>
                <div class="dashboard-card card-small"></div>
                <div class="dashboard-card card-small"></div>
                <div class="dashboard-card card-small"></div>
            </div>

            <div class="dashboard-grid bottom">
                <div class="dashboard-card card-large"></div>
                <div class="dashboard-card card-large"></div>
            </div>
        </main>
    </div>

    <script>
        // Sidebar collapse/expand on desktop
        const sidebar = document.getElementById('sidebar');
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const overlay = document.getElementById('overlay');

        // Desktop: hover to expand/collapse
        if (window.innerWidth > 768) {
            sidebar.addEventListener('mouseenter', () => {
                sidebar.classList.remove('collapsed');
            });

            sidebar.addEventListener('mouseleave', () => {
                sidebar.classList.add('collapsed');
            });

            // Start collapsed on desktop
            sidebar.classList.add('collapsed');
        }

        // Mobile: toggle menu
        mobileMenuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
        });

        // Close mobile menu when clicking overlay
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('mobile-open');
            overlay.classList.remove('active');
        });

        // Close mobile menu when clicking a link
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    // Remove active class from all links
                    navLinks.forEach(l => l.classList.remove('active'));
                    // Add active class to clicked link
                    link.classList.add('active');

                    // Close mobile menu
                    sidebar.classList.remove('mobile-open');
                    overlay.classList.remove('active');
                }
            });
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('active');
                sidebar.classList.add('collapsed');
            } else {
                sidebar.classList.remove('collapsed');
            }
        });
    </script>
</body>
</html>
