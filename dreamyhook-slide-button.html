<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DreamyHook Slide Button Component - A beautiful drag-to-confirm button with smooth animations">
    <title>DreamyHook Slide Button Component</title>

    <style>
        /* Import DreamyHook Brand Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap');

        /* ==================== CSS Reset ==================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ==================== DreamyHook Theme Variables ==================== */
        :root {
            /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
            --color-primary: #FCBF49;        /* Marigold Yellow - primary brand color */
            --color-secondary: #0A1128;      /* Midnight Blue - secondary brand color */
            --color-accent: #FFD23F;         /* Buttercup Yellow - bright accent */
            --color-coral: #FF6B4A;          /* Coral - warm accent for CTAs */
            --color-sky: #0ea5e9;            /* Sky Blue - fresh accent */

            /* Neutral Colors - Warm Gray Palette for Light Theme */
            --color-neutral-100: #ffffff;    /* Pure white */
            --color-neutral-200: #fffef9;    /* Warm white */
            --color-neutral-300: #fffdf0;    /* Cream white */
            --color-neutral-400: #fef9e7;    /* Light cream */
            --color-neutral-500: #78716c;    /* Medium warm gray */
            --color-neutral-600: #57534e;    /* Dark warm gray */
            --color-neutral-700: #44403c;    /* Very dark warm gray */
            --color-neutral-800: #292524;    /* Almost black warm gray */
            --color-neutral-900: #1c1917;    /* Near black warm */

            /* Semantic Colors */
            --color-success: #22c55e;        /* Green for success */
            --color-error: #ef4444;          /* Red for errors */
            --color-warning: #f59e0b;        /* Amber for warnings */

            /* Animation & Timing */
            --cubic-default: cubic-bezier(0.65, 0.05, 0, 1);
            --duration-default: 0.735s;
            --animation-default: var(--duration-default) var(--cubic-default);

            /* Component Specific */
            --button-track-width: 12rem;
            --button-handle-size: 2.5rem;
            --button-track-height: 2.25rem;
            --drag-max: 155px;
            --drag-threshold: 0.9;
        }

        /* ==================== Base Styles ==================== */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Poppins', ui-sans-serif, system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ==================== Demo Container ==================== */
        .demo-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3rem;
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
            padding: 2rem;
            position: relative;
        }

        .demo-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(252, 191, 73, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 210, 63, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        /* ==================== Header ==================== */
        .demo-header {
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 600px;
        }

        .demo-title {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FCBF49 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            animation: fadeInDown 0.8s ease-out forwards;
        }

        .demo-subtitle {
            font-size: 1.1rem;
            color: var(--color-neutral-600);
            font-weight: 400;
            margin-bottom: 0.5rem;
            animation: fadeInDown 0.8s ease-out 0.1s forwards;
            opacity: 0;
        }

        .demo-description {
            font-size: 0.95rem;
            color: var(--color-neutral-500);
            line-height: 1.6;
            animation: fadeInDown 0.8s ease-out 0.2s forwards;
            opacity: 0;
        }

        /* ==================== Slide Button Wrapper ==================== */
        .slide-button-container {
            position: relative;
            z-index: 1;
            animation: scaleIn 0.6s ease-out 0.3s forwards;
            opacity: 0;
        }

        .slide-button-wrapper {
            position: relative;
            width: var(--button-track-width);
            height: var(--button-track-height);
            background: var(--color-neutral-200);
            border-radius: 9999px;
            box-shadow:
                inset 0 2px 4px rgba(10, 17, 40, 0.06),
                0 2px 15px rgba(10, 17, 40, 0.05);
            overflow: visible;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .slide-button-wrapper.completed {
            width: 8rem;
            transition: width 0.5s var(--cubic-default);
        }

        /* ==================== Progress Fill Track ==================== */
        .slide-button-track {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(135deg, #FFD23F 0%, #FCBF49 100%);
            border-radius: 9999px;
            transition: width 0.1s ease-out;
            pointer-events: none;
        }

        /* ==================== Button Handle ==================== */
        .slide-button-handle {
            position: absolute;
            left: -0.125rem;
            top: 50%;
            transform: translateY(-50%);
            width: var(--button-handle-size);
            height: var(--button-handle-size);
            background: var(--color-primary);
            border: none;
            border-radius: 9999px;
            cursor: grab;
            box-shadow:
                0 4px 20px rgba(252, 191, 73, 0.3),
                0 2px 8px rgba(10, 17, 40, 0.1);
            transition: box-shadow 0.3s ease, transform 0.1s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .slide-button-handle:active {
            cursor: grabbing;
            box-shadow:
                0 6px 30px rgba(252, 191, 73, 0.5),
                0 4px 12px rgba(10, 17, 40, 0.15);
        }

        .slide-button-handle:hover:not(:active) {
            box-shadow:
                0 6px 30px rgba(252, 191, 73, 0.4),
                0 4px 12px rgba(10, 17, 40, 0.12);
        }

        .slide-button-handle.dragging {
            transform: translateY(-50%) scale(1.05);
        }

        .slide-button-handle.completed {
            width: 100%;
            height: 100%;
            left: 0;
            cursor: default;
            background: var(--color-primary);
            transition: all 0.5s var(--cubic-default);
        }

        .slide-button-handle.completed.success {
            background: var(--color-success);
        }

        .slide-button-handle.completed.error {
            background: var(--color-error);
        }

        /* ==================== Icons ==================== */
        .icon {
            width: 20px;
            height: 20px;
            color: var(--color-neutral-100);
            display: none;
            position: absolute;
            stroke-width: 2.5;
        }

        .icon.active {
            display: block;
            animation: fadeInScale 0.3s ease-in forwards;
        }

        .icon-loading.active {
            animation: spin 1s linear infinite;
        }

        /* ==================== Status Indicator ==================== */
        .status-text {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-neutral-600);
            min-height: 1.5rem;
            transition: all 0.3s ease;
        }

        .status-text.success {
            color: var(--color-success);
        }

        .status-text.error {
            color: var(--color-error);
        }

        /* ==================== Instructions ==================== */
        .instructions {
            text-align: center;
            color: var(--color-neutral-500);
            font-size: 0.875rem;
            margin-top: 1rem;
            animation: fadeIn 0.8s ease-out 0.5s forwards;
            opacity: 0;
        }

        .instructions-arrow {
            display: inline-block;
            margin-left: 0.5rem;
            animation: slideRight 1.5s ease-in-out infinite;
        }

        /* ==================== Animations ==================== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes slideRight {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(8px); }
        }

        /* ==================== Responsive Design ==================== */
        @media screen and (max-width: 768px) {
            .demo-title {
                font-size: 2rem;
            }

            .demo-subtitle {
                font-size: 1rem;
            }

            .demo-description {
                font-size: 0.875rem;
            }

            :root {
                --button-track-width: 10rem;
                --button-handle-size: 2rem;
                --button-track-height: 2rem;
                --drag-max: 128px;
            }
        }

        @media screen and (max-width: 480px) {
            .demo-container {
                padding: 1.5rem;
            }

            .demo-title {
                font-size: 1.75rem;
            }

            :root {
                --button-track-width: 9rem;
                --button-handle-size: 1.875rem;
                --button-track-height: 1.875rem;
                --drag-max: 110px;
            }
        }

        /* ==================== Print Styles ==================== */
        @media print {
            .demo-container {
                background: white;
            }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <!-- Header -->
        <div class="demo-header">
            <h1 class="demo-title">DreamyHook Slide Button</h1>
            <p class="demo-subtitle">Drag to Confirm Action</p>
            <p class="demo-description">
                A beautiful, interactive slide-to-confirm button with smooth animations
                and status feedback. Built with vanilla JavaScript.
            </p>
        </div>

        <!-- Slide Button Component -->
        <div class="slide-button-container">
            <div class="slide-button-wrapper" id="slideButtonWrapper">
                <div class="slide-button-track" id="slideTrack"></div>
                <button class="slide-button-handle" id="slideHandle" aria-label="Slide to confirm">
                    <!-- Send Icon -->
                    <svg class="icon icon-send active" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 3 3 9-3 9 19-9Z"/>
                        <path d="M6 12h16"/>
                    </svg>

                    <!-- Loading Icon -->
                    <svg class="icon icon-loading" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                    </svg>

                    <!-- Success Icon -->
                    <svg class="icon icon-success" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6 9 17l-5-5"/>
                    </svg>

                    <!-- Error Icon -->
                    <svg class="icon icon-error" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18"/>
                        <path d="m6 6 12 12"/>
                    </svg>
                </button>
            </div>

            <div class="status-text" id="statusText"></div>
            <p class="instructions">
                Drag the button to the right
                <span class="instructions-arrow">→</span>
            </p>
        </div>
    </div>

    <script>
        // ==================== Slide Button Component ====================

        class SlideButton {
            constructor(options = {}) {
                // DOM Elements
                this.wrapper = options.wrapper || document.getElementById('slideButtonWrapper');
                this.handle = options.handle || document.getElementById('slideHandle');
                this.track = options.track || document.getElementById('slideTrack');
                this.statusText = options.statusText || document.getElementById('statusText');

                // Configuration
                this.dragMax = parseInt(getComputedStyle(document.documentElement)
                    .getPropertyValue('--drag-max')) || 155;
                this.threshold = parseFloat(getComputedStyle(document.documentElement)
                    .getPropertyValue('--drag-threshold')) || 0.9;

                // State
                this.state = 'idle'; // idle, dragging, loading, success, error
                this.isDragging = false;
                this.isCompleted = false;
                this.currentX = 0;
                this.startX = 0;
                this.animationFrame = null;

                // Spring animation config
                this.springConfig = {
                    stiffness: 400,
                    damping: 40,
                    mass: 0.8
                };

                // Bind methods
                this.handlePointerDown = this.handlePointerDown.bind(this);
                this.handlePointerMove = this.handlePointerMove.bind(this);
                this.handlePointerUp = this.handlePointerUp.bind(this);

                // Initialize
                this.init();
            }

            init() {
                // Add event listeners
                this.handle.addEventListener('mousedown', this.handlePointerDown);
                this.handle.addEventListener('touchstart', this.handlePointerDown, { passive: false });

                // Prevent default drag behavior
                this.handle.addEventListener('dragstart', (e) => e.preventDefault());
            }

            handlePointerDown(e) {
                if (this.isCompleted) return;

                e.preventDefault();
                this.isDragging = true;
                this.state = 'dragging';

                // Get starting position
                const clientX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
                this.startX = clientX - this.currentX;

                // Add visual feedback
                this.handle.classList.add('dragging');

                // Add move and up listeners
                document.addEventListener('mousemove', this.handlePointerMove);
                document.addEventListener('mouseup', this.handlePointerUp);
                document.addEventListener('touchmove', this.handlePointerMove, { passive: false });
                document.addEventListener('touchend', this.handlePointerUp);

                // Hide instructions
                const instructions = document.querySelector('.instructions');
                if (instructions) {
                    instructions.style.opacity = '0';
                }
            }

            handlePointerMove(e) {
                if (!this.isDragging || this.isCompleted) return;

                e.preventDefault();

                const clientX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
                const newX = clientX - this.startX;

                // Constrain to bounds
                this.currentX = Math.max(0, Math.min(newX, this.dragMax));

                // Update position and track
                this.updatePosition(this.currentX);
                this.updateTrack(this.currentX);
            }

            handlePointerUp(e) {
                if (!this.isDragging) return;

                this.isDragging = false;
                this.handle.classList.remove('dragging');

                // Remove move and up listeners
                document.removeEventListener('mousemove', this.handlePointerMove);
                document.removeEventListener('mouseup', this.handlePointerUp);
                document.removeEventListener('touchmove', this.handlePointerMove);
                document.removeEventListener('touchend', this.handlePointerUp);

                // Check if threshold met
                const progress = this.currentX / this.dragMax;

                if (progress >= this.threshold) {
                    this.complete();
                } else {
                    this.reset();
                }
            }

            updatePosition(x) {
                this.handle.style.transform = `translateY(-50%) translateX(${x}px)`;
            }

            updateTrack(x) {
                const adjustedWidth = x + 10; // Add offset for visual effect
                this.track.style.width = `${adjustedWidth}px`;
            }

            complete() {
                this.isCompleted = true;
                this.state = 'loading';

                // Animate to final position
                this.animateToPosition(this.dragMax, 300, () => {
                    // Complete the wrapper transformation
                    this.wrapper.classList.add('completed');
                    this.handle.classList.add('completed');

                    // Show loading state
                    this.showIcon('loading');
                    this.updateStatus('Processing...', 'loading');

                    // Simulate async operation
                    setTimeout(() => {
                        // Randomly choose success or error for demo
                        const isSuccess = Math.random() > 0.2; // 80% success rate

                        if (isSuccess) {
                            this.showSuccess();
                        } else {
                            this.showError();
                        }
                    }, 2000);
                });
            }

            reset() {
                this.state = 'idle';

                // Show instructions again
                const instructions = document.querySelector('.instructions');
                if (instructions) {
                    instructions.style.opacity = '1';
                }

                // Animate back to start
                this.animateToPosition(0, 400, () => {
                    this.currentX = 0;
                });

                // Reset track
                this.animateTrack(0, 400);
            }

            showSuccess() {
                this.state = 'success';
                this.handle.classList.add('success');
                this.showIcon('success');
                this.updateStatus('Success!', 'success');

                // Auto reset after delay
                setTimeout(() => {
                    this.resetToInitial();
                }, 2500);
            }

            showError() {
                this.state = 'error';
                this.handle.classList.add('error');
                this.showIcon('error');
                this.updateStatus('Error occurred. Try again.', 'error');

                // Auto reset after delay
                setTimeout(() => {
                    this.resetToInitial();
                }, 2500);
            }

            showIcon(iconType) {
                // Hide all icons
                const icons = this.handle.querySelectorAll('.icon');
                icons.forEach(icon => icon.classList.remove('active'));

                // Show specified icon
                const icon = this.handle.querySelector(`.icon-${iconType}`);
                if (icon) {
                    icon.classList.add('active');
                }
            }

            updateStatus(message, type = '') {
                this.statusText.textContent = message;
                this.statusText.className = 'status-text';
                if (type) {
                    this.statusText.classList.add(type);
                }
            }

            resetToInitial() {
                // Reset state
                this.isCompleted = false;
                this.currentX = 0;
                this.state = 'idle';

                // Reset classes
                this.wrapper.classList.remove('completed');
                this.handle.classList.remove('completed', 'success', 'error');

                // Reset position
                this.handle.style.transform = 'translateY(-50%) translateX(0)';
                this.track.style.width = '0%';

                // Show send icon
                this.showIcon('send');

                // Clear status
                this.updateStatus('');

                // Show instructions
                const instructions = document.querySelector('.instructions');
                if (instructions) {
                    instructions.style.opacity = '1';
                }
            }

            animateToPosition(targetX, duration, onComplete) {
                const startX = this.currentX;
                const distance = targetX - startX;
                const startTime = performance.now();

                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // Ease-out cubic for spring-like feel
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const newX = startX + (distance * eased);

                    this.updatePosition(newX);

                    if (progress < 1) {
                        this.animationFrame = requestAnimationFrame(animate);
                    } else {
                        this.currentX = targetX;
                        if (onComplete) onComplete();
                    }
                };

                this.animationFrame = requestAnimationFrame(animate);
            }

            animateTrack(targetWidth, duration) {
                const startWidth = parseInt(this.track.style.width) || 0;
                const distance = targetWidth - startWidth;
                const startTime = performance.now();

                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    const eased = 1 - Math.pow(1 - progress, 3);
                    const newWidth = startWidth + (distance * eased);

                    this.track.style.width = `${newWidth}px`;

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                };

                requestAnimationFrame(animate);
            }

            destroy() {
                // Clean up event listeners
                this.handle.removeEventListener('mousedown', this.handlePointerDown);
                this.handle.removeEventListener('touchstart', this.handlePointerDown);
                document.removeEventListener('mousemove', this.handlePointerMove);
                document.removeEventListener('mouseup', this.handlePointerUp);
                document.removeEventListener('touchmove', this.handlePointerMove);
                document.removeEventListener('touchend', this.handlePointerUp);

                // Cancel any ongoing animations
                if (this.animationFrame) {
                    cancelAnimationFrame(this.animationFrame);
                }
            }
        }

        // ==================== Initialize Component ====================

        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initSlideButton);
        } else {
            initSlideButton();
        }

        function initSlideButton() {
            // Create instance
            const slideButton = new SlideButton();

            // Expose to window for debugging (optional)
            window.slideButton = slideButton;

            // Log initialization
            console.log('DreamyHook Slide Button initialized ✨');
        }
    </script>
</body>
</html>
