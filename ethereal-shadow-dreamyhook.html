<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Shadow - DreamyHook Component</title>

    <!-- Google Fonts - Inter & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* DreamyHook Brand Theme Variables */
        :root {
            /* Brand Colors */
            --color-primary: #FCBF49;        /* Marigold Yellow */
            --color-secondary: #0A1128;      /* Midnight Blue */
            --color-accent: #FFD23F;         /* Buttercup Yellow */
            --color-coral: #FF6B4A;          /* Coral */
            --color-sky: #0ea5e9;            /* Sky Blue */

            /* Neutral Colors */
            --color-neutral-100: #ffffff;
            --color-neutral-200: #fffef9;
            --color-neutral-300: #fffdf0;
            --color-neutral-500: #78716c;
            --color-neutral-900: #1c1917;

            /* Fonts */
            --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
            --font-heading: 'Poppins', ui-sans-serif, system-ui, sans-serif;
        }

        /* Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
            color: var(--color-secondary);
            width: 100%;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Main Container */
        .ethereal-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Shadow Overlay Wrapper */
        .shadow-overlay {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Shadow Effect Layer */
        .shadow-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--color-primary);
            mask-image: url('https://framerusercontent.com/images/ceBGguIpUU8luwByxuQz79t7To.png');
            mask-size: cover;
            mask-repeat: no-repeat;
            mask-position: center;
            -webkit-mask-image: url('https://framerusercontent.com/images/ceBGguIpUU8luwByxuQz79t7To.png');
            -webkit-mask-size: cover;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            filter: blur(4px);
            transition: all 0.3s ease;
        }

        .shadow-layer.animated {
            animation: shadowPulse 4s ease-in-out infinite;
        }

        /* Title Styling */
        .title-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 1200px;
        }

        .main-title {
            font-family: var(--font-heading);
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 800;
            color: var(--color-secondary);
            text-shadow: 0 4px 20px rgba(252, 191, 73, 0.3);
            margin: 0;
            padding: 0;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-family: var(--font-sans);
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 500;
            color: var(--color-neutral-500);
            margin-top: 1rem;
            opacity: 0.9;
        }

        /* Gradient Text Effect */
        .gradient-text {
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 50%, var(--color-coral) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 6s ease-in-out infinite;
        }

        /* Noise Overlay */
        .noise-overlay {
            position: absolute;
            inset: 0;
            background-image: url("https://framerusercontent.com/images/g0QcWrxr87K0ufOxIUFBakwYA8.png");
            background-size: 240px;
            background-repeat: repeat;
            opacity: 0.5;
            pointer-events: none;
            z-index: 5;
        }

        /* SVG Filter Container */
        .svg-filters {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        /* Animated Shadow Container */
        .animated-shadow-wrapper {
            position: absolute;
            inset: -100px;
        }

        /* Control Panel */
        .control-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(10, 17, 40, 0.1);
            z-index: 100;
            font-family: var(--font-sans);
            min-width: 250px;
        }

        .control-panel h3 {
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-secondary);
            margin: 0 0 15px 0;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-secondary);
            margin-bottom: 5px;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--color-accent), var(--color-primary));
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(252, 191, 73, 0.4);
        }

        .control-group input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(252, 191, 73, 0.4);
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 40px;
            border: 2px solid var(--color-neutral-300);
            border-radius: 8px;
            cursor: pointer;
        }

        .value-display {
            display: inline-block;
            font-size: 0.75rem;
            color: var(--color-neutral-500);
            margin-left: 8px;
        }

        /* Animations */
        @keyframes shadowPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.85;
            }
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -50%) translateY(0px);
            }
            50% {
                transform: translate(-50%, -50%) translateY(-20px);
            }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        /* Glow Effects */
        .glow-marigold {
            box-shadow: 0 0 30px rgba(252, 191, 73, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .control-panel {
                bottom: 10px;
                right: 10px;
                left: 10px;
                min-width: unset;
                padding: 15px;
            }

            .main-title {
                font-size: clamp(2rem, 10vw, 4rem);
            }

            .subtitle {
                font-size: clamp(0.875rem, 3vw, 1.25rem);
            }
        }

        /* Selection Styling */
        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }

        ::-moz-selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="ethereal-container">
        <!-- Shadow Overlay Component -->
        <div class="shadow-overlay" id="shadowOverlay">
            <!-- SVG Filters -->
            <svg class="svg-filters" aria-hidden="true">
                <defs>
                    <filter id="etherealFilter">
                        <feTurbulence
                            id="turbulence"
                            result="undulation"
                            numOctaves="2"
                            baseFrequency="0.0005 0.002"
                            seed="0"
                            type="turbulence"
                        />
                        <feColorMatrix
                            id="colorMatrix"
                            in="undulation"
                            type="hueRotate"
                            values="0"
                        />
                        <feColorMatrix
                            in="dist"
                            result="circulation"
                            type="matrix"
                            values="4 0 0 0 1  4 0 0 0 1  4 0 0 0 1  1 0 0 0 0"
                        />
                        <feDisplacementMap
                            in="SourceGraphic"
                            in2="circulation"
                            scale="100"
                            result="dist"
                            id="displacementMap1"
                        />
                        <feDisplacementMap
                            in="dist"
                            in2="undulation"
                            scale="100"
                            result="output"
                            id="displacementMap2"
                        />
                    </filter>
                </defs>
            </svg>

            <!-- Animated Shadow Wrapper -->
            <div class="animated-shadow-wrapper">
                <div class="shadow-layer animated" id="shadowLayer"></div>
            </div>

            <!-- Title Section -->
            <div class="title-wrapper floating">
                <h1 class="main-title">
                    <span class="gradient-text">Ethereal Shadows</span>
                </h1>
                <p class="subtitle">DreamyHook Component Library</p>
            </div>

            <!-- Noise Overlay -->
            <div class="noise-overlay" id="noiseOverlay"></div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <h3>Shadow Controls</h3>

            <div class="control-group">
                <label for="colorPicker">
                    Shadow Color
                </label>
                <input type="color" id="colorPicker" value="#FCBF49">
            </div>

            <div class="control-group">
                <label for="scaleSlider">
                    Animation Scale
                    <span class="value-display" id="scaleValue">100</span>
                </label>
                <input type="range" id="scaleSlider" min="0" max="100" value="100">
            </div>

            <div class="control-group">
                <label for="speedSlider">
                    Animation Speed
                    <span class="value-display" id="speedValue">90</span>
                </label>
                <input type="range" id="speedSlider" min="1" max="100" value="90">
            </div>

            <div class="control-group">
                <label for="noiseOpacity">
                    Noise Opacity
                    <span class="value-display" id="noiseValue">50</span>
                </label>
                <input type="range" id="noiseOpacity" min="0" max="100" value="50">
            </div>

            <div class="control-group">
                <label for="blurSlider">
                    Blur Amount
                    <span class="value-display" id="blurValue">4px</span>
                </label>
                <input type="range" id="blurSlider" min="0" max="20" value="4">
            </div>
        </div>
    </div>

    <script>
        // Ethereal Shadow Component - Vanilla JavaScript
        class EtherealShadow {
            constructor(options = {}) {
                this.shadowLayer = document.getElementById('shadowLayer');
                this.noiseOverlay = document.getElementById('noiseOverlay');
                this.colorMatrix = document.getElementById('colorMatrix');
                this.displacementMap1 = document.getElementById('displacementMap1');
                this.displacementMap2 = document.getElementById('displacementMap2');
                this.turbulence = document.getElementById('turbulence');

                // Default options
                this.config = {
                    color: options.color || '#FCBF49',
                    animationScale: options.animationScale || 100,
                    animationSpeed: options.animationSpeed || 90,
                    noiseOpacity: options.noiseOpacity || 50,
                    blurAmount: options.blurAmount || 4
                };

                this.animationFrame = null;
                this.hueRotate = 0;

                this.init();
            }

            init() {
                this.updateColor(this.config.color);
                this.updateAnimationScale(this.config.animationScale);
                this.updateNoiseOpacity(this.config.noiseOpacity);
                this.updateBlur(this.config.blurAmount);
                this.startAnimation();
            }

            mapRange(value, fromLow, fromHigh, toLow, toHigh) {
                if (fromLow === fromHigh) return toLow;
                const percentage = (value - fromLow) / (fromHigh - fromLow);
                return toLow + percentage * (toHigh - toLow);
            }

            updateColor(color) {
                this.config.color = color;
                this.shadowLayer.style.backgroundColor = color;
            }

            updateAnimationScale(scale) {
                this.config.animationScale = scale;
                const displacementScale = this.mapRange(scale, 1, 100, 20, 100);

                if (this.displacementMap1 && this.displacementMap2) {
                    this.displacementMap1.setAttribute('scale', displacementScale);
                    this.displacementMap2.setAttribute('scale', displacementScale);
                }

                // Update turbulence frequency
                const freqX = this.mapRange(scale, 0, 100, 0.001, 0.0005);
                const freqY = this.mapRange(scale, 0, 100, 0.004, 0.002);
                if (this.turbulence) {
                    this.turbulence.setAttribute('baseFrequency', `${freqX} ${freqY}`);
                }

                // Apply SVG filter
                if (scale > 0) {
                    this.shadowLayer.style.filter = `url(#etherealFilter) blur(${this.config.blurAmount}px)`;
                } else {
                    this.shadowLayer.style.filter = 'none';
                }
            }

            updateAnimationSpeed(speed) {
                this.config.animationSpeed = speed;
            }

            updateNoiseOpacity(opacity) {
                this.config.noiseOpacity = opacity;
                if (this.noiseOverlay) {
                    this.noiseOverlay.style.opacity = opacity / 100;
                }
            }

            updateBlur(blur) {
                this.config.blurAmount = blur;
                if (this.config.animationScale > 0) {
                    this.shadowLayer.style.filter = `url(#etherealFilter) blur(${blur}px)`;
                }
            }

            startAnimation() {
                const animate = () => {
                    // Calculate animation duration based on speed (1-100)
                    const duration = this.mapRange(this.config.animationSpeed, 1, 100, 1000, 50);
                    const increment = 360 / (duration / 16.67); // 60fps

                    this.hueRotate = (this.hueRotate + increment) % 360;

                    if (this.colorMatrix) {
                        this.colorMatrix.setAttribute('values', this.hueRotate.toString());
                    }

                    this.animationFrame = requestAnimationFrame(animate);
                };

                animate();
            }

            stopAnimation() {
                if (this.animationFrame) {
                    cancelAnimationFrame(this.animationFrame);
                }
            }

            destroy() {
                this.stopAnimation();
            }
        }

        // Initialize the component
        const etherealShadow = new EtherealShadow({
            color: '#FCBF49',
            animationScale: 100,
            animationSpeed: 90,
            noiseOpacity: 50,
            blurAmount: 4
        });

        // Control Panel Event Listeners
        const colorPicker = document.getElementById('colorPicker');
        const scaleSlider = document.getElementById('scaleSlider');
        const speedSlider = document.getElementById('speedSlider');
        const noiseOpacity = document.getElementById('noiseOpacity');
        const blurSlider = document.getElementById('blurSlider');

        const scaleValue = document.getElementById('scaleValue');
        const speedValue = document.getElementById('speedValue');
        const noiseValue = document.getElementById('noiseValue');
        const blurValue = document.getElementById('blurValue');

        colorPicker.addEventListener('input', (e) => {
            etherealShadow.updateColor(e.target.value);
        });

        scaleSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            scaleValue.textContent = value;
            etherealShadow.updateAnimationScale(value);
        });

        speedSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            speedValue.textContent = value;
            etherealShadow.updateAnimationSpeed(value);
        });

        noiseOpacity.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            noiseValue.textContent = value;
            etherealShadow.updateNoiseOpacity(value);
        });

        blurSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            blurValue.textContent = `${value}px`;
            etherealShadow.updateBlur(value);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            etherealShadow.destroy();
        });

        // Log initialization
        console.log('%c🌟 Ethereal Shadow Component Initialized', 'color: #FCBF49; font-size: 16px; font-weight: bold;');
        console.log('%cDreamyHook Component Library', 'color: #0A1128; font-size: 12px;');
    </script>
</body>
</html>
