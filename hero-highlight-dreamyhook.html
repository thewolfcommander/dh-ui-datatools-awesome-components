<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Hero Highlight Component</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ------------------------- DreamyHook Theme Variables ------------------------- */
        :root {
            /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
            --color-primary: #FCBF49;        /* Marigold Yellow - primary brand color */
            --color-secondary: #0A1128;      /* Midnight Blue - secondary brand color */
            --color-accent: #FFD23F;         /* Buttercup Yellow - bright accent */
            --color-coral: #FF6B4A;          /* Coral - warm accent for CTAs */
            --color-sky: #0ea5e9;            /* Sky Blue - fresh accent */

            /* Neutral Colors - Warm Gray Palette for Light Theme */
            --color-neutral-100: #ffffff;    /* Pure white */
            --color-neutral-200: #fffef9;    /* Warm white */
            --color-neutral-300: #fffdf0;    /* Cream white */
            --color-neutral-400: #fef9e7;    /* Light cream */
            --color-neutral-500: #78716c;    /* Medium warm gray */
            --color-neutral-600: #57534e;    /* Dark warm gray */
            --color-neutral-700: #44403c;    /* Very dark warm gray */
            --color-neutral-800: #292524;    /* Almost black warm gray */
            --color-neutral-900: #1c1917;    /* Near black warm */

            /* Theme-Specific Colors */
            --theme-background: #fffef9;     /* Warm white background */
        }

        /* ------------------------- Reset & Base Styles ------------------------- */
        *, *::before, *::after {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            background-color: var(--theme-background);
            color: var(--color-secondary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
            text-shadow: none;
        }

        /* ------------------------- Hero Highlight Container ------------------------- */
        .hero-highlight-container {
            position: relative;
            min-height: 40rem;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-neutral-100);
            overflow: hidden;
            width: 100%;
        }

        /* Dot Pattern Backgrounds */
        .dot-pattern-light,
        .dot-pattern-hover {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #d4d4d4 1px, transparent 1px);
            background-size: 16px 16px;
            opacity: 0.7;
        }

        .dot-pattern-hover {
            background-image: radial-gradient(circle, var(--color-primary) 1.5px, transparent 1.5px);
            background-size: 16px 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            -webkit-mask-image: radial-gradient(200px circle at 50% 50%, black 0%, transparent 100%);
            mask-image: radial-gradient(200px circle at 50% 50%, black 0%, transparent 100%);
            -webkit-mask-position: 50% 50%;
            mask-position: 50% 50%;
        }

        .hero-highlight-container:hover .dot-pattern-hover {
            opacity: 1;
        }

        /* Content Container */
        .hero-content {
            position: relative;
            z-index: 20;
            max-width: 64rem;
            padding: 2rem;
            text-align: center;
        }

        /* Heading Styles */
        .hero-heading {
            font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-secondary);
            line-height: 1.5;
            margin: 0;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.5s ease-out 0.2s forwards;
        }

        @media (min-width: 768px) {
            .hero-heading {
                font-size: 3rem;
            }
        }

        @media (min-width: 1024px) {
            .hero-heading {
                font-size: 3.5rem;
                line-height: 1.3;
            }
        }

        /* Highlight Span */
        .highlight {
            position: relative;
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 50%, var(--color-coral) 100%);
            background-size: 0% 100%;
            background-repeat: no-repeat;
            background-position: left center;
            color: var(--color-secondary);
            font-weight: 700;
            animation: highlightExpand 2s ease-in-out 0.7s forwards;
        }

        /* ------------------------- Animations ------------------------- */
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            50% {
                transform: translateY(-5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes highlightExpand {
            0% {
                background-size: 0% 100%;
            }
            100% {
                background-size: 100% 100%;
            }
        }

        /* Glow Effects */
        .glow-marigold {
            box-shadow: 0 0 20px rgba(252, 191, 73, 0.3);
            transition: box-shadow 0.3s ease;
        }

        .glow-marigold:hover {
            box-shadow: 0 0 30px rgba(252, 191, 73, 0.5);
        }

        /* ------------------------- Responsive Design ------------------------- */
        @media (max-width: 767px) {
            .hero-highlight-container {
                min-height: 30rem;
            }

            .hero-content {
                padding: 1rem;
            }

            .hero-heading {
                font-size: 1.5rem;
            }
        }

        /* ------------------------- Gradient Background Option ------------------------- */
        .hero-highlight-container.with-gradient {
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
        }

        /* ------------------------- Additional Decorative Elements ------------------------- */
        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(252, 191, 73, 0.15) 0%, transparent 70%);
            top: -150px;
            right: -150px;
            animation: float 6s ease-in-out infinite;
        }

        .circle-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 210, 63, 0.1) 0%, transparent 70%);
            bottom: -200px;
            left: -200px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>
    <!-- Hero Highlight Component -->
    <div class="hero-highlight-container with-gradient" id="heroContainer">
        <!-- Decorative Circles -->
        <div class="decorative-circle circle-1"></div>
        <div class="decorative-circle circle-2"></div>

        <!-- Static Dot Pattern -->
        <div class="dot-pattern-light"></div>

        <!-- Mouse-Following Dot Pattern -->
        <div class="dot-pattern-hover" id="dotPatternHover"></div>

        <!-- Hero Content -->
        <div class="hero-content">
            <h1 class="hero-heading">
                Transform your data into
                <span class="highlight">beautiful, actionable insights</span>
                with DreamyHook's powerful tools.
            </h1>
        </div>
    </div>

    <!-- JavaScript for Mouse-Following Effect -->
    <script>
        // Mouse-following dot pattern effect
        const heroContainer = document.getElementById('heroContainer');
        const dotPatternHover = document.getElementById('dotPatternHover');

        heroContainer.addEventListener('mousemove', (e) => {
            const rect = heroContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Update the mask position to follow the mouse
            const maskImage = `radial-gradient(200px circle at ${x}px ${y}px, black 0%, transparent 100%)`;
            dotPatternHover.style.webkitMaskImage = maskImage;
            dotPatternHover.style.maskImage = maskImage;
        });

        // Optional: Add smooth scrolling if you have multiple sections
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DreamyHook Hero Highlight Component loaded successfully!');

            // You can add more interactive features here
            // Example: Add a subtle parallax effect on scroll
            window.addEventListener('scroll', () => {
                const scrolled = window.pageYOffset;
                const heroContent = document.querySelector('.hero-content');
                if (heroContent) {
                    heroContent.style.transform = `translateY(${scrolled * 0.3}px)`;
                }
            });
        });

        // Keyboard accessibility - restart animation on focus
        const heroHeading = document.querySelector('.hero-heading');
        heroHeading.addEventListener('focus', () => {
            heroHeading.style.animation = 'none';
            setTimeout(() => {
                heroHeading.style.animation = 'slideUp 0.5s ease-out 0.2s forwards';
            }, 10);
        });

        // Optional: Add resize handling for responsive behavior
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                console.log('Window resized - Hero component responsive');
            }, 250);
        });

        // Performance optimization: Throttle mouse move events
        let lastMouseMoveTime = 0;
        const throttleDelay = 16; // ~60fps

        heroContainer.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMouseMoveTime < throttleDelay) {
                return;
            }
            lastMouseMoveTime = now;

            const rect = heroContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            requestAnimationFrame(() => {
                const maskImage = `radial-gradient(200px circle at ${x}px ${y}px, black 0%, transparent 100%)`;
                dotPatternHover.style.webkitMaskImage = maskImage;
                dotPatternHover.style.maskImage = maskImage;
            });
        });
    </script>
</body>
</html>
