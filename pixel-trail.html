<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Interactive Pixel Trail Component</title>

    <!-- Google Fonts - Inter and Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==================== DreamyHook Theme Variables ==================== */
        :root {
            /* Brand Colors */
            --color-primary: #FCBF49;        /* Marigold Yellow */
            --color-secondary: #0A1128;      /* Midnight Blue */
            --color-accent: #FFD23F;         /* Buttercup Yellow */
            --color-coral: #FF6B4A;          /* Coral */
            --color-sky: #0ea5e9;            /* Sky Blue */

            /* Neutral Colors - Warm Gray Palette */
            --color-neutral-100: #ffffff;    /* Pure white */
            --color-neutral-200: #fffef9;    /* Warm white */
            --color-neutral-300: #fffdf0;    /* Cream white */
            --color-neutral-400: #fef9e7;    /* Light cream */
            --color-neutral-500: #78716c;    /* Medium warm gray */
            --color-neutral-900: #1c1917;    /* Near black warm */

            /* Semantic Colors */
            --color-success: #22c55e;
            --color-warning: #f59e0b;
            --color-error: #ef4444;

            /* Typography */
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;

            /* Spacing */
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;

            /* Border Radius */
            --radius-sm: 0.5rem;
            --radius-md: 1rem;
            --radius-lg: 1.5rem;
            --radius-xl: 2rem;
            --radius-full: 9999px;

            /* Shadows */
            --shadow-soft: 0 2px 15px 0 rgba(10, 17, 40, 0.05);
            --shadow-medium: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            --shadow-hard: 0 10px 40px 0 rgba(10, 17, 40, 0.15);
            --shadow-glow-marigold: 0 0 30px 0 rgba(252, 191, 73, 0.25);
            --shadow-glow-buttercup: 0 0 30px 0 rgba(255, 210, 63, 0.3);

            /* Animation */
            --transition-default: 0.3s ease;
            --transition-slow: 0.6s ease;
        }

        /* ==================== Reset & Base Styles ==================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--color-neutral-200) 0%, var(--color-neutral-400) 100%);
            color: var(--color-secondary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ==================== Typography ==================== */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        /* ==================== Pixel Trail Container ==================== */
        .pixel-trail-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
        }

        /* ==================== Pixel Grid Background ==================== */
        .pixel-grid {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto;
        }

        .pixel-row {
            display: flex;
            flex-wrap: nowrap;
        }

        .pixel {
            opacity: 0;
            background-color: var(--color-coral);
            border-radius: var(--radius-full);
            transition: opacity 0.5s ease;
            will-change: opacity;
        }

        .pixel.active {
            opacity: 1;
        }

        /* ==================== Content Layer ==================== */
        .content-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            padding: var(--spacing-xl);
            max-width: 1200px;
        }

        .main-heading {
            font-size: clamp(2rem, 5vw, 4.5rem);
            color: var(--color-secondary);
            margin-bottom: var(--spacing-md);
            font-weight: 800;
            background: linear-gradient(135deg, var(--color-secondary) 0%, #243b53 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeSlideUp 0.8s ease-out forwards;
        }

        .sub-heading {
            font-size: clamp(0.875rem, 2vw, 1.5rem);
            color: var(--color-neutral-500);
            font-weight: 400;
            margin-bottom: var(--spacing-lg);
            animation: fadeSlideUp 1s ease-out forwards;
            animation-delay: 0.2s;
            opacity: 0;
        }

        .feature-badge {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-md);
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 100%);
            color: var(--color-secondary);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: var(--shadow-glow-buttercup);
            animation: fadeSlideUp 1.2s ease-out forwards, pulse 3s ease-in-out infinite;
            animation-delay: 0.4s, 1.6s;
            opacity: 0;
            margin-top: var(--spacing-md);
        }

        /* ==================== Footer ==================== */
        .footer-text {
            position: absolute;
            bottom: var(--spacing-lg);
            right: var(--spacing-lg);
            font-size: clamp(0.75rem, 1.5vw, 1rem);
            color: var(--color-neutral-500);
            z-index: 10;
            pointer-events: none;
            animation: fadeIn 1.5s ease-out forwards;
            animation-delay: 0.6s;
            opacity: 0;
        }

        /* ==================== Info Panel ==================== */
        .info-panel {
            position: absolute;
            top: var(--spacing-lg);
            left: var(--spacing-lg);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: var(--spacing-md);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-medium);
            z-index: 10;
            max-width: 300px;
            animation: fadeSlideRight 0.8s ease-out forwards;
            animation-delay: 0.8s;
            opacity: 0;
        }

        .info-panel h3 {
            font-size: 1rem;
            color: var(--color-secondary);
            margin-bottom: var(--spacing-xs);
            font-weight: 600;
        }

        .info-panel p {
            font-size: 0.875rem;
            color: var(--color-neutral-500);
            margin-bottom: var(--spacing-xs);
            line-height: 1.5;
        }

        .info-panel .stat {
            font-weight: 600;
            color: var(--color-primary);
        }

        /* ==================== Animations ==================== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeSlideRight {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: var(--shadow-glow-buttercup);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 40px 0 rgba(255, 210, 63, 0.5);
            }
        }

        /* ==================== Responsive Design ==================== */
        @media screen and (max-width: 768px) {
            .info-panel {
                position: static;
                margin: var(--spacing-md);
                max-width: none;
                animation: fadeIn 1s ease-out forwards;
                animation-delay: 0.8s;
            }

            .content-layer {
                padding: var(--spacing-md);
            }

            .footer-text {
                bottom: var(--spacing-sm);
                right: var(--spacing-sm);
                left: var(--spacing-sm);
                text-align: center;
            }
        }

        /* ==================== Selection ==================== */
        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }

        ::-moz-selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="pixel-trail-container" id="pixelTrailContainer">
        <!-- Pixel Grid (Background Layer) -->
        <div class="pixel-grid" id="pixelGrid"></div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h3>Pixel Trail Effect</h3>
            <p>Move your mouse over the canvas to create an interactive trail effect.</p>
            <p><span class="stat" id="pixelCount">0</span> pixels</p>
            <p>Size: <span class="stat" id="pixelSize">0px</span></p>
        </div>

        <!-- Content Layer (Foreground) -->
        <div class="content-layer">
            <h1 class="main-heading">DreamyHook ✨ Components</h1>
            <p class="sub-heading">Interactive pixel trail with vanilla JavaScript</p>
            <div class="feature-badge">Hover to interact</div>
        </div>

        <!-- Footer -->
        <p class="footer-text">Built with performance in mind.</p>
    </div>

    <script>
        /**
         * ==================== Pixel Trail Component ====================
         * A vanilla JavaScript implementation of an interactive pixel trail effect
         * Optimized for performance with debouncing and efficient DOM manipulation
         */

        class PixelTrail {
            constructor(options = {}) {
                // Configuration
                this.config = {
                    pixelSize: this.getResponsivePixelSize(),
                    fadeDuration: options.fadeDuration || 500,
                    fadeDelay: options.fadeDelay || 1200,
                    pixelColor: options.pixelColor || '#FF6B4A'
                };

                // DOM Elements
                this.container = document.getElementById('pixelTrailContainer');
                this.grid = document.getElementById('pixelGrid');

                // State
                this.pixels = new Map();
                this.dimensions = { width: 0, height: 0 };
                this.gridSize = { columns: 0, rows: 0 };

                // Debounce timer
                this.resizeTimer = null;

                // Bind methods
                this.handleMouseMove = this.handleMouseMove.bind(this);
                this.handleResize = this.handleResize.bind(this);

                // Initialize
                this.init();
            }

            /**
             * Get responsive pixel size based on viewport width
             */
            getResponsivePixelSize() {
                return window.innerWidth < 768 ? 48 : 80;
            }

            /**
             * Initialize the component
             */
            init() {
                this.updateDimensions();
                this.createGrid();
                this.attachEventListeners();
                this.updateInfoPanel();
            }

            /**
             * Update container dimensions
             */
            updateDimensions() {
                const rect = this.container.getBoundingClientRect();
                this.dimensions = {
                    width: rect.width,
                    height: rect.height
                };
            }

            /**
             * Calculate grid size
             */
            calculateGridSize() {
                this.gridSize = {
                    columns: Math.ceil(this.dimensions.width / this.config.pixelSize),
                    rows: Math.ceil(this.dimensions.height / this.config.pixelSize)
                };
            }

            /**
             * Create the pixel grid
             */
            createGrid() {
                this.calculateGridSize();

                // Clear existing grid
                this.grid.innerHTML = '';
                this.pixels.clear();

                // Create rows and pixels
                for (let row = 0; row < this.gridSize.rows; row++) {
                    const rowElement = document.createElement('div');
                    rowElement.className = 'pixel-row';

                    for (let col = 0; col < this.gridSize.columns; col++) {
                        const pixel = this.createPixel(col, row);
                        rowElement.appendChild(pixel);

                        // Store pixel reference
                        const key = `${col}-${row}`;
                        this.pixels.set(key, pixel);
                    }

                    this.grid.appendChild(rowElement);
                }
            }

            /**
             * Create a single pixel element
             */
            createPixel(col, row) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                pixel.style.width = `${this.config.pixelSize}px`;
                pixel.style.height = `${this.config.pixelSize}px`;
                pixel.dataset.col = col;
                pixel.dataset.row = row;

                return pixel;
            }

            /**
             * Handle mouse move event
             */
            handleMouseMove(event) {
                const rect = this.container.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                // Calculate grid position
                const col = Math.floor(x / this.config.pixelSize);
                const row = Math.floor(y / this.config.pixelSize);

                // Activate pixel
                this.activatePixel(col, row);
            }

            /**
             * Activate a pixel with animation
             */
            activatePixel(col, row) {
                const key = `${col}-${row}`;
                const pixel = this.pixels.get(key);

                if (!pixel) return;

                // Add active class
                pixel.classList.add('active');

                // Remove active class after delay + duration
                setTimeout(() => {
                    pixel.classList.remove('active');
                }, this.config.fadeDelay + this.config.fadeDuration);
            }

            /**
             * Handle window resize with debouncing
             */
            handleResize() {
                clearTimeout(this.resizeTimer);

                this.resizeTimer = setTimeout(() => {
                    // Update pixel size based on new viewport
                    this.config.pixelSize = this.getResponsivePixelSize();

                    // Recreate grid
                    this.updateDimensions();
                    this.createGrid();
                    this.updateInfoPanel();
                }, 250);
            }

            /**
             * Attach event listeners
             */
            attachEventListeners() {
                this.container.addEventListener('mousemove', this.handleMouseMove);
                window.addEventListener('resize', this.handleResize);
            }

            /**
             * Update info panel with current stats
             */
            updateInfoPanel() {
                const totalPixels = this.gridSize.columns * this.gridSize.rows;
                document.getElementById('pixelCount').textContent = totalPixels.toLocaleString();
                document.getElementById('pixelSize').textContent = this.config.pixelSize;
            }

            /**
             * Destroy the component
             */
            destroy() {
                this.container.removeEventListener('mousemove', this.handleMouseMove);
                window.removeEventListener('resize', this.handleResize);
                clearTimeout(this.resizeTimer);
                this.grid.innerHTML = '';
                this.pixels.clear();
            }
        }

        /**
         * ==================== Initialize on DOM Ready ====================
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Create pixel trail instance
            const pixelTrail = new PixelTrail({
                fadeDuration: 500,   // 500ms fade duration
                fadeDelay: 1200,     // 1200ms delay before fade
                pixelColor: '#FF6B4A' // Coral color
            });

            // Optional: Expose to window for debugging
            window.pixelTrail = pixelTrail;

            console.log('🎨 DreamyHook Pixel Trail initialized successfully!');
            console.log(`Grid size: ${pixelTrail.gridSize.columns} × ${pixelTrail.gridSize.rows}`);
            console.log(`Pixel size: ${pixelTrail.config.pixelSize}px`);
        });
    </script>
</body>
</html>
