<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Radial Orbital Timeline</title>

    <!-- Google Fonts - DreamyHook Brand Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ========================= DreamyHook Brand Theme Variables ========================= */
        :root {
            /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
            --color-primary: #FCBF49;        /* Marigold Yellow - primary brand color */
            --color-secondary: #0A1128;      /* Midnight Blue - secondary brand color */
            --color-accent: #FFD23F;         /* Buttercup Yellow - bright accent */
            --color-coral: #FF6B4A;          /* Coral - warm accent for CTAs */
            --color-sky: #0ea5e9;            /* Sky Blue - fresh accent */

            /* Neutral Colors - Warm Gray Palette for Light Theme */
            --color-neutral-100: #ffffff;    /* Pure white */
            --color-neutral-200: #fffef9;    /* Warm white */
            --color-neutral-300: #fffdf0;    /* Cream white */
            --color-neutral-400: #fef9e7;    /* Light cream */
            --color-neutral-500: #78716c;    /* Medium warm gray */
            --color-neutral-600: #57534e;    /* Dark warm gray */
            --color-neutral-700: #44403c;    /* Very dark warm gray */
            --color-neutral-800: #292524;    /* Almost black warm gray */
            --color-neutral-900: #1c1917;    /* Near black warm */

            /* Semantic Color Assignments */
            --color-light: var(--color-neutral-200);
            --color-dark: var(--color-secondary);

            /* Functional Colors */
            --color-error: #ef4444;
            --color-success: #22c55e;
            --color-warning: #f59e0b;

            /* Theme-Specific Colors */
            --theme-background: #fffef9;
            --theme-card-bg: rgba(255, 254, 249, 0.98);

            /* Typography */
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
            --font-heading: "Poppins", ui-sans-serif, system-ui, sans-serif;
        }

        /* ========================= Reset & Base Styles ========================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, var(--theme-background) 0%, var(--color-neutral-300) 100%);
            color: var(--color-dark);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background-color: var(--color-primary);
            color: var(--color-neutral-100);
        }

        /* ========================= Container & Layout ========================= */
        .timeline-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .orbit-wrapper {
            position: relative;
            width: 100%;
            max-width: 64rem;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            transition: transform 0.7s ease;
        }

        /* ========================= Central Hub ========================= */
        .central-hub {
            position: absolute;
            width: 4rem;
            height: 4rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 50%, var(--color-coral) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 0 30px rgba(252, 191, 73, 0.5);
            animation: pulse-hub 2s ease-in-out infinite;
        }

        .central-hub::before {
            content: '';
            position: absolute;
            width: 5rem;
            height: 5rem;
            border-radius: 50%;
            border: 2px solid rgba(252, 191, 73, 0.3);
            animation: ping-ring 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .central-hub::after {
            content: '';
            position: absolute;
            width: 6rem;
            height: 6rem;
            border-radius: 50%;
            border: 2px solid rgba(255, 210, 63, 0.2);
            animation: ping-ring 2s cubic-bezier(0, 0, 0.2, 1) infinite 0.5s;
        }

        .central-hub-core {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(10, 17, 40, 0.1);
        }

        /* ========================= Orbit Ring ========================= */
        .orbit-ring {
            position: absolute;
            width: 25rem;
            height: 25rem;
            border-radius: 50%;
            border: 2px solid rgba(252, 191, 73, 0.15);
        }

        /* ========================= Timeline Nodes ========================= */
        .timeline-node {
            position: absolute;
            cursor: pointer;
            transition: all 0.7s cubic-bezier(0.65, 0.05, 0, 1);
        }

        .node-glow {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(252, 191, 73, 0.3) 0%, rgba(252, 191, 73, 0) 70%);
            transition: all 0.3s ease;
        }

        .node-glow.pulse-effect {
            animation: pulse-glow 1s ease-in-out infinite;
        }

        .node-circle {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid;
            transition: all 0.3s ease;
            position: relative;
        }

        .node-circle.status-completed {
            background-color: var(--color-secondary);
            border-color: var(--color-primary);
            color: var(--color-neutral-100);
        }

        .node-circle.status-in-progress {
            background-color: var(--color-neutral-100);
            border-color: var(--color-accent);
            color: var(--color-secondary);
            box-shadow: 0 0 20px rgba(255, 210, 63, 0.4);
        }

        .node-circle.status-pending {
            background-color: rgba(10, 17, 40, 0.2);
            border-color: rgba(252, 191, 73, 0.4);
            color: var(--color-neutral-600);
        }

        .node-circle.expanded {
            background-color: var(--color-primary);
            border-color: var(--color-accent);
            color: var(--color-secondary);
            transform: scale(1.5);
            box-shadow: 0 4px 25px rgba(252, 191, 73, 0.5);
        }

        .node-circle.related {
            background-color: rgba(252, 191, 73, 0.5);
            border-color: var(--color-accent);
            animation: pulse-node 1s ease-in-out infinite;
        }

        .node-icon {
            width: 1rem;
            height: 1rem;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .node-title {
            position: absolute;
            top: 3rem;
            white-space: nowrap;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            color: var(--color-secondary);
            font-family: var(--font-heading);
        }

        .node-title.expanded {
            color: var(--color-primary);
            transform: scale(1.25);
            font-weight: 700;
        }

        /* ========================= Info Card ========================= */
        .info-card {
            position: absolute;
            top: 5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 16rem;
            background: var(--theme-card-bg);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(252, 191, 73, 0.3);
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(10, 17, 40, 0.15), 0 0 30px rgba(252, 191, 73, 0.1);
            overflow: visible;
            animation: slide-up 0.3s ease-out forwards;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: -0.75rem;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 0.75rem;
            background: rgba(252, 191, 73, 0.5);
        }

        .card-header {
            padding: 1rem 1rem 0.5rem;
            border-bottom: 1px solid rgba(252, 191, 73, 0.15);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            border-radius: 9999px;
            text-transform: uppercase;
        }

        .status-badge.completed {
            background-color: var(--color-secondary);
            color: var(--color-neutral-100);
            border: 1px solid var(--color-primary);
        }

        .status-badge.in-progress {
            background-color: var(--color-accent);
            color: var(--color-secondary);
            border: 1px solid var(--color-primary);
        }

        .status-badge.pending {
            background-color: rgba(10, 17, 40, 0.1);
            color: var(--color-neutral-600);
            border: 1px solid rgba(252, 191, 73, 0.3);
        }

        .card-date {
            font-size: 0.625rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--color-neutral-600);
        }

        .card-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-top: 0.5rem;
            color: var(--color-secondary);
            font-family: var(--font-heading);
        }

        .card-content {
            padding: 1rem;
            font-size: 0.75rem;
            color: var(--color-neutral-700);
            line-height: 1.5;
        }

        .energy-section {
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(252, 191, 73, 0.15);
        }

        .energy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.625rem;
            margin-bottom: 0.25rem;
            color: var(--color-neutral-700);
        }

        .energy-label {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .energy-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--color-secondary);
        }

        .energy-bar {
            width: 100%;
            height: 0.25rem;
            background-color: rgba(252, 191, 73, 0.15);
            border-radius: 9999px;
            overflow: hidden;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(to right, var(--color-accent), var(--color-primary), var(--color-coral));
            transition: width 0.3s ease;
            border-radius: 9999px;
        }

        .connections-section {
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(252, 191, 73, 0.15);
        }

        .connections-header {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-bottom: 0.5rem;
        }

        .connections-title {
            font-size: 0.625rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            color: var(--color-neutral-700);
        }

        .connections-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .connection-button {
            display: flex;
            align-items: center;
            height: 1.5rem;
            padding: 0 0.5rem;
            font-size: 0.625rem;
            border: 1px solid rgba(252, 191, 73, 0.3);
            background-color: transparent;
            color: var(--color-neutral-700);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-sans);
            font-weight: 500;
        }

        .connection-button:hover {
            background-color: rgba(252, 191, 73, 0.15);
            color: var(--color-secondary);
            border-color: var(--color-primary);
        }

        .connection-arrow {
            margin-left: 0.25rem;
            width: 0.5rem;
            height: 0.5rem;
            opacity: 0.6;
        }

        /* ========================= Animations ========================= */
        @keyframes pulse-hub {
            0%, 100% {
                box-shadow: 0 0 30px rgba(252, 191, 73, 0.5);
            }
            50% {
                box-shadow: 0 0 50px rgba(252, 191, 73, 0.8);
            }
        }

        @keyframes ping-ring {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            75%, 100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        @keyframes pulse-glow {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes pulse-node {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes slide-up {
            0% {
                transform: translateX(-50%) translateY(10px);
                opacity: 0;
            }
            100% {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ========================= Responsive Design ========================= */
        @media screen and (max-width: 767px) {
            .orbit-ring {
                width: 18rem;
                height: 18rem;
            }

            .info-card {
                width: 14rem;
                font-size: 0.7rem;
            }

            .node-circle {
                width: 2rem;
                height: 2rem;
            }

            .node-title {
                font-size: 0.65rem;
            }
        }

        /* ========================= Utility Classes ========================= */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="timeline-container" id="timelineContainer">
        <div class="orbit-wrapper">
            <div class="orbit-container" id="orbitContainer">
                <!-- Central Hub -->
                <div class="central-hub">
                    <div class="central-hub-core"></div>
                </div>

                <!-- Orbit Ring -->
                <div class="orbit-ring"></div>

                <!-- Timeline nodes will be inserted here dynamically -->
            </div>
        </div>
    </div>

    <script>
        // ========================= Timeline Data =========================
        const timelineData = [
            {
                id: 1,
                title: "Planning",
                date: "Jan 2024",
                content: "Project planning and requirements gathering phase.",
                category: "Planning",
                icon: "calendar",
                relatedIds: [2],
                status: "completed",
                energy: 100,
            },
            {
                id: 2,
                title: "Design",
                date: "Feb 2024",
                content: "UI/UX design and system architecture.",
                category: "Design",
                icon: "file-text",
                relatedIds: [1, 3],
                status: "completed",
                energy: 90,
            },
            {
                id: 3,
                title: "Development",
                date: "Mar 2024",
                content: "Core features implementation and testing.",
                category: "Development",
                icon: "code",
                relatedIds: [2, 4],
                status: "in-progress",
                energy: 60,
            },
            {
                id: 4,
                title: "Testing",
                date: "Apr 2024",
                content: "User testing and bug fixes.",
                category: "Testing",
                icon: "user",
                relatedIds: [3, 5],
                status: "pending",
                energy: 30,
            },
            {
                id: 5,
                title: "Release",
                date: "May 2024",
                content: "Final deployment and release.",
                category: "Release",
                icon: "clock",
                relatedIds: [4],
                status: "pending",
                energy: 10,
            },
        ];

        // ========================= SVG Icons =========================
        const icons = {
            calendar: '<svg class="node-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>',
            'file-text': '<svg class="node-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>',
            code: '<svg class="node-icon" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>',
            user: '<svg class="node-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>',
            clock: '<svg class="node-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
            zap: '<svg viewBox="0 0 24 24" style="width: 0.625rem; height: 0.625rem; stroke: currentColor; stroke-width: 2; fill: none;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
            link: '<svg viewBox="0 0 24 24" style="width: 0.625rem; height: 0.625rem; stroke: currentColor; stroke-width: 2; fill: none;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>',
            'arrow-right': '<svg class="connection-arrow" viewBox="0 0 24 24" style="stroke: currentColor; stroke-width: 2; fill: none;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>',
        };

        // ========================= State Management =========================
        let expandedItems = {};
        let rotationAngle = 0;
        let autoRotate = true;
        let pulseEffect = {};
        let centerOffset = { x: 0, y: 0 };
        let activeNodeId = null;
        let rotationInterval = null;

        // ========================= Helper Functions =========================
        function calculateNodePosition(index, total) {
            const angle = ((index / total) * 360 + rotationAngle) % 360;
            const radius = 200;
            const radian = (angle * Math.PI) / 180;

            const x = radius * Math.cos(radian) + centerOffset.x;
            const y = radius * Math.sin(radian) + centerOffset.y;

            const zIndex = Math.round(100 + 50 * Math.cos(radian));
            const opacity = Math.max(0.4, Math.min(1, 0.4 + 0.6 * ((1 + Math.sin(radian)) / 2)));

            return { x, y, angle, zIndex, opacity };
        }

        function getRelatedItems(itemId) {
            const currentItem = timelineData.find(item => item.id === itemId);
            return currentItem ? currentItem.relatedIds : [];
        }

        function isRelatedToActive(itemId) {
            if (!activeNodeId) return false;
            const relatedItems = getRelatedItems(activeNodeId);
            return relatedItems.includes(itemId);
        }

        function getStatusClass(status) {
            return status.replace('-', '-');
        }

        // ========================= Node Creation =========================
        function createTimelineNode(item, index) {
            const position = calculateNodePosition(index, timelineData.length);
            const isExpanded = expandedItems[item.id];
            const isRelated = isRelatedToActive(item.id);
            const isPulsing = pulseEffect[item.id];

            const node = document.createElement('div');
            node.className = 'timeline-node';
            node.id = `node-${item.id}`;
            node.style.transform = `translate(${position.x}px, ${position.y}px)`;
            node.style.zIndex = isExpanded ? 200 : position.zIndex;
            node.style.opacity = isExpanded ? 1 : position.opacity;

            // Glow effect
            const glowSize = item.energy * 0.5 + 40;
            const glow = document.createElement('div');
            glow.className = `node-glow ${isPulsing ? 'pulse-effect' : ''}`;
            glow.style.width = `${glowSize}px`;
            glow.style.height = `${glowSize}px`;
            glow.style.left = `-${(glowSize - 40) / 2}px`;
            glow.style.top = `-${(glowSize - 40) / 2}px`;
            node.appendChild(glow);

            // Node circle
            const circle = document.createElement('div');
            circle.className = `node-circle status-${item.status}`;
            if (isExpanded) circle.classList.add('expanded');
            if (isRelated) circle.classList.add('related');
            circle.innerHTML = icons[item.icon];
            node.appendChild(circle);

            // Node title
            const title = document.createElement('div');
            title.className = `node-title ${isExpanded ? 'expanded' : ''}`;
            title.textContent = item.title;
            node.appendChild(title);

            // Info card
            if (isExpanded) {
                const card = createInfoCard(item);
                node.appendChild(card);
            }

            // Event listener
            node.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleItem(item.id);
            });

            return node;
        }

        // ========================= Info Card Creation =========================
        function createInfoCard(item) {
            const card = document.createElement('div');
            card.className = 'info-card';

            const statusText = item.status === 'completed' ? 'COMPLETE' :
                             item.status === 'in-progress' ? 'IN PROGRESS' : 'PENDING';

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-meta">
                        <div class="status-badge ${getStatusClass(item.status)}">${statusText}</div>
                        <span class="card-date">${item.date}</span>
                    </div>
                    <div class="card-title">${item.title}</div>
                </div>
                <div class="card-content">
                    <p>${item.content}</p>

                    <div class="energy-section">
                        <div class="energy-header">
                            <span class="energy-label">
                                ${icons.zap}
                                Energy Level
                            </span>
                            <span class="energy-value">${item.energy}%</span>
                        </div>
                        <div class="energy-bar">
                            <div class="energy-fill" style="width: ${item.energy}%"></div>
                        </div>
                    </div>

                    ${item.relatedIds.length > 0 ? `
                        <div class="connections-section">
                            <div class="connections-header">
                                ${icons.link}
                                <h4 class="connections-title">Connected Nodes</h4>
                            </div>
                            <div class="connections-list">
                                ${item.relatedIds.map(relatedId => {
                                    const relatedItem = timelineData.find(i => i.id === relatedId);
                                    return `
                                        <button class="connection-button" onclick="event.stopPropagation(); toggleItem(${relatedId})">
                                            ${relatedItem?.title || ''}
                                            ${icons['arrow-right']}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            return card;
        }

        // ========================= Toggle Item =========================
        function toggleItem(id) {
            // Reset all expanded items except current
            const newExpandedItems = {};
            newExpandedItems[id] = !expandedItems[id];
            expandedItems = newExpandedItems;

            if (expandedItems[id]) {
                activeNodeId = id;
                autoRotate = false;

                const relatedItems = getRelatedItems(id);
                const newPulseEffect = {};
                relatedItems.forEach(relId => {
                    newPulseEffect[relId] = true;
                });
                pulseEffect = newPulseEffect;
            } else {
                activeNodeId = null;
                autoRotate = true;
                pulseEffect = {};
            }

            renderNodes();
        }

        // ========================= Render Nodes =========================
        function renderNodes() {
            const orbitContainer = document.getElementById('orbitContainer');

            // Remove existing nodes
            const existingNodes = orbitContainer.querySelectorAll('.timeline-node');
            existingNodes.forEach(node => node.remove());

            // Create and append new nodes
            timelineData.forEach((item, index) => {
                const node = createTimelineNode(item, index);
                orbitContainer.appendChild(node);
            });
        }

        // ========================= Auto Rotation =========================
        function startAutoRotation() {
            if (rotationInterval) clearInterval(rotationInterval);

            rotationInterval = setInterval(() => {
                if (autoRotate) {
                    rotationAngle = (rotationAngle + 0.3) % 360;
                    renderNodes();
                }
            }, 50);
        }

        // ========================= Container Click Handler =========================
        document.getElementById('timelineContainer').addEventListener('click', (e) => {
            if (e.target.id === 'timelineContainer' || e.target.id === 'orbitContainer' || e.target.classList.contains('orbit-ring')) {
                expandedItems = {};
                activeNodeId = null;
                pulseEffect = {};
                autoRotate = true;
                renderNodes();
            }
        });

        // ========================= Initialize =========================
        function init() {
            renderNodes();
            startAutoRotation();
        }

        // Start the timeline
        init();
    </script>
</body>
</html>
