<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyHook - Interactive 3D Scene</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Spline Runtime -->
    <script type="module" src="https://unpkg.com/@splinetool/runtime@1.9.28/build/runtime.js"></script>

    <style>
        /* DreamyHook Brand Theme - Light Mode */

        :root {
            /* Brand Colors */
            --color-primary: #FCBF49;        /* Marigold Yellow */
            --color-secondary: #0A1128;      /* Midnight Blue */
            --color-accent: #FFD23F;         /* Buttercup Yellow */
            --color-coral: #FF6B4A;          /* Coral accent */
            --color-sky: #0ea5e9;            /* Sky Blue */

            /* Neutral Colors */
            --color-white: #ffffff;
            --color-warm-white: #fffef9;
            --color-cream: #fef9e7;
            --color-light-cream: #fffdf0;
            --color-neutral-500: #78716c;
            --color-neutral-700: #44403c;
            --color-neutral-900: #1c1917;

            /* Shadows */
            --shadow-soft: 0 2px 15px 0 rgba(10, 17, 40, 0.05);
            --shadow-medium: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
            --shadow-marigold: 0 0 30px 0 rgba(252, 191, 73, 0.25);
            --shadow-buttercup: 0 0 30px 0 rgba(255, 210, 63, 0.3);

            /* Typography */
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-warm-white);
            color: var(--color-secondary);
            line-height: 1.6;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background: var(--color-white);
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: var(--shadow-medium);
            position: relative;
            height: 500px;
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-marigold);
        }

        /* Spotlight Effect */
        .spotlight-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .spotlight {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                rgba(255, 210, 63, 0.2) 0%,
                rgba(252, 191, 73, 0.1) 40%,
                transparent 70%);
            filter: blur(40px);
            opacity: 0;
            transition: opacity 0.3s ease;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .card:hover .spotlight {
            opacity: 1;
        }

        .content-wrapper {
            display: flex;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .content-left {
            flex: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg,
                rgba(255, 254, 249, 0.95) 0%,
                rgba(255, 253, 240, 0.9) 100%);
        }

        .content-title {
            font-family: var(--font-heading);
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg,
                var(--color-primary) 0%,
                var(--color-coral) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .content-description {
            color: var(--color-neutral-700);
            font-size: 1.125rem;
            max-width: 500px;
            line-height: 1.7;
        }

        .content-right {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg,
                var(--color-cream) 0%,
                var(--color-white) 100%);
        }

        /* Spline Scene */
        #spline-scene {
            width: 100%;
            height: 100%;
        }

        /* Loading Animation */
        .loader-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: var(--color-warm-white);
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(252, 191, 73, 0.2);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media screen and (max-width: 991px) {
            .content-wrapper {
                flex-direction: column;
            }

            .content-left,
            .content-right {
                flex: none;
            }

            .content-left {
                padding: 2rem;
            }

            .content-title {
                font-size: 2.5rem;
            }

            .card {
                height: 700px;
            }
        }

        @media screen and (max-width: 767px) {
            body {
                padding: 1rem;
            }

            .content-left {
                padding: 1.5rem;
            }

            .content-title {
                font-size: 2rem;
            }

            .content-description {
                font-size: 1rem;
            }

            .card {
                height: 650px;
            }
        }

        @media screen and (max-width: 479px) {
            .content-title {
                font-size: 1.75rem;
            }

            .spotlight {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="card">
            <!-- Spotlight Effect -->
            <div class="spotlight-container">
                <div class="spotlight" id="spotlight"></div>
            </div>

            <!-- Content -->
            <div class="content-wrapper">
                <!-- Left Content -->
                <div class="content-left">
                    <h1 class="content-title">Interactive 3D</h1>
                    <p class="content-description">
                        Bring your UI to life with beautiful 3D scenes. Create immersive experiences
                        that capture attention and enhance your design with DreamyHook's signature style.
                    </p>
                </div>

                <!-- Right Content - Spline Scene -->
                <div class="content-right">
                    <div class="loader-container" id="loader">
                        <div class="loader"></div>
                    </div>
                    <spline-viewer
                        id="spline-scene"
                        url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"
                        style="display: none;">
                    </spline-viewer>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Spotlight Effect
        const card = document.getElementById('card');
        const spotlight = document.getElementById('spotlight');

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            spotlight.style.left = x + 'px';
            spotlight.style.top = y + 'px';
        });

        // Spline Scene Loading
        const splineScene = document.getElementById('spline-scene');
        const loader = document.getElementById('loader');

        // Show scene when loaded
        splineScene.addEventListener('load', () => {
            loader.style.display = 'none';
            splineScene.style.display = 'block';
        });

        // Fallback: show after 3 seconds even if load event doesn't fire
        setTimeout(() => {
            if (loader.style.display !== 'none') {
                loader.style.display = 'none';
                splineScene.style.display = 'block';
            }
        }, 3000);
    </script>
</body>
</html>
