<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamyHook - Testimonials Marquee Component</title>

  <!-- Google Fonts - Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ========================= DreamyHook Theme Variables ========================= */
    :root {
      /* Brand Colors - Marigold Yellow, Buttercup Yellow, Midnight Blue */
      --color-primary: #FCBF49;        /* Marigold Yellow - primary brand color */
      --color-secondary: #0A1128;      /* Midnight Blue - secondary brand color */
      --color-accent: #FFD23F;         /* Buttercup Yellow - bright accent */
      --color-coral: #FF6B4A;          /* Coral - warm accent for CTAs */
      --color-sky: #0ea5e9;            /* Sky Blue - fresh accent */

      /* Neutral Colors - Warm Gray Palette for Light Theme */
      --color-neutral-100: #ffffff;    /* Pure white */
      --color-neutral-200: #fffef9;    /* Warm white */
      --color-neutral-300: #fffdf0;    /* Cream white */
      --color-neutral-400: #fef9e7;    /* Light cream */
      --color-neutral-500: #78716c;    /* Medium warm gray */
      --color-neutral-600: #57534e;    /* Dark warm gray */
      --color-neutral-700: #44403c;    /* Very dark warm gray */
      --color-neutral-800: #292524;    /* Almost black warm gray */
      --color-neutral-900: #1c1917;    /* Near black warm */

      /* Semantic Colors */
      --color-success: #22c55e;
      --color-warning: #f59e0b;
      --color-error: #ef4444;

      /* Typography */
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-heading: "Poppins", ui-sans-serif, system-ui, sans-serif;

      /* Shadows */
      --shadow-soft: 0 2px 15px 0 rgba(10, 17, 40, 0.05);
      --shadow-medium: 0 4px 25px 0 rgba(10, 17, 40, 0.1);
      --shadow-hard: 0 10px 40px 0 rgba(10, 17, 40, 0.15);
      --shadow-colored: 0 4px 25px 0 rgba(252, 191, 73, 0.25);
      --shadow-marigold-glow: 0 0 30px 0 rgba(252, 191, 73, 0.25);
      --shadow-yellow-glow: 0 0 30px 0 rgba(255, 210, 63, 0.3);
      --shadow-warm: 0 4px 20px 0 rgba(252, 191, 73, 0.15);

      /* Animation */
      --duration-default: 0.735s;
      --cubic-default: cubic-bezier(0.65, 0.05, 0, 1);

      /* Marquee Specific */
      --marquee-duration: 40s;
      --marquee-gap: 1rem;
    }

    /* ========================= Reset & Base Styles ========================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-neutral-200);
      color: var(--color-secondary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Text Selection - Marigold yellow background */
    ::selection {
      background-color: var(--color-primary);
      color: var(--color-neutral-100);
      text-shadow: none;
    }

    ::-moz-selection {
      background-color: var(--color-primary);
      color: var(--color-neutral-100);
      text-shadow: none;
    }

    /* ========================= Testimonials Section Styles ========================= */
    .testimonials-section {
      background: linear-gradient(135deg, #fffef9 0%, #fef9e7 100%);
      padding: 3rem 1rem;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .testimonials-section {
        padding: 6rem 1rem;
      }
    }

    @media (min-width: 768px) {
      .testimonials-section {
        padding: 8rem 1rem;
      }
    }

    .section-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      text-align: center;
    }

    @media (min-width: 640px) {
      .section-container {
        gap: 4rem;
      }
    }

    /* ========================= Header Content ========================= */
    .section-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 0 1rem;
    }

    @media (min-width: 640px) {
      .section-header {
        gap: 2rem;
      }
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: 1.875rem;
      font-weight: 600;
      line-height: 1.2;
      max-width: 720px;
      color: var(--color-secondary);
      background: linear-gradient(135deg, var(--color-secondary) 0%, var(--color-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @media (min-width: 640px) {
      .section-title {
        font-size: 3rem;
      }
    }

    .section-description {
      font-size: 1rem;
      font-weight: 500;
      color: var(--color-neutral-500);
      max-width: 600px;
    }

    @media (min-width: 640px) {
      .section-description {
        font-size: 1.25rem;
      }
    }

    /* ========================= Marquee Container ========================= */
    .marquee-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .marquee-container {
      display: flex;
      overflow: hidden;
      padding: 0.5rem;
      gap: var(--marquee-gap);
      user-select: none;
    }

    .marquee-content {
      display: flex;
      flex-shrink: 0;
      justify-content: space-around;
      gap: var(--marquee-gap);
      animation: marquee var(--marquee-duration) linear infinite;
      will-change: transform;
    }

    .marquee-container:hover .marquee-content {
      animation-play-state: paused;
    }

    /* ========================= Gradient Fade Overlays ========================= */
    .fade-left, .fade-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 33.333%;
      pointer-events: none;
      display: none;
    }

    @media (min-width: 640px) {
      .fade-left, .fade-right {
        display: block;
      }
    }

    .fade-left {
      left: 0;
      background: linear-gradient(to right, var(--color-neutral-200), transparent);
    }

    .fade-right {
      right: 0;
      background: linear-gradient(to left, var(--color-neutral-200), transparent);
    }

    /* ========================= Testimonial Card Styles ========================= */
    .testimonial-card {
      display: flex;
      flex-direction: column;
      border-radius: 0.5rem;
      border-top: 2px solid var(--color-primary);
      background: linear-gradient(to bottom, rgba(252, 191, 73, 0.1), rgba(255, 254, 249, 0.5));
      padding: 1.5rem;
      text-align: left;
      max-width: 320px;
      min-width: 320px;
      transition: all 0.3s var(--cubic-default);
      box-shadow: var(--shadow-soft);
      text-decoration: none;
      color: inherit;
    }

    .testimonial-card:hover {
      background: linear-gradient(to bottom, rgba(252, 191, 73, 0.15), rgba(255, 254, 249, 0.7));
      box-shadow: var(--shadow-warm);
      transform: translateY(-2px);
    }

    @media (min-width: 640px) {
      .testimonial-card {
        padding: 1.5rem;
      }
    }

    /* ========================= Card Header (Author Info) ========================= */
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .avatar {
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--color-primary);
      box-shadow: var(--shadow-soft);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .author-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .author-name {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1;
      color: var(--color-secondary);
      margin-bottom: 0.25rem;
    }

    .author-handle {
      font-size: 0.875rem;
      color: var(--color-neutral-500);
      line-height: 1;
    }

    /* ========================= Card Content ========================= */
    .card-text {
      font-size: 0.875rem;
      color: var(--color-neutral-600);
      line-height: 1.6;
    }

    @media (min-width: 640px) {
      .card-text {
        font-size: 1rem;
      }
    }

    /* ========================= Marquee Animation ========================= */
    @keyframes marquee {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(calc(-100% - var(--marquee-gap)));
      }
    }

    /* ========================= Utility Classes ========================= */
    .glow-marigold {
      box-shadow: var(--shadow-marigold-glow);
    }

    .glow-buttercup {
      box-shadow: var(--shadow-yellow-glow);
    }

    /* ========================= Responsive Adjustments ========================= */
    @media (max-width: 479px) {
      .testimonial-card {
        min-width: 280px;
        max-width: 280px;
        padding: 1rem;
      }

      .section-title {
        font-size: 1.5rem;
      }

      .section-description {
        font-size: 0.875rem;
      }
    }
  </style>
</head>
<body>

  <!-- ========================= Testimonials Section ========================= -->
  <section class="testimonials-section">
    <div class="section-container">

      <!-- Section Header -->
      <div class="section-header">
        <h2 class="section-title">Trusted by developers worldwide</h2>
        <p class="section-description">
          Join thousands of developers who are already building the future with our AI platform
        </p>
      </div>

      <!-- Marquee Container -->
      <div class="marquee-wrapper">
        <div class="marquee-container">
          <div class="marquee-content" id="marqueeContent">
            <!-- Testimonial cards will be injected here by JavaScript -->
          </div>
        </div>

        <!-- Gradient Fade Overlays -->
        <div class="fade-left"></div>
        <div class="fade-right"></div>
      </div>

    </div>
  </section>

  <!-- ========================= JavaScript ========================= -->
  <script>
    // Testimonials Data
    const testimonials = [
      {
        author: {
          name: "Emma Thompson",
          handle: "@emmaai",
          avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&h=150&fit=crop&crop=face"
        },
        text: "Using this AI platform has transformed how we handle data analysis. The speed and accuracy are unprecedented.",
        href: "https://twitter.com/emmaai"
      },
      {
        author: {
          name: "David Park",
          handle: "@davidtech",
          avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop&crop=face"
        },
        text: "The API integration is flawless. We've reduced our development time by 60% since implementing this solution.",
        href: "https://twitter.com/davidtech"
      },
      {
        author: {
          name: "Sofia Rodriguez",
          handle: "@sofiaml",
          avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&h=150&fit=crop&crop=face"
        },
        text: "Finally, an AI tool that actually understands context! The accuracy in natural language processing is impressive."
      },
      {
        author: {
          name: "Michael Chen",
          handle: "@michaeldev",
          avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&h=150&fit=crop&crop=face"
        },
        text: "The best investment we've made this year. Our productivity has skyrocketed and our clients love the results.",
        href: "https://twitter.com/michaeldev"
      },
      {
        author: {
          name: "Aisha Patel",
          handle: "@aishacode",
          avatar: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&h=150&fit=crop&crop=face"
        },
        text: "Incredible platform! The machine learning models are top-notch and the documentation is crystal clear.",
        href: "https://twitter.com/aishacode"
      },
      {
        author: {
          name: "James Wilson",
          handle: "@jamesbuild",
          avatar: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150&h=150&fit=crop&crop=face"
        },
        text: "Game-changer for our startup. We went from prototype to production in half the time we expected."
      }
    ];

    // Create Testimonial Card HTML
    function createTestimonialCard(testimonial) {
      const { author, text, href } = testimonial;
      const tag = href ? 'a' : 'div';
      const hrefAttr = href ? `href="${href}" target="_blank" rel="noopener noreferrer"` : '';

      return `
        <${tag} class="testimonial-card" ${hrefAttr}>
          <div class="card-header">
            <div class="avatar">
              <img src="${author.avatar}" alt="${author.name}" loading="lazy">
            </div>
            <div class="author-info">
              <h3 class="author-name">${author.name}</h3>
              <p class="author-handle">${author.handle}</p>
            </div>
          </div>
          <p class="card-text">${text}</p>
        </${tag}>
      `;
    }

    // Initialize Marquee
    function initMarquee() {
      const marqueeContent = document.getElementById('marqueeContent');

      // Create 4 sets of testimonials for smooth infinite scroll
      let cardsHTML = '';
      for (let setIndex = 0; setIndex < 4; setIndex++) {
        testimonials.forEach(testimonial => {
          cardsHTML += createTestimonialCard(testimonial);
        });
      }

      marqueeContent.innerHTML = cardsHTML;
    }

    // Initialize on DOM Content Loaded
    document.addEventListener('DOMContentLoaded', initMarquee);

    // Optional: Pause animation on window blur for performance
    let wasPlaying = true;
    window.addEventListener('blur', () => {
      const marquee = document.querySelector('.marquee-content');
      if (marquee) {
        wasPlaying = getComputedStyle(marquee).animationPlayState === 'running';
        marquee.style.animationPlayState = 'paused';
      }
    });

    window.addEventListener('focus', () => {
      const marquee = document.querySelector('.marquee-content');
      if (marquee && wasPlaying) {
        marquee.style.animationPlayState = 'running';
      }
    });
  </script>

</body>
</html>
